# Automated dependency updates.
#
# There was no dependency update mechanism at all before this file: no
# dependabot config, no renovate, nothing. That is the direct cause of a
# directly-required Go module sitting on a version with four published
# advisories for months. CRA Article 13(8) obliges timely security updates
# through the declared support period in SECURITY.md, and "someone notices"
# is not a mechanism.
#
# Grouping policy: minor and patch bumps arrive as one PR per ecosystem per
# week, because reviewing forty single-line PRs is how a team learns to
# rubber-stamp them. Majors stay ungrouped so each one gets read.
#
# Security updates are not affected by the weekly schedule. Dependabot opens
# those as soon as an advisory lands, and they are deliberately left
# ungrouped so a fix is never blocked behind an unrelated bump.

version: 2

updates:
  # ------------------------------------------------------------------------
  # Go CLI
  # ------------------------------------------------------------------------
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - cli
    commit-message:
      prefix: "chore(deps)"
    groups:
      gomod-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ------------------------------------------------------------------------
  # Backend (Python)
  # ------------------------------------------------------------------------
  # `/` and not `/backend`: backend/ holds the package source but no manifest.
  # The declared dependencies live in the root pyproject.toml.
  #
  # The hash-pinned locks under requirements/ and .github/requirements/ are
  # compiled from pyproject.toml with uv, so dependabot is deliberately not
  # pointed at them: it would rewrite a lock without regenerating it from the
  # constraint it came from. It watches pyproject.toml, and when a bump lands
  # the locks are regenerated with the uv command recorded at the top of each
  # .txt file.
  #
  # "Deliberately not pointed at them" was a comment, not a setting, and the
  # pip updater walks the whole directory. It found requirements/runtime.txt,
  # recognised no pip-compile header (the header says uv), and fell back to
  # editing the file line by line. PR #537 (7a69f6b4) is what that looks like:
  # pydantic 2.13.4 -> 2.13.5 next to pydantic-core 2.46.4 -> 2.48.0, when
  # pydantic 2.13.5 requires pydantic-core==2.46.5 exactly. It also deleted
  # pip and setuptools from requirements/docker-build.txt (both declared in
  # docker-build.in) and stripped every environment marker from it. Result:
  # pip ResolutionImpossible, and main's Docker and Release builds red.
  #
  # exclude-paths makes the comment enforceable. Dependabot proposes version
  # changes in pyproject.toml only; the locks are regenerated by a human (or
  # by the follow-up commit on the same PR) with the uv command recorded at
  # the top of each .txt file. The "requirements resolve" job in ci.yml is the
  # backstop for anything that still slips through.
  - package-ecosystem: pip
    directory: /
    exclude-paths:
      - requirements/**
      - .github/requirements/**
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
    # fastmcp 4.x requires mcp>=2 (fastmcp-slim client/server extra). mcp 2
    # dropped streamablehttp_client, which mcp_client_pool.py imports at
    # module load. Keep 3.x until the mcp v2 client migration lands.
    ignore:
      - dependency-name: "fastmcp"
        versions: ["4.x"]
    # Group order matters: dependabot assigns a dependency to the first group
    # whose patterns match, so the lockstep families have to come before the
    # catch-all pip-minor-patch group.
    #
    # These families pin each other with `==` (or with a floor equal to their
    # own version), so a PR that moves one member and not the others is not a
    # risky update, it is an unresolvable one. Each `==` below was read off the
    # package metadata on PyPI, not guessed:
    #
    #   pydantic 2.13.5        -> pydantic-core==2.46.5
    #   psycopg 3.3.5          -> psycopg-binary==3.3.5, psycopg-c==3.3.5
    #   opentelemetry-sdk      -> opentelemetry-api==<same>,
    #                             opentelemetry-semantic-conventions==<same>
    #   otlp exporters         -> opentelemetry-proto==<same>,
    #                             opentelemetry-exporter-otlp-proto-common==<same>
    #   boto3 1.43.89          -> botocore>=1.43.89,<1.44.0
    #   grpcio-status 1.83.1   -> grpcio>=1.83.1
    #
    # sqlalchemy is deliberately not one of these: its extras (`asyncio`) are
    # extras of the same distribution, and alembic only asks for
    # SQLAlchemy>=1.4.23, so the two can move independently without breaking.
    #
    # Unlike the catch-all group these also apply to security updates. The
    # policy above keeps security updates ungrouped so a fix is never blocked
    # behind an unrelated bump, but for a family that pins itself exactly,
    # "one PR per package" produces a PR that cannot be merged at all. Grouping
    # only the family keeps the fix unblocked and installable.
    groups:
      pydantic:
        patterns:
          - pydantic
          - pydantic-core
          - pydantic-settings
          - pydantic-extra-types
      pydantic-security:
        applies-to: security-updates
        patterns:
          - pydantic
          - pydantic-core
          - pydantic-settings
          - pydantic-extra-types
      psycopg:
        patterns:
          - psycopg
          - psycopg-binary
          - psycopg-c
          - psycopg-pool
      psycopg-security:
        applies-to: security-updates
        patterns:
          - psycopg
          - psycopg-binary
          - psycopg-c
          - psycopg-pool
      opentelemetry:
        patterns:
          - opentelemetry-*
      opentelemetry-security:
        applies-to: security-updates
        patterns:
          - opentelemetry-*
      # botocore is bumped by boto3's own release train and s3transfer carries
      # a matching botocore range; awscli is not a dependency here but is
      # listed so it cannot arrive on its own later.
      aws-sdk:
        patterns:
          - boto3
          - botocore
          - s3transfer
          - awscli
      aws-sdk-security:
        applies-to: security-updates
        patterns:
          - boto3
          - botocore
          - s3transfer
          - awscli
      grpc:
        patterns:
          - grpcio
          - grpcio-*
      grpc-security:
        applies-to: security-updates
        patterns:
          - grpcio
          - grpcio-*
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ------------------------------------------------------------------------
  # Frontend (npm)
  # ------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ------------------------------------------------------------------------
  # GitHub Actions
  # ------------------------------------------------------------------------
  # Every action in this repo is pinned to a commit SHA with a version
  # comment, which OpenSSF Scorecard requires and which dependabot
  # understands: it rewrites the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
