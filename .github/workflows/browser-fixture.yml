# Browser fixture QA flow (opt-in).
#
# Runs the model-free fixture-site flow end to end on the runner: the real
# egress proxy, the fixture site, and the pinned Playwright MCP, wired by
# environments/preloop/browser/enable.sh. Not part of the required CI check
# and not on the default PR path: it runs only when a PR touches the fixture
# site, the flow script, the browser profile or the proxy, or on demand.
#
# The Docker-hosted variant (scripts/tests/flow_environment_integration.py
# --browser) needs a published environment image and stays a manual step.

name: Browser fixture flow

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runs-on value chosen by the CI picker
        type: string
        default: '"ubuntu-24.04"'
      full:
        type: boolean
        default: false
      checkout_ref:
        type: string
        default: ''
  workflow_dispatch:

concurrency:
  # Cancel superseded PR work; every main/release/manual run keeps its own slot.
  group: browser-fixture-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  browser-fixture:
    permissions:
      contents: read
    name: Browser fixture flow
    # Hosted ubuntu-24.04 unless the CI picker hands over an idle local slot.
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: environments/egress-proxy/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: environments/preloop/tools/package-lock.json

      - name: Install pinned Playwright MCP and Chromium
        working-directory: environments/preloop/tools
        run: |
          npm ci
          # --with-deps needs root (apt). Local slots have the Chromium system
          # libraries preinstalled; see .github/self-hosted-runners.md.
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        uses: ./.github/actions/install-ci-python-deps

      - name: Run the fixture flow and its boundary cases
        env:
          PRELOOP_DISABLE_TELEMETRY: "true"
          PRELOOP_BROWSER_CI: "1"
        run: pytest -q --tb=short backend/tests/services/test_browser_fixture_flow.py
