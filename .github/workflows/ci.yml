# Preloop Open Source - CI Pipeline
# Runs unit tests on pull requests and pushes to main
# Builds and pushes Docker images on main and version tags (not on PRs —
# release.yml already publishes images, and a multi-arch QEMU build is the
# long tail after tests go green).
#
# PR jobs are path-filtered so a docs-only or frontend-only change does not
# pay for eight Postgres shards. Filters are job-level, not workflow-level:
# a workflow `on.pull_request.paths` skip made stacked PRs look clean because
# no checks ran at all. `main` and tags always run every suite.
#
# Make the `CI` aggregator the required check. Individual shards may be
# skipped; skipped-because-paths-did-not-change is success, a red shard is not.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  # No base-branch filter: a PR should get CI regardless of what it targets.
  # Restricting this to `main` meant stacked PRs — ones opened against another
  # in-flight branch rather than main — silently ran no checks at all, so they
  # looked clean because nothing had examined them.
  pull_request:
  # Manual runs force fresh tests and never publish images.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Changed paths (PRs only; push/tag forces every output true)
  # ==========================================================================

  changes:
    name: Detect changed paths [merge ${{ github.sha }}]
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.out.outputs.backend }}
      frontend: ${{ steps.out.outputs.frontend }}
      cli: ${{ steps.out.outputs.cli }}
      plugins: ${{ steps.out.outputs.plugins }}
      helm: ${{ steps.out.outputs.helm }}
      workflow: ${{ steps.out.outputs.workflow }}
      requirements: ${{ steps.out.outputs.requirements }}
      fingerprint: ${{ steps.reuse.outputs.fingerprint }}
      reuse_backend: ${{ steps.reuse.outputs.reuse_backend }}
      reuse_frontend: ${{ steps.reuse.outputs.reuse_frontend }}
      reuse_plugins: ${{ steps.reuse.outputs.reuse_plugins }}
      reuse_cli: ${{ steps.reuse.outputs.reuse_cli }}
      evidence_backend: ${{ steps.reuse.outputs.evidence_backend }}
      evidence_frontend: ${{ steps.reuse.outputs.evidence_frontend }}
      evidence_plugins: ${{ steps.reuse.outputs.evidence_plugins }}
      evidence_cli: ${{ steps.reuse.outputs.evidence_cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout ${{ github.sha }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Find successful identical-input tests
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          PRELOOP_DISABLE_TELEMETRY: "true"
        run: python3 -I scripts/ci/reuse_tests.py

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'requirements/**'
              - '.github/requirements/app-dev.txt'
              - '.github/requirements/coverage.txt'
              - '.github/requirements/test.txt'
              - '.github/requirements/test.in'
              - 'scripts/init_db.py'
            frontend:
              - 'frontend/**'
            cli:
              - 'cli/**'
            plugins:
              - 'runtime-plugins/**'
              - 'pyproject.toml'
              - '.github/requirements/runtime-plugin-test.txt'
              - '.github/requirements/runtime-test.txt'
              - '.github/requirements/runtime-test.in'
            helm:
              - 'helm/**'
              - 'scripts/helm-render-check.sh'
            workflow:
              - '.github/workflows/ci.yml'
              - 'scripts/**'
              - 'tests/**'
              - 'conftest.py'
              - 'pytest.ini'
              - '.test_durations'
              - 'VERSION'
              - 'openapi.yaml'
              - '.pre-commit-config.yaml'
            # Anything that can change what a hash-pinned lock resolves to.
            requirements:
              - 'requirements/**'
              - '.github/requirements/**'
              - 'pyproject.toml'
              - 'Dockerfile'

      - name: Set job outputs
        id: out
        env:
          EVENT: ${{ github.event_name }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          CLI: ${{ steps.filter.outputs.cli }}
          PLUGINS: ${{ steps.filter.outputs.plugins }}
          HELM: ${{ steps.filter.outputs.helm }}
          WORKFLOW: ${{ steps.filter.outputs.workflow }}
          REQUIREMENTS: ${{ steps.filter.outputs.requirements }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$WORKFLOW" = "true" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "cli=true" >> "$GITHUB_OUTPUT"
            echo "plugins=true" >> "$GITHUB_OUTPUT"
            echo "helm=true" >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
            echo "requirements=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${BACKEND:-false}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FRONTEND:-false}" >> "$GITHUB_OUTPUT"
            echo "cli=${CLI:-false}" >> "$GITHUB_OUTPUT"
            echo "plugins=${PLUGINS:-false}" >> "$GITHUB_OUTPUT"
            echo "helm=${HELM:-false}" >> "$GITHUB_OUTPUT"
            echo "workflow=false" >> "$GITHUB_OUTPUT"
            echo "requirements=${REQUIREMENTS:-false}" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================================================
  # Requirements resolve (guard)
  # ==========================================================================
  # Every hash-pinned lock in the repo, asked one question: can pip resolve
  # you? Nothing is installed and nothing is built.
  #
  # This exists because requirements/runtime.txt is installed by no job that
  # runs on a pull request. "Build & Push Docker Images" is the only consumer
  # in CI and it is `if: github.event_name != 'pull_request'` (a multi-arch
  # QEMU build, too slow to gate a PR on). The backend shards install
  # .github/requirements/app-dev.txt, a different lock. So dependabot PR #537
  # merged with an all-green CI and a runtime.txt that pip cannot resolve
  # (pydantic 2.13.5 next to pydantic-core 2.48.0; pydantic pins
  # pydantic-core==2.46.5), and main's Docker and Release builds went red.
  #
  # `--report /dev/null` lets pip use PEP 658 index metadata for resolution
  # instead of downloading every wheel body, and `--require-hashes` is what
  # Dockerfile:28-29 and scripts/generate_sbom.sh use, so this checks the same
  # thing those do. Measured cold-cache locally: 47s for all ten lock files.
  requirements-resolve:
    name: Requirements Resolve
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.requirements == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-resolve-${{ hashFiles('requirements/*.txt', '.github/requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-resolve-

      - name: Resolve every hash-pinned lock
        run: |
          set -u
          failed=0
          for f in requirements/*.txt .github/requirements/*.txt; do
            echo "::group::$f"
            if python -m pip install \
                 --require-hashes \
                 --dry-run \
                 --ignore-installed \
                 --report /dev/null \
                 -r "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::$f does not resolve with --require-hashes"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  # ==========================================================================
  # Backend Tests
  # ==========================================================================

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # App + [dev] extra hash-pinned via app-dev.txt. `--no-deps` then
      # installs only the local package (Scorecard requires that for `-e`).
      # Regenerate: uv pip compile --universal --generate-hashes
      #   --python-version 3.11 --extra dev pyproject.toml
      #   -o .github/requirements/app-dev.txt
      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r .github/requirements/app-dev.txt
          pip install --no-deps -e .

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run ruff
        run: ruff check .

  helm-lint:
    name: Helm Chart Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # helm is preinstalled on ubuntu-latest runners
      - name: Helm render checks (chart lint + CNPG backup wiring)
        run: sh scripts/helm-render-check.sh

  # Eight shards, each with its own Postgres. GitLab splits this suite into
  # dozens of per-file jobs; that is a poor fit here because each GitHub
  # runner spends ~1.5m on checkout/pip/migrations before pytest starts.
  # Four shards left group 1 (the first duration_based_chunks slice) as the
  # wall-clock pole: ~7-9m vs ~3-4.5m for the others. Eight shards cut that
  # first slice in half without going back to per-file jobs.
  # pytest-split keeps new tests in the partition automatically. Use
  # duration_based_chunks (not least_duration): without a timings file,
  # least_duration round-robins individual tests across shards and breaks
  # unittest setUp isolation plus tests that share a process-wide DB
  # session. Chunks keep collection order, so files stay together. The 60%
  # coverage floor is applied after shards are combined -- a single shard
  # only sees part of the tree.
  test-backend:
    name: Backend Tests (${{ matrix.group }}/8) [inputs ${{ needs.changes.outputs.fingerprint }}]
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.reuse_backend != 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      OPENAI_API_KEY: mock_key
      ANTHROPIC_API_KEY: mock_key
      PRELOOP_DISABLE_TELEMETRY: "true"
      COVERAGE_FILE: coverage-data.${{ matrix.group }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/requirements/app-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # App + [dev] extra hash-pinned via app-dev.txt; `--no-deps` installs
      # only the local package.
      - name: Install dependencies
        run: |
          pip install --require-hashes -r .github/requirements/app-dev.txt
          pip install --no-deps -e .

      - name: Initialize database
        run: python scripts/init_db.py --force

      - name: Run tests
        run: |
          pytest -v \
            -m "not integration" \
            --splits 8 \
            --group ${{ matrix.group }} \
            --splitting-algorithm=duration_based_chunks \
            --cov=preloop \
            --cov-report= \
            --junitxml=test-results.xml

      - name: Upload coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-${{ matrix.group }}
          path: coverage-data.${{ matrix.group }}
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-results-${{ matrix.group }}
          path: test-results.xml

  test-backend-coverage:
    name: Backend Coverage [inputs ${{ needs.changes.outputs.fingerprint }}]
    runs-on: ubuntu-latest
    needs: [changes, test-backend]
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.reuse_backend != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-coverage-${{ hashFiles('.github/requirements/coverage.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # This job only combines/reports shard data, so it installs a tiny
      # dedicated lock (coverage.txt) instead of the full app-dev lock. The
      # two locks must pin the same coverage.py version or `coverage combine`
      # may reject/misread the data files written by the shards (which do use
      # app-dev.txt).
      - name: Install coverage
        run: pip install --require-hashes -r .github/requirements/coverage.txt

      - name: Download shard coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-coverage-*
          path: coverage-shards
          merge-multiple: true

      - name: Combine coverage and enforce floor
        run: |
          mapfile -t coverage_files < <(find coverage-shards -name 'coverage-data.*' -type f | sort)
          if [ ${#coverage_files[@]} -ne 8 ]; then
            echo "Expected 8 shard coverage files, found ${#coverage_files[@]}"
            find coverage-shards -type f -print
            exit 1
          fi
          coverage combine "${coverage_files[@]}"
          coverage xml -o coverage.xml
          coverage report --fail-under=60

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: github.event_name != 'pull_request'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # Frontend Tests
  # ==========================================================================

  test-frontend:
    name: Frontend Tests [inputs ${{ needs.changes.outputs.fingerprint }}]
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.reuse_frontend != 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: |
          # The runner image preconfigures Google's chrome-stable apt source, which this job
          # never uses. Its index intermittently fails with "Hash Sum mismatch" and takes
          # "playwright install --with-deps" down with it (main and five PRs on 2026-09-09).
          # Drop that source, then retry the install, which is a no-op for cached browsers.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google.list
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt), retrying in 15s"
            sleep 15
          done
          echo "playwright install failed after 3 attempts" >&2
          exit 1

      - name: Run tests
        run: npm run test

  # ==========================================================================
  # Runtime Plugin Tests (Hermes + OpenClaw)
  # ==========================================================================

  test-runtime-plugins:
    name: Runtime Plugin Tests [inputs ${{ needs.changes.outputs.fingerprint }}]
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.plugins == 'true' && needs.changes.outputs.reuse_plugins != 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: runtime-plugins/openclaw-preloop/package-lock.json

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-runtime-plugins-${{ hashFiles('.github/requirements/runtime-plugin-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-runtime-plugins-
            ${{ runner.os }}-pip-

      # Runtime + pytest hash-pinned together (a merge of runtime.txt and
      # runtime-test.txt conflicts on pygments). `--no-deps` installs only
      # the local package. Regenerate:
      #   uv pip compile --universal --generate-hashes --python-version 3.11 \
      #     pyproject.toml .github/requirements/runtime-test.in \
      #     -o .github/requirements/runtime-plugin-test.txt
      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r .github/requirements/runtime-plugin-test.txt
          pip install --no-deps -e .

      - name: Run runtime-plugin pytest
        run: |
          pytest -v \
            runtime-plugins/tests \
            runtime-plugins/hermes-preloop/tests

      - name: Install OpenClaw plugin dependencies
        working-directory: runtime-plugins/openclaw-preloop
        run: npm ci

      - name: Run OpenClaw plugin tests
        working-directory: runtime-plugins/openclaw-preloop
        run: npm test

      - name: Install Claude plugin dependencies
        working-directory: runtime-plugins/claude-preloop
        run: npm ci

      - name: Run Claude plugin tests
        working-directory: runtime-plugins/claude-preloop
        run: npm test

  # ==========================================================================
  # CLI (Windows)
  # ==========================================================================
  #
  # Windows CLI binaries already ship on every release (see release.yml), but
  # nothing had ever exercised them. This job is the first Windows runner in the
  # repo. It is still INFORMATIONAL ONLY:
  #   - continue-on-error: true, so a failure never turns the check red, and
  #   - it is absent from build-and-push's `needs:`, so it cannot gate a release.
  #
  # The three original failure causes have been addressed, so this job is
  # EXPECTED TO PASS. It has not yet been observed green on a real Windows
  # runner, which is the only reason continue-on-error is still set — flip it
  # (and add this job to build-and-push's `needs:`) once a few runs confirm it.
  # A failure here is now a signal, not background noise: triage it.
  #
  #   1. FIXED. Tests redirected the home dir with t.Setenv("HOME", ...), but
  #      os.UserHomeDir() reads %USERPROFILE% on Windows, so they operated on
  #      the real profile instead of their temp dir. All 94 call sites now go
  #      through internal/testenv.SetHome, which sets HOME, USERPROFILE, and
  #      the APPDATA/LOCALAPPDATA roots behind os.UserConfigDir/UserCacheDir.
  #      internal/testenv's own tests assert the redirection through the stdlib
  #      accessors, so they fail here if the helper ever stops working.
  #   2. SKIPPED. Ten tests write a #!/bin/sh stub and exec it; Windows has no
  #      shebang. They call skipNoShebangOnWindows with the untested behavior
  #      named in the skip message. Fixture limitation, not a product problem.
  #   3. SKIPPED — REAL PRODUCT GAP. The managed-launcher feature is POSIX-only:
  #      it emits a bash script to ~/.local/bin and gates on the 0111 executable
  #      bit, which Windows files never carry. Five tests call
  #      skipManagedLauncherOnWindows. These skips hide missing functionality,
  #      NOT a test defect — `preloop agents onboard` cannot install a managed
  #      launcher on Windows today. See the managedLauncherWindowsGap doc
  #      comment in cli/internal/cmd/testsupport_test.go.

  test-cli-windows:
    name: CLI Tests (Windows) [inputs ${{ needs.changes.outputs.fingerprint }}]
    runs-on: windows-latest
    continue-on-error: true
    needs: changes
    if: needs.changes.outputs.cli == 'true' && needs.changes.outputs.reuse_cli != 'true'

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Kept as a separate step so a build failure and a test failure are
      # distinguishable at a glance in the checks UI.
      - name: Test
        env:
          PRELOOP_DISABLE_TELEMETRY: "true"
        run: go test ./...

  # ==========================================================================
  # CLI Vulnerability Scan
  # ==========================================================================
  #
  # Deliberately NOT path-filtered, unlike every other suite here. The failure
  # this job exists to catch is a dependency going stale while nobody touches
  # cli/: golang.org/x/crypto sat at v0.54.0 with four published advisories
  # and no check in this repo would have said so. A filter on cli/** would
  # reproduce exactly that blind spot, and the job costs well under a minute.
  #
  # govulncheck is a reachability scanner, not a manifest scanner. It reports
  # at three levels and only the first one fails the build:
  #   Symbol   your code calls the vulnerable function. Fix it.
  #   Package  you import the package but do not call the symbol.
  #   Module   you require the module but do not import the package.
  # It is also the tool that settles VEX claims: security/vex/ asserts
  # vulnerable_code_not_present for the x/crypto advisories, and this job is
  # the evidence behind that assertion.

  cli-vuln-scan:
    name: CLI Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # -show verbose prints the package- and module-level findings too. They
      # do not fail the build, but they are what a release audit will ask
      # about, so they belong in the log rather than behind a rerun.
      - name: Run govulncheck
        run: govulncheck -show verbose ./...

  # ==========================================================================
  # Build and Push Docker Images
  # ==========================================================================

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    # PRs do not build images: this job is a multi-arch QEMU build that does
    # not push, and release.yml already publishes from main/tags.
    if: github.event_name == 'push'
    needs: [lint, test-backend-coverage, test-frontend, test-runtime-plugins]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && vars.PUSH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/preloop/preloop
            ${{ vars.PUSH_TO_DOCKERHUB == 'true' && format('{0}/preloop', vars.DOCKERHUB_ORG) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/preloop/console
            ${{ vars.PUSH_TO_DOCKERHUB == 'true' && format('{0}/console', vars.DOCKERHUB_ORG) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            BRAND=preloop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Required check. Per-suite jobs may skip when their tree did not change;
  # a failed suite must still fail this job (skipped-because-needs-failed
  # would otherwise look like a path-filter skip). `changes` is in `needs`
  # so a checkout/filter crash cannot leave this job green with no tests.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    needs:
      - changes
      - lint
      - helm-lint
      - requirements-resolve
      - test-backend
      - test-backend-coverage
      - test-frontend
      - test-runtime-plugins
      - cli-vuln-scan
    steps:
      - name: Require every suite to have passed or been skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          HELM: ${{ needs.helm-lint.result }}
          REQRESOLVE: ${{ needs.requirements-resolve.result }}
          BACKEND: ${{ needs.test-backend.result }}
          COVERAGE: ${{ needs.test-backend-coverage.result }}
          FRONTEND: ${{ needs.test-frontend.result }}
          PLUGINS: ${{ needs.test-runtime-plugins.result }}
          CLIVULN: ${{ needs.cli-vuln-scan.result }}
          EXPECT_BACKEND: ${{ needs.changes.outputs.backend }}
          EXPECT_FRONTEND: ${{ needs.changes.outputs.frontend }}
          EXPECT_PLUGINS: ${{ needs.changes.outputs.plugins }}
          REUSE_BACKEND: ${{ needs.changes.outputs.reuse_backend }}
          REUSE_FRONTEND: ${{ needs.changes.outputs.reuse_frontend }}
          REUSE_PLUGINS: ${{ needs.changes.outputs.reuse_plugins }}
          EVIDENCE_BACKEND: ${{ needs.changes.outputs.evidence_backend }}
          EVIDENCE_FRONTEND: ${{ needs.changes.outputs.evidence_frontend }}
          EVIDENCE_PLUGINS: ${{ needs.changes.outputs.evidence_plugins }}
        run: |
          failed=0
          check() {
            name="$1"
            result="$2"
            echo "$name=$result"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$name ended $result"
                failed=1
                ;;
            esac
          }
          check changes "$CHANGES"
          check lint "$LINT"
          check helm-lint "$HELM"
          check requirements-resolve "$REQRESOLVE"
          check test-backend "$BACKEND"
          check test-backend-coverage "$COVERAGE"
          check test-frontend "$FRONTEND"
          check test-runtime-plugins "$PLUGINS"
          check cli-vuln-scan "$CLIVULN"
          require_tests() {
            name="$1"; result="$2"; expected="$3"; reused="$4"; evidence="$5"
            if [ "$result" = "skipped" ] && [ "$expected" = "true" ]; then
              if [ "$reused" != "true" ] || [ -z "$evidence" ]; then
                echo "::error::$name skipped without verified prior successful tests"
                failed=1
              else
                echo "- $name: reused successful tests from $evidence" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "- $name: $result (required by paths: $expected)" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          require_tests backend "$BACKEND" "$EXPECT_BACKEND" "$REUSE_BACKEND" "$EVIDENCE_BACKEND"
          require_tests coverage "$COVERAGE" "$EXPECT_BACKEND" "$REUSE_BACKEND" "$EVIDENCE_BACKEND"
          require_tests frontend "$FRONTEND" "$EXPECT_FRONTEND" "$REUSE_FRONTEND" "$EVIDENCE_FRONTEND"
          require_tests plugins "$PLUGINS" "$EXPECT_PLUGINS" "$REUSE_PLUGINS" "$EVIDENCE_PLUGINS"
          exit "$failed"
