# In-repo CodeQL so Scorecard sees github/codeql-action on every
# pull_request and every push to main. Default setup only covers some
# merged PRs (Scorecard SAST: "not run on all commits").
#
# Language jobs are path-filtered on PRs. `actions` always runs so a docs-only
# PR still produces a CodeQL check. Push to main and the weekly schedule scan
# every language. The matrix is built as JSON so we do not rely on a job-level
# `if: matrix.language == ...` (that is evaluated before matrix expansion).
name: CodeQL

on:
  push:
    branches: [main]
    tags: ['v*']
  # No base-branch filter: stacked PRs must still be scanned.
  pull_request:
  schedule:
    - cron: '17 5 * * 2'

concurrency:
  # One run per PR, or per branch on push. A newer commit cancels the older
  # run on PRs only. Push to main queues: cancelling an in-progress main
  # scan makes codeql-action upload that cancel as a configuration error,
  # and a still-queued job from the older push can abort the scan of HEAD.
  # Tags, schedules and manual runs are never cancelled (each tag is its
  # own ref, so tags never collide anyway).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Use the hosted-only label; legacy private runners also advertise ubuntu-latest.
# Keep ubuntu-24.04 absent from private registrations (self-hosted-runners.md).
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.out.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            go:
              - 'cli/**'
              - '**/*.go'
              - '**/*.mod'
              - '**/*.sum'
            javascript:
              - 'frontend/**'
              - 'runtime-plugins/**/*.ts'
              - 'runtime-plugins/**/*.js'
              - 'runtime-plugins/**/*.json'
            python:
              - 'backend/**'
              - 'tests/**'
              - 'presets/**'
              - '**/*.py'
              - 'pyproject.toml'
              - 'runtime-plugins/**/*.py'
            workflow:
              - '.github/workflows/codeql.yml'

      - name: Build language matrix
        id: out
        env:
          EVENT: ${{ github.event_name }}
          GO: ${{ steps.filter.outputs.go }}
          JAVASCRIPT: ${{ steps.filter.outputs.javascript }}
          PYTHON: ${{ steps.filter.outputs.python }}
          WORKFLOW: ${{ steps.filter.outputs.workflow }}
        run: |
          python3 - <<'PY'
          import json, os
          event = os.environ["EVENT"]
          force = event != "pull_request" or os.environ.get("WORKFLOW") == "true"
          include = [{"language": "actions", "build-mode": "none"}]
          if force or os.environ.get("GO") == "true":
              include.append({"language": "go", "build-mode": "autobuild"})
          if force or os.environ.get("JAVASCRIPT") == "true":
              include.append({"language": "javascript-typescript", "build-mode": "none"})
          if force or os.environ.get("PYTHON") == "true":
              include.append({"language": "python", "build-mode": "none"})
          matrix = json.dumps({"include": include})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={matrix}\n")
          print(matrix)
          PY

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    needs: changes
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The JavaScript extractor requires Node even when analysis needs no
      # build; a self-hosted ubuntu-latest runner may not have it preinstalled.
      - name: Set up Node.js for CodeQL
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Go for CodeQL
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Shared self-hosted runners have a smaller memory/CPU budget than
          # GitHub-hosted runners. Init carries these limits into analyze.
          ram: ${{ runner.environment == 'self-hosted' && '2560' || '' }}
          threads: ${{ runner.environment == 'self-hosted' && '2' || '' }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          # Scorecard SAST counts GitHub code-scanning analyses per commit.
          # Default setup is weekly / some PRs only. Advanced setup must
          # upload SARIF. Disable Settings → Code security → CodeQL default
          # setup (state=not-configured) or this job fails: GitHub rejects
          # SARIF from advanced setup while default setup is also enabled.
          upload: true
