name: Discovery platform parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discovery-parity:
    name: Discovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PRELOOP_DISABLE_TELEMETRY: 'true'
      DISCOVERY_TESTS: 'Test(Unattended|AllUsersInventory|Inventory|SafeDiscoveryJSON|Discover|BuildDiscovery|DiscoveryKind|HomeRelative|ConfigPathHash|WorkstationFingerprint|LocalProfile|ParseMachineID|PersistedWorkstationID|ClaudeDesktopConfigPaths|ConfigPathsForOther|UserConfigDirs|VSCodeDiscovery|BuildHarnessInventory|HarnessInventory|PersonalRunnerFixtures|RegisterFixturesDecodeInventory|HeartbeatSendsFullInventory|RegisterHashSuppresses|HeartbeatMessageCarriesInventory|GeneratedProfilesAreAdvertised|RegisterSendsInventory)'
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Download dependencies before offline tests
        run: go mod download
      - name: Compile discovery, inventory and report fixtures offline
        shell: bash
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: go test -c -o "$RUNNER_TEMP/discovery.test.exe" ./internal/cmd
      # Local HTTP fixtures are allowed; external network access is denied by
      # the OS, independently of GOPROXY and the telemetry opt-out.
      - name: Test fixtures without external network (Linux)
        if: runner.os == 'Linux'
        working-directory: cli/internal/cmd
        shell: bash
        run: |
          sudo --preserve-env=PRELOOP_DISABLE_TELEMETRY unshare --net bash -eu -c '
            ip link set lo up
            uid="$1"; gid="$2"; shift 2
            exec setpriv --reuid="$uid" --regid="$gid" --init-groups "$@"
          ' _ "$(id -u)" "$(id -g)" "$RUNNER_TEMP/discovery.test.exe" -test.run "$DISCOVERY_TESTS" -test.v -test.count=1 -test.timeout=10m
      - name: Test fixtures without external network (macOS)
        if: runner.os == 'macOS'
        working-directory: cli/internal/cmd
        shell: bash
        run: |
          sandbox-exec -f ../../scripts/discovery-offline.sb "$RUNNER_TEMP/discovery.test.exe" -test.run "$DISCOVERY_TESTS" -test.v -test.count=1 -test.timeout=10m
      - name: Test fixtures without external network (Windows)
        if: runner.os == 'Windows'
        working-directory: cli/internal/cmd
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'discovery.test.exe'
          $rule = 'Preloop discovery fixture isolation'
          # Windows Firewall exempts loopback, used by httptest fixtures.
          New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $binary -Action Block -Profile Any -ErrorAction Stop | Out-Null
          try {
            & $binary -test.run $env:DISCOVERY_TESTS -test.v -test.count=1 -test.timeout=10m
            if ($LASTEXITCODE -ne 0) { throw "Discovery fixtures failed: $LASTEXITCODE" }
          } finally {
            Remove-NetFirewallRule -DisplayName $rule -ErrorAction Stop
          }
