# Documentation build check.
#
# docs.preloop.ai is built from this repository: mkdocs.yml at the root,
# pages under docs/. The deploy wrapper pins this repository as a submodule
# and runs the same build. This job fails a pull request whose pages would
# break that build: a broken relative link, a missing nav target or an
# unknown anchor all fail `mkdocs build --strict`.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements/docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements/docs.txt'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    env:
      # Silence the MkDocs 2 notice printed by mkdocs-material.
      NO_MKDOCS_2_WARNING: 'true'
      DISABLE_MKDOCS_2_WARNING: 'true'
      PRELOOP_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install the documentation toolchain
        run: python -m pip install --require-hashes -r requirements/docs.txt

      - name: Build the site
        run: mkdocs build --strict

      - name: Set up Go for MDM recipe fixtures
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # A self-hosted runner may carry ubuntu-latest without its image tools.
      - name: Set up ShellCheck
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$archive"
          printf '%s  %s\n' \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 \
            "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Check MDM templates against the CLI
        run: |
          (cd cli && go build -o ../build/preloop ./cmd/preloop)
          sh docs/scripts/test_mdm_recipes.sh "$PWD/build/preloop"
          shellcheck docs/assets/mdm-recipes/*.sh docs/scripts/test_mdm_recipes.sh

      - name: Set up PowerShell
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/powershell-7.5.3-linux-x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/PowerShell/PowerShell/releases/download/v7.5.3/powershell-7.5.3-linux-x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            5c74e0bbafd8be59e72267f05700fd6615344d9cf4d30460d9b6d12cd4a88a8c \
            "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/powershell-7.5.3"
          tar -xzf "$archive" -C "$RUNNER_TEMP/powershell-7.5.3"
          chmod +x "$RUNNER_TEMP/powershell-7.5.3/pwsh"
          echo "$RUNNER_TEMP/powershell-7.5.3" >> "$GITHUB_PATH"

      - name: Parse Windows inventory template (no execution)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/docs/assets/mdm-recipes/inventory-user.ps1",
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
