name: Continuous fuzzing

on:
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - package: ./internal/mcpclient
            target: FuzzMCPEventStream
          - package: ./internal/verify
            target: FuzzCanonicalJSON
    defaults:
      run:
        shell: bash
        working-directory: cli
    env:
      PRELOOP_DISABLE_TELEMETRY: 'true'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
      GOCACHE: ${{ github.workspace }}/.fuzz-cache
      FUZZ_PACKAGE: ${{ matrix.package }}
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '600' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          # Corpus sharing is explicit below. PR jobs never save shared caches.
          cache: false

      - name: Restore trusted fuzz corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.GOCACHE }}/fuzz
          key: fuzz-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('cli/go.mod', 'cli/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('cli/go.mod', 'cli/go.sum') }}-

      - name: Replay committed regression corpus
        run: |
          go mod download
          go test -count=1 "$FUZZ_PACKAGE"

      - name: Fuzz untrusted inputs
        run: |
          mkdir -p fuzz-results
          go version > fuzz-results/toolchain.txt
          printf 'target=%s\nseconds=%s\nworkers=2\n' "$FUZZ_TARGET" "$FUZZ_SECONDS" > fuzz-results/budget.txt
          go test "$FUZZ_PACKAGE" -run '^$' \
            -fuzz "^${FUZZ_TARGET}$" -fuzztime "${FUZZ_SECONDS}s" \
            -fuzzminimizetime 20s -parallel 2 -timeout 15m \
            2>&1 | tee fuzz-results/fuzz.log

      - name: Retain logs and crashing inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cli/fuzz-results/
            cli/internal/mcpclient/testdata/fuzz/
            cli/internal/verify/testdata/fuzz/
          retention-days: 30
          if-no-files-found: warn

      # PR merge refs have isolated cache scopes, but we additionally permit
      # saving only after successful trusted default-branch runs. Never execute
      # PR code via pull_request_target or give a fuzz job write permissions.
      - name: Save trusted coverage corpus
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.GOCACHE }}/fuzz
          key: fuzz-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('cli/go.mod', 'cli/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
