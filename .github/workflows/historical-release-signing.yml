name: Historical release signing

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and attach endorsements (false only verifies/downloads the inventory)
        type: boolean
        default: false
      reviewed_inventory_sha256:
        description: SHA256 of the reviewed committed inventory (required to publish)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: historical-release-signing
  cancel-in-progress: false

env:
  PRELOOP_DISABLE_TELEMETRY: 'true'
  REVIEWED_MANIFEST: security/historical-release-inventory-2026-10-19.json

jobs:
  inventory:
    if: github.repository == 'preloop/preloop' && github.ref == 'refs/heads/main' && !inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download and verify the four original releases without signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/historical_release_signing.py prepare \
            --directory "$RUNNER_TEMP/historical-release-assets" \
            --manifest observed-inventory.json
          cmp "$REVIEWED_MANIFEST" observed-inventory.json
          sha256sum "$REVIEWED_MANIFEST" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-historical-release-inventory
          path: observed-inventory.json
          if-no-files-found: error

  sign-and-attach:
    if: github.repository == 'preloop/preloop' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - name: Endorse only the reviewed exact bytes and verify the published signatures
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_INVENTORY_SHA256: ${{ inputs.reviewed_inventory_sha256 }}
        run: |
          python scripts/historical_release_signing.py publish \
            --directory "$RUNNER_TEMP/historical-release-assets" \
            --manifest "$REVIEWED_MANIFEST" \
            --manifest-sha256 "$REVIEWED_INVENTORY_SHA256"
      # Retain the exact signed bytes even if one attachment upload failed.
      # Existing attachments are never overwritten or silently retried.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: historical-release-endorsements
          path: ${{ runner.temp }}/historical-release-assets/endorsements
          if-no-files-found: warn
