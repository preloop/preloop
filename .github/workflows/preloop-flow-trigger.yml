# Trigger the prod Pull Request Reviewer from GitHub Actions.
#
# This is the reviewer for github.com/preloop/preloop. It replaces the
# staging.preloop.ai webhook flow: the job talks to https://preloop.ai
# and waits for the verdict. Disable the staging GitHub trigger when
# PRELOOP_PROD_REVIEW is switched on, or every PR is reviewed twice.
#
# Rollout switch: pull request events only call prod when the repository
# variable PRELOOP_PROD_REVIEW is `enabled`. Until then the job skips
# with a notice, so landing this file does not put a red check on every
# PR while the prod flow is being prepared. `workflow_dispatch` ignores
# the switch: it is how a maintainer trials the flow on one PR.
#
# Runs on open, non-draft PRs. Skip a PR with the label
# `preloop-skip-review`; removing that label retriggers. Manual dispatch
# also respects the draft, label and open-state gates. Same-repo PRs use
# `pull_request` (this file on the PR). Fork PRs use
# `pull_request_target` so PRELOOP_TOKEN is available; the job still
# checks out the default branch, never the PR head.
#
# Fork posture: a fork PR is reviewed automatically only when its author
# is an OWNER, MEMBER or COLLABORATOR. Any other fork PR is skipped (it
# would spend a prod execution per push and feed untrusted text into the
# review agent). A maintainer who has read the PR opts it in by adding
# the label `preloop-review`: adding the label reviews it once, and every
# later push is reviewed while the label stays on. Removing the label
# returns the PR to the default skip. `workflow_dispatch` still reviews a
# single head without labelling. Only people with triage access can add
# labels, so the author of a fork PR cannot opt themselves in.
#
# The CLI blocks while the execution runs (stdin is not a TTY), streams
# the execution log into this job, and exits non-zero on FAILED, STOPPED
# or TIMEOUT, so the check goes red when the review does. If the job is
# cancelled (a newer push supersedes it) or fails while the execution is
# still running, a cleanup step stops that execution, so a superseded
# head does not keep a review running. Compute stays where the flow says
# (hosted, or a private runner via `runner_pool`); this job only
# triggers and waits. See docs/guide/flows/ci-trigger.md.
#
# The trigger body mirrors a GitHub webhook event: `source: github`, a
# normalized `type`, and the pull request under `payload.pull_request`.
# Preloop normalizes that into `trigger_event.payload.object_attributes`,
# which is what the Pull Request Reviewer prompt reads.
#
# Required repository settings:
#   secret   PRELOOP_TOKEN        least-privilege account API token scoped
#                                 to the prod review flow (not a personal
#                                 admin token). This job cannot rotate it.
#   variable PRELOOP_PROD_REVIEW  `enabled` to review PRs automatically.
#   variable PRELOOP_FLOW         optional, flow id or name, defaults to
#                                 "Pull Request Reviewer". Prefer the id.
# PRELOOP_URL is pinned to prod below. A repository variable of that
# name is deliberately ignored.
name: Preloop flow trigger

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  # Fork PRs do not receive repo secrets on `pull_request`. This event
  # runs from the base branch and can use PRELOOP_TOKEN. Checkout below
  # is the default branch only; do not point it at the PR head.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

# Both pull_request and pull_request_target fire for every PR, and only
# one of them reviews (see the job condition). Keep the other one in a
# separate group, or it would cancel the reviewing run for the same PR.
concurrency:
  group: preloop-flow-${{ github.event.pull_request.number || inputs.pr }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request') == (github.event.pull_request.head.repo.full_name == github.repository)) && 'review' || 'noop' }}
  cancel-in-progress: true

jobs:
  trigger:
    # Same-repo: pull_request only. Forks: pull_request_target only.
    # Both events fire on a same-repo PR; the fork clause prevents a
    # double review. Label events only retrigger for the two labels this
    # workflow owns: skip-review removed, or preloop-review added. Any
    # other label change is ignored.
    # Dependabot: runs it triggers get no repository secrets, so skip
    # both its PRs and any event it is the actor of.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.actor != 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'preloop-skip-review') &&
        (github.event.action != 'unlabeled' || github.event.label.name == 'preloop-skip-review') &&
        (github.event.action != 'labeled' || github.event.label.name == 'preloop-review') &&
        (
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          ) ||
          (
            github.event_name == 'pull_request_target' &&
            github.event.pull_request.head.repo.full_name != github.repository
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gate (rollout switch, state, draft, label, fork author)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout has happened yet, so gh needs the repository.
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          EVENT_NAME: ${{ github.event_name }}
          PROD_REVIEW: ${{ vars.PRELOOP_PROD_REVIEW }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice title=Preloop review skipped::$1"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "${PROD_REVIEW}" != "enabled" ]; then
            skip "PR #${PR_NUMBER}: repository variable PRELOOP_PROD_REVIEW is not 'enabled', so the prod reviewer is not called."
          fi
          meta=$(gh pr view "$PR_NUMBER" --json state,isDraft,labels)
          state=$(printf '%s' "$meta" | jq -r .state)
          draft=$(printf '%s' "$meta" | jq -r .isDraft)
          label=$(printf '%s' "$meta" | jq -r '[.labels[].name] | index("preloop-skip-review") != null')
          optin=$(printf '%s' "$meta" | jq -r '[.labels[].name] | index("preloop-review") != null')
          if [ "$state" != "OPEN" ]; then
            skip "PR #${PR_NUMBER} is ${state}, not OPEN."
          fi
          if [ "$draft" = "true" ]; then
            skip "PR #${PR_NUMBER} is a draft."
          fi
          if [ "$label" = "true" ]; then
            skip "PR #${PR_NUMBER} has the preloop-skip-review label."
          fi
          if [ "$EVENT_NAME" = "pull_request_target" ] && [ "$IS_FORK" = "true" ]; then
            case "$AUTHOR_ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *)
                if [ "$optin" != "true" ]; then
                  skip "Fork PR #${PR_NUMBER} from a ${AUTHOR_ASSOCIATION:-unknown} author. A maintainer who has read it can add the preloop-review label, or review one head with workflow_dispatch."
                fi
                echo "Fork PR #${PR_NUMBER} from a ${AUTHOR_ASSOCIATION:-unknown} author carries the preloop-review label; reviewing."
                ;;
            esac
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # This job only needs scripts/install-cli.sh. Check out the default
      # branch so a PR cannot supply the installer (or a replacement
      # preloop binary) that then runs with PRELOOP_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install the Preloop CLI
        if: steps.gate.outputs.skip != 'true'
        env:
          # Pin the downloaded release. install-cli.sh from the default
          # branch already fetches SHA256SUMS; the check below fails the
          # job on a mismatch because the installer only warns.
          PRELOOP_VERSION: "0.15.0"
          INSTALL_DIR: ${{ runner.temp }}/preloop-bin
        run: |
          set -euo pipefail
          mkdir -p "$INSTALL_DIR"
          sh scripts/install-cli.sh
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch ${arch}" >&2; exit 1 ;;
          esac
          asset="preloop-${os}-${arch}"
          sums="${RUNNER_TEMP}/SHA256SUMS"
          curl -fsSL "https://github.com/preloop/preloop/releases/download/v${PRELOOP_VERSION}/SHA256SUMS" -o "$sums"
          expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print $1; exit }' "$sums")"
          actual="$(sha256sum "${INSTALL_DIR}/preloop" | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "SHA256 mismatch for ${asset}: expected ${expected:-missing}, got ${actual}" >&2
            exit 1
          fi

      - name: Trigger the flow and wait for the verdict
        id: trigger
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRELOOP_TOKEN: ${{ secrets.PRELOOP_TOKEN }}
          # Pinned to prod. Do not point this at staging; the staging
          # webhook reviewer is the flow this job replaces.
          PRELOOP_URL: https://preloop.ai
          PRELOOP_FLOW: ${{ vars.PRELOOP_FLOW || 'Pull Request Reviewer' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          # The commit this run is for. Empty on workflow_dispatch, where
          # the live head is used.
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action || 'dispatch' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${PRELOOP_TOKEN}" ]; then
            echo "PRELOOP_TOKEN secret is not set" >&2
            exit 1
          fi
          # Same type names the GitHub webhook path produces. Anything
          # after the first review is `pull_request_updated`, which lets
          # the reviewer do an incremental pass from its last reviewed SHA.
          case "$EVENT_ACTION" in
            opened) type=pull_request_opened ;;
            reopened) type=pull_request_reopened ;;
            ready_for_review) type=pull_request_ready_for_review ;;
            *) type=pull_request_updated ;;
          esac
          pr_json="${RUNNER_TEMP}/pr.json"
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" > "$pr_json"
          payload="${RUNNER_TEMP}/preloop-payload.json"
          jq -c --arg type "$type" --arg action "$EVENT_ACTION" \
            --arg sha "$EVENT_HEAD_SHA" --arg run_url "$RUN_URL" '
            {
              source: "github",
              type: $type,
              payload: {
                action: $action,
                number: .number,
                pull_request: {
                  number: .number,
                  title: .title,
                  body: (.body // ""),
                  html_url: .html_url,
                  state: .state,
                  draft: .draft,
                  user: {login: .user.login},
                  author_association: .author_association,
                  head: {
                    ref: .head.ref,
                    sha: (if $sha == "" then .head.sha else $sha end),
                    repo: {full_name: .head.repo.full_name}
                  },
                  base: {ref: .base.ref, sha: .base.sha}
                },
                repository: {
                  id: .base.repo.id,
                  full_name: .base.repo.full_name,
                  html_url: .base.repo.html_url,
                  clone_url: .base.repo.clone_url,
                  default_branch: .base.repo.default_branch
                }
              },
              ci: {provider: "github-actions", run_url: $run_url}
            }' "$pr_json" > "$payload"
          jq '{type, pr: .payload.pull_request | {number, html_url, head, base}}' "$payload"
          # Keep the CLI output so the cleanup step can find the execution id.
          "${RUNNER_TEMP}/preloop-bin/preloop" flow trigger "$PRELOOP_FLOW" --payload - --timeout 40m \
            < "$payload" 2>&1 | tee "${RUNNER_TEMP}/preloop-trigger.log"

      # A cancelled job (superseded by a newer push) or a CLI wait timeout
      # leaves the prod execution running. Stop it if, and only if, it is
      # still in a non-terminal state: the stop endpoint marks anything it
      # is sent as STOPPED, which would overwrite a real FAILED verdict.
      - name: Stop the execution if this job did not finish it
        if: (cancelled() || failure()) && steps.gate.outputs.skip == 'false'
        env:
          PRELOOP_TOKEN: ${{ secrets.PRELOOP_TOKEN }}
          PRELOOP_URL: https://preloop.ai
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/preloop-trigger.log"
          exec_id=$(sed -n 's/^Triggered flow .* (execution \([0-9a-f-]\{36\}\), status .*/\1/p' "$log" 2>/dev/null | head -n1)
          if [ -z "$exec_id" ] || [ -z "${PRELOOP_TOKEN}" ]; then
            echo "No execution was started; nothing to stop."
            exit 0
          fi
          api="${PRELOOP_URL}/api/v1/flows/executions/${exec_id}"
          status=$(curl -fsS -H "Authorization: Bearer ${PRELOOP_TOKEN}" "$api" | jq -r .status) || {
            echo "::warning::Could not read execution ${exec_id}; not stopping it."
            exit 0
          }
          case "$status" in
            RUNNING|STARTING|INITIALIZING|PENDING)
              echo "Stopping execution ${exec_id} (status ${status})."
              curl -fsS -X POST -H "Authorization: Bearer ${PRELOOP_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"command":"stop"}' "${api}/command" > /dev/null \
                || echo "::warning::Stopping execution ${exec_id} failed."
              ;;
            *)
              echo "Execution ${exec_id} is ${status}; leaving it."
              ;;
          esac
