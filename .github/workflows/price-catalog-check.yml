# Preloop Open Source - Model Price Catalog Freshness Gate
# Fails when the vendored price snapshot (backend/preloop/services/data/
# model_prices.json) is older than the age limit or has drifted from the
# upstream litellm price map. Fix by running:
#   python scripts/update_model_prices.py
# reviewing the printed diff, and committing the regenerated snapshot.
# When the gate fails, the workflow opens (or updates) a tracking issue so
# the failure is seen by people, not only by the Actions tab.

name: Price Catalog Check

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-price-catalog:
    name: Check vendored model prices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # Hard gate: snapshot age. Upstream drifts almost weekly (new models,
      # price tweaks), so drift alone is reported but does not fail the job.
      - name: Check catalog freshness (fails when older than 45 days)
        run: python scripts/update_model_prices.py --check --max-age-days 45

      - name: Report upstream drift (informational)
        run: python scripts/update_model_prices.py --check --max-age-days 45 --compare-remote || echo "::warning::Vendored price catalog drifts from upstream litellm — run scripts/update_model_prices.py and commit the diff."

      - name: Open or update the tracking issue when the gate fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Price catalog snapshot is stale (freshness gate failed)"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "The freshness gate failed again: $RUN_URL"
            echo "Updated existing issue #$existing"
            exit 0
          fi
          body="$(cat <<EOF
          The scheduled price catalog check failed: the vendored snapshot
          \`backend/preloop/services/data/model_prices.json\` is older than 45 days,
          so new models (and price changes) upstream are not priced here.

          Fix: run \`python scripts/update_model_prices.py\` from the repository root,
          review the printed diff, commit the regenerated snapshot, and open a PR.
          Do not hand-edit the JSON.

          Run: $RUN_URL

          Refs #850.
          EOF
          )"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --label bug --label ci --body "$body"
