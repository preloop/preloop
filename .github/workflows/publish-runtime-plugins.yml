# Publishes the standalone runtime plugins:
#   - @preloop-ai/openclaw-plugin  -> npm   (tag: openclaw-plugin-vX.Y.Z)
#   - preloop-hermes-plugin        -> PyPI  (tag: hermes-plugin-vX.Y.Z)
#
# Each plugin's package manifest and marketplace metadata file must carry the
# tag's version (lockstep per plugin, per runtime-plugins/PUBLISHING.md).
# Manual rehearsal: workflow_dispatch with dry_run=true builds and verifies
# without publishing.
#
# Required repo secrets (environment: release):
#   NPM_TOKEN          - npm automation token with publish rights
#   PLUGINS_PYPI_TOKEN - PyPI token scoped to preloop-hermes-plugin
#   CLAWHUB_TOKEN      - ClawHub API token with publish rights on the
#                        'preloop-ai' publisher (generate once locally:
#                        `clawhub login` then `clawhub token`)
#
# The ClawHub marketplace publish for the OpenClaw plugin is automated below.
# It used to be manual on the false premise that `clawhub login` is
# interactive-only; the CLI accepts `clawhub login --token`, a global
# `--no-input`, and per-command `--json` specifically for CI.
#
# npm and ClawHub MUST ship the same build. In Jul 2026 they diverged under the
# same version 0.1.1 and ClawHub served pre-hardening code (missing 6fb1bb79,
# an auth-bypass fix). The shasum guard in publish-openclaw is the regression
# test for that — do not remove it.

name: Publish Runtime Plugins

on:
  push:
    tags:
      - 'openclaw-plugin-v*'
      - 'hermes-plugin-v*'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Which plugin to build/publish'
        type: choice
        options: [openclaw, hermes, both]
        default: both
      dry_run:
        description: 'Build and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Tests & version checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run runtime plugin tests
        run: |
          pip install pytest
          pytest runtime-plugins/tests -q

      - name: Check per-plugin manifest lockstep (and tag match)
        run: |
          set -euo pipefail
          NPM_VERSION=$(python3 -c "import json; print(json.load(open('runtime-plugins/openclaw-preloop/package.json'))['version'])")
          CLAW_VERSION=$(python3 -c "import json; print(json.load(open('runtime-plugins/openclaw-preloop/openclaw.plugin.json'))['version'])")
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('runtime-plugins/hermes-preloop/pyproject.toml','rb'))['project']['version'])")
          HERMES_META_VERSION=$(python3 -c "import json; print(json.load(open('runtime-plugins/hermes-preloop/preloop-plugin.json'))['version'])")
          echo "openclaw: npm=$NPM_VERSION plugin.json=$CLAW_VERSION | hermes: pypi=$PY_VERSION preloop-plugin.json=$HERMES_META_VERSION"
          test "$NPM_VERSION" = "$CLAW_VERSION" || { echo "::error::openclaw package.json vs openclaw.plugin.json version mismatch"; exit 1; }
          test "$PY_VERSION" = "$HERMES_META_VERSION" || { echo "::error::hermes pyproject vs preloop-plugin.json version mismatch"; exit 1; }
          case "${GITHUB_REF_NAME}" in
            openclaw-plugin-v*)
              TAG_VERSION="${GITHUB_REF_NAME#openclaw-plugin-v}"
              test "$NPM_VERSION" = "$TAG_VERSION" || { echo "::error::tag $TAG_VERSION != openclaw plugin version $NPM_VERSION"; exit 1; }
              ;;
            hermes-plugin-v*)
              TAG_VERSION="${GITHUB_REF_NAME#hermes-plugin-v}"
              test "$PY_VERSION" = "$TAG_VERSION" || { echo "::error::tag $TAG_VERSION != hermes plugin version $PY_VERSION"; exit 1; }
              ;;
          esac

  publish-openclaw:
    name: Publish @preloop-ai/openclaw-plugin (npm)
    needs: verify
    if: >-
      startsWith(github.ref_name, 'openclaw-plugin-v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.plugin == 'openclaw' || inputs.plugin == 'both'))
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: runtime-plugins/openclaw-preloop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: |
          npm ci
          npm run build
          npm pack --dry-run

      # Fail before npm is touched if the ClawHub token is missing or the
      # package does not pass the Plugin Inspector. npm and ClawHub must go out
      # together or not at all.
      - name: ClawHub pre-flight (auth + validate)
        run: |
          set -euo pipefail
          if [ -z "${CLAWHUB_TOKEN:-}" ]; then
            echo "::error::secret CLAWHUB_TOKEN is not set on the 'release' environment — refusing to publish to npm, because npm and ClawHub must not diverge. Generate it once locally with 'clawhub login' then 'clawhub token', and add it as a repo secret."
            exit 1
          fi
          npm i -g clawhub
          clawhub login --token "$CLAWHUB_TOKEN" --no-input
          clawhub whoami --no-input
          clawhub package validate . --json --no-input
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish (npm)
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Runs after npm: ClawHub fetches the npm tarball, and installs of a
      # version npm has not published yet fail at package fetch.
      #
      # github.sha is already the public github.com/preloop/preloop commit —
      # this workflow runs on the public mirror, so no cross-remote translation
      # is needed (unlike the preloop-ee GitLab job, where CI_COMMIT_SHA is an
      # internal-only preloop-ee commit and the submodule SHA must be used).
      - name: Publish (ClawHub)
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          clawhub package publish . \
            --family code-plugin \
            --version "$PKG_VERSION" \
            --source-repo preloop/preloop \
            --source-commit "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF_NAME}" \
            --source-path runtime-plugins/openclaw-preloop \
            --json \
            --no-input

      # Regression test for the Jul 2026 npm/ClawHub divergence: both
      # registries must serve byte-identical tarballs for this version.
      - name: Verify npm and ClawHub serve the same artifact
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_SHASUM=$(npm view "@preloop-ai/openclaw-plugin@$PKG_VERSION" dist.shasum)
          CLAWHUB_SHASUM=$(clawhub package inspect @preloop-ai/openclaw-plugin \
            --version "$PKG_VERSION" --json --no-input \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s).package||{};process.stdout.write((p.artifact&&p.artifact.npmShasum)||'')})")
          echo "npm     dist.shasum = ${NPM_SHASUM:-<empty>}"
          echo "clawhub npmShasum   = ${CLAWHUB_SHASUM:-<empty>}"
          if [ -z "$NPM_SHASUM" ] || [ -z "$CLAWHUB_SHASUM" ]; then
            echo "::error::could not read a shasum from both registries — cannot prove they match."
            exit 1
          fi
          if [ "$NPM_SHASUM" != "$CLAWHUB_SHASUM" ]; then
            echo "::error::npm and ClawHub are serving DIFFERENT artifacts for $PKG_VERSION. Re-publish ClawHub from the npm tarball, or permanently delete the bad ClawHub version and ship a fresh patch to both registries."
            exit 1
          fi
          echo "OK: npm and ClawHub agree on $PKG_VERSION ($NPM_SHASUM)."

  publish-hermes:
    name: Publish preloop-hermes-plugin (PyPI)
    needs: verify
    if: >-
      startsWith(github.ref_name, 'hermes-plugin-v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.plugin == 'hermes' || inputs.plugin == 'both'))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        working-directory: runtime-plugins/hermes-preloop
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PLUGINS_PYPI_TOKEN }}
          packages-dir: runtime-plugins/hermes-preloop/dist/
