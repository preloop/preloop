name: Release validation (nonpublishing)

on:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - '.github/workflows/publish-*-image.yml'
      - 'scripts/image_sbom.py'
      - 'scripts/release_audit.py'
      - 'scripts/tests/sbom_fixture/**'
      - 'backend/tests/scripts/test_image_sbom.py'
      - 'backend/tests/scripts/test_release_audit.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRELOOP_DISABLE_TELEMETRY: "true"

jobs:
  validate:
    name: SBOM and audit validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise audit failure cases
        run: |
          python3 -m unittest discover -s backend/tests/scripts -p test_image_sbom.py
          python3 -m unittest discover -s backend/tests/scripts -p test_release_audit.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local OCI fixture with both platform SBOMs
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            --sbom=generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9 \
            --output "type=oci,dest=$RUNNER_TEMP/sbom-fixture.tar" scripts/tests/sbom_fixture
      - name: Validate the actual BuildKit OCI export without publishing
        run: |
          python3 scripts/image_sbom.py --name backend \
            --oci-archive "$RUNNER_TEMP/sbom-fixture.tar" --tag v0.0.0-fixture \
            --source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/sbom-fixture"
