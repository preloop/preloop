# Preloop Open Source - Release Pipeline
# Publishes Docker images for a version tag, whether that run is the tag
# push or a published release: ghcr.io, and Docker Hub when
# PUSH_TO_DOCKERHUB=true. `latest` moves on a stable tag (no pre-release
# suffix). A push to main does not publish images; it still generates an SBOM.
#
# Windows Authenticode (SignPath Foundation, free for OSS):
# 1. Apply at https://signpath.org/ and link github.com/preloop/preloop
# 2. Create project + signing policy + artifact config slug `windows-cli`
#    (XML: .signpath/artifact-configurations/windows-cli.xml)
# 3. Repo secrets/vars:
#      Secret:  SIGNPATH_API_TOKEN
#      Vars:    SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
#               SIGNPATH_SIGNING_POLICY_SLUG
#               (optional) SIGNPATH_ARTIFACT_CONFIGURATION_SLUG=windows-cli
# 4. Until those are set, Windows binaries still publish unsigned.
# Full instructions: docs/windows-code-signing.md

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

env:
  PRELOOP_DISABLE_TELEMETRY: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: preloop/preloop
  IMAGE_NAME_FRONTEND: preloop/console

concurrency:
  # A newer main commit cancels the SBOM run for the commit it replaced.
  # Tag pushes and published releases are never cancelled: every tag is its
  # own group and cancel is off for them.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Build and Push Backend Image
  # ==========================================================================

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    # A version tag, from pushing the tag or publishing the release. A push
    # to main does not match. create-release uses GITHUB_TOKEN, which does
    # not start another run, so the tag-push path does not build twice.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: vars.PUSH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
            ${{ vars.PUSH_TO_DOCKERHUB == 'true' && format('{0}/preloop', vars.DOCKERHUB_ORG) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify and export image SBOMs
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}@${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          MIRROR_REF: ${{ vars.PUSH_TO_DOCKERHUB == 'true' && format('{0}/preloop@{1}', vars.DOCKERHUB_ORG, steps.image.outputs.digest) || '' }}
        run: |
          mirrors=()
          if [ -n "$MIRROR_REF" ]; then mirrors+=(--mirror "$MIRROR_REF"); fi
          python3 scripts/image_sbom.py --name backend --image "$IMAGE_REF" \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --output image-sbom-backend "${mirrors[@]}"

      - name: Upload image SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-backend
          path: image-sbom-backend/
          if-no-files-found: error

      # Docker Hub description, synced from docker/dockerhub/ so the listing
      # cannot drift from the repo. Stable tags only. DOCKERHUB_TOKEN must be
      # a personal access token with Read, Write, Delete scope: Docker Hub
      # refuses description edits from narrower tokens.
      - name: Read Docker Hub short description
        id: dockerhub-short
        if: vars.PUSH_TO_DOCKERHUB == 'true' && !contains(github.ref_name, '-')
        run: |
          short="$(head -n 1 docker/dockerhub/preloop.short.txt)"
          if [ "${#short}" -gt 100 ]; then
            echo "::error::docker/dockerhub/preloop.short.txt exceeds Docker Hub's 100 characters"
            exit 1
          fi
          echo "text=${short}" >> "$GITHUB_OUTPUT"

      - name: Update Docker Hub description
        if: vars.PUSH_TO_DOCKERHUB == 'true' && !contains(github.ref_name, '-')
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ format('{0}/preloop', vars.DOCKERHUB_ORG) }}
          short-description: ${{ steps.dockerhub-short.outputs.text }}
          readme-filepath: ./docker/dockerhub/preloop.md

  # ==========================================================================
  # Build and Push Frontend Image
  # ==========================================================================

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: vars.PUSH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
            ${{ vars.PUSH_TO_DOCKERHUB == 'true' && format('{0}/console', vars.DOCKERHUB_ORG) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BRAND=preloop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify and export image SBOMs
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}@${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          MIRROR_REF: ${{ vars.PUSH_TO_DOCKERHUB == 'true' && format('{0}/console@{1}', vars.DOCKERHUB_ORG, steps.image.outputs.digest) || '' }}
        run: |
          mirrors=()
          if [ -n "$MIRROR_REF" ]; then mirrors+=(--mirror "$MIRROR_REF"); fi
          python3 scripts/image_sbom.py --name frontend --image "$IMAGE_REF" \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --output image-sbom-frontend "${mirrors[@]}"

      - name: Upload image SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-frontend
          path: image-sbom-frontend/
          if-no-files-found: error

      # Docker Hub description, synced from docker/dockerhub/ so the listing
      # cannot drift from the repo. Stable tags only. DOCKERHUB_TOKEN must be
      # a personal access token with Read, Write, Delete scope: Docker Hub
      # refuses description edits from narrower tokens.
      - name: Read Docker Hub short description
        id: dockerhub-short
        if: vars.PUSH_TO_DOCKERHUB == 'true' && !contains(github.ref_name, '-')
        run: |
          short="$(head -n 1 docker/dockerhub/console.short.txt)"
          if [ "${#short}" -gt 100 ]; then
            echo "::error::docker/dockerhub/console.short.txt exceeds Docker Hub's 100 characters"
            exit 1
          fi
          echo "text=${short}" >> "$GITHUB_OUTPUT"

      - name: Update Docker Hub description
        if: vars.PUSH_TO_DOCKERHUB == 'true' && !contains(github.ref_name, '-')
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ format('{0}/console', vars.DOCKERHUB_ORG) }}
          short-description: ${{ steps.dockerhub-short.outputs.text }}
          readme-filepath: ./docker/dockerhub/console.md

  # ==========================================================================
  # SBOM (CycloneDX, one per shipped component)
  # ==========================================================================
  # Preloop sells SBOM verification, so it has to ship one. CRA Annex I Part II
  # requires the manufacturer to identify and document the components of the
  # product, and the standard artefact for that is a build-time SBOM.
  #
  # This job deliberately has no tag guard. It runs on every push to main too,
  # so there is always a recent, provenance-attested SBOM to point a scanner
  # at without cutting a release first. On a tag the artifact is picked up by
  # create-release, copied into release-assets, hashed into SHA256SUMS and
  # published with the other assets.
  #
  # The SBOMs come from built artefacts, not from manifests: an installed venv
  # for the backend, the resolved node_modules tree for the frontend, and the
  # Go build graph for the CLI. See scripts/generate_sbom.sh.

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # attest-build-provenance mints a Sigstore certificate from the
      # workflow's OIDC identity, so consumers can check the SBOM was built
      # here rather than pasted in by hand.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # No dependency caches in this job: its outputs are published and
      # attested (SBOMs), so a poisoned cache would flow into a release
      # artifact (zizmor cache-poisoning).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: false

      - name: Resolve SBOM version
        id: sbom-version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            sbom_version="${GITHUB_REF_NAME#v}"
          else
            # Main-branch SBOMs are not a release, so mark them with the
            # commit they describe instead of pretending to be the tag.
            sbom_version="$(tr -d '[:space:]' < VERSION)-g${GITHUB_SHA:0:7}"
          fi
          echo "value=${sbom_version}" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOMs
        env:
          SBOM_VERSION: ${{ steps.sbom-version.outputs.value }}
          # The CLI SBOM is only true for one target, because build
          # constraints select modules. linux/amd64 matches the container
          # images and the primary release binary.
          GOOS: linux
          GOARCH: amd64
        run: ./scripts/generate_sbom.sh

      - name: Measure NTIA minimum elements
        run: |
          set -euo pipefail
          PYTHONPATH=backend python -m preloop.cra measure sbom/*.cdx.json \
            | tee "$RUNNER_TEMP/minimum-elements.json"
          python - "$RUNNER_TEMP/minimum-elements.json" <<'PY'
          import json
          import sys

          measured = json.loads(open(sys.argv[1], encoding="utf-8").read())
          counts = measured.get("missing_counts") or {}
          print("minimum elements")
          print(f"{'element':<24}{'missing':>8}")
          for key, value in counts.items():
              print(f"{key:<24}{value:>8}")
          print(f"passed: {measured.get('passed')}")
          print(f"components: {measured.get('components')}")
          print(f"author_only: {measured.get('author_only')}")
          print(
              "missing_supplier_and_author: "
              f"{measured.get('missing_supplier_and_author')}"
          )
          if measured.get("passed") is not True:
              sys.exit(1)
          PY

      - name: Record SBOM digests
        run: |
          set -euo pipefail
          cd sbom
          sha256sum ./*.cdx.json | tee SBOM-SHA256SUMS
          {
            echo "### CycloneDX SBOMs"
            echo
            echo '```'
            cat SBOM-SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest SBOM build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'sbom/*.cdx.json'

      - name: Attach OpenVEX to the SBOM artifact
        run: cp security/vex/*.openvex.json sbom/

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  # ==========================================================================
  # Build Python Package (sdist + wheel)
  # ==========================================================================

  build-python:
    name: Build Python Package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install --require-hashes -r .github/requirements/build.txt

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/

  # ==========================================================================
  # Build CLI Binaries (cross-compilation)
  # ==========================================================================

  build-cli:
    name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Go module/build cache: this job builds the released CLI binaries,
      # so a poisoned cache would flow into a published artifact (zizmor
      # cache-poisoning).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: false

      - name: Embed Windows PE version info
        if: matrix.goos == 'windows'
        run: |
          chmod +x scripts/embed_windows_versioninfo.sh
          VERSION=${GITHUB_REF_NAME#v}
          ./scripts/embed_windows_versioninfo.sh "$VERSION" "${{ matrix.goarch }}"

      - name: Build CLI
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          OUTPUT="preloop-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          go build \
            -ldflags "-s -w -X github.com/preloop/preloop/cli/internal/version.Version=${VERSION} \
                      -X github.com/preloop/preloop/cli/internal/version.Commit=${COMMIT} \
                      -X github.com/preloop/preloop/cli/internal/version.BuildDate=${BUILD_DATE}" \
            -o "../${OUTPUT}" \
            ./cmd/preloop

      - name: Upload CLI binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Windows binaries are finalized by sign-windows-cli (signed when
          # SignPath is configured, otherwise pass-through unsigned).
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '-unsigned' || '' }}
          path: preloop-${{ matrix.goos }}-${{ matrix.goarch }}*

  # ==========================================================================
  # Sign Windows CLI (SignPath Foundation — optional until secrets exist)
  # ==========================================================================

  sign-windows-cli:
    name: Sign Windows CLI
    runs-on: ubuntu-latest
    needs: [build-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download unsigned Windows CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-windows-*-unsigned
          path: unsigned-windows/
          merge-multiple: true

      - name: Stage unsigned bundle
        run: |
          mkdir -p unsigned-bundle
          cp unsigned-windows/preloop-windows-*.exe unsigned-bundle/
          ls -la unsigned-bundle/

      - name: Upload unsigned bundle for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cli-unsigned-bundle
          path: unsigned-bundle/*
          if-no-files-found: error

      # Signing is best-effort while credentials are absent, UNLESS the
      # repository variable SIGNPATH_SIGNING_REQUIRED is 'true': then a
      # release with missing SignPath secrets/vars fails instead of quietly
      # publishing unsigned binaries. Set the variable when SignPath is
      # approved and verified (docs/windows-code-signing.md) so signing can
      # never silently regress afterwards.
      - name: Check SignPath configuration
        id: signpath-check
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          REQUIRED: ${{ vars.SIGNPATH_SIGNING_REQUIRED }}
        run: |
          # Case-insensitive truthiness: TRUE/True/1 must not silently keep
          # the fail-open path this switch exists to close.
          required=$(printf '%s' "$REQUIRED" | tr '[:upper:]' '[:lower:]')
          if [ -n "$TOKEN" ] && [ -n "$ORG_ID" ] && [ -n "$PROJECT" ] && [ -n "$POLICY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SignPath signing enabled — Windows CLI will be Authenticode-signed"
          elif [ "$required" = "true" ] || [ "$required" = "1" ]; then
            echo "::error::SIGNPATH_SIGNING_REQUIRED is set but the SignPath secrets/vars are not configured. Refusing to release unsigned Windows binaries. See docs/windows-code-signing.md"
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SignPath secrets/vars missing — Windows CLI will be UNSIGNED. See docs/windows-code-signing.md"
          fi

      - name: Sign with SignPath
        if: steps.signpath-check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG != '' && vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-cli' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-bundle

      - name: Use unsigned binaries when SignPath is unavailable
        if: steps.signpath-check.outputs.enabled != 'true'
        run: |
          mkdir -p signed-bundle
          cp unsigned-bundle/*.exe signed-bundle/

      - name: Upload Windows amd64 CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-windows-amd64
          path: signed-bundle/preloop-windows-amd64.exe
          if-no-files-found: error

      - name: Upload Windows arm64 CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-windows-arm64
          path: signed-bundle/preloop-windows-arm64.exe
          if-no-files-found: error

  # Scan the finalized bytes before publication, including delayed remediation.
  validate-windows-cli:
    name: Validate Windows CLI with Defender
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [sign-windows-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    env:
      PRELOOP_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable Defender before downloading executables
        shell: powershell
        run: ./scripts/prepare-windows-defender.ps1
      - name: Download finalized Windows amd64 CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-windows-amd64
          path: windows-artifacts/
      - name: Download finalized Windows arm64 CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-windows-arm64
          path: windows-artifacts/
      - name: Scan and observe with Defender enabled
        shell: powershell
        run: >-
          ./scripts/test-windows-defender.ps1
          -ArtifactDirectory windows-artifacts
          -ReportPath windows-defender-report/result.json
          -ObservationSeconds 600
      - name: Retain Defender validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Deliberately outside cli-*; reports are not executable release assets.
          name: windows-defender-report
          path: windows-defender-report/
          if-no-files-found: error

  # ==========================================================================
  # VirusTotal scan (optional — P1 release hygiene)
  # ==========================================================================
  # Uploads finalized Windows CLI binaries when VIRUSTOTAL_API_KEY is set.
  # Does not fail the release if the key is absent. Microsoft WDSI false-
  # positive submission remains a manual maintainer step (see docs).

  virustotal-windows-cli:
    name: VirusTotal Windows CLI
    runs-on: ubuntu-latest
    needs: [sign-windows-cli, create-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Check VirusTotal configuration
        id: vt-check
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [ -n "$VT_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::VirusTotal scan enabled for Windows CLI binaries"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VIRUSTOTAL_API_KEY missing — skip VirusTotal upload. See docs/windows-code-signing.md"
          fi

      - name: Download finalized Windows amd64 CLI
        if: steps.vt-check.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-windows-amd64
          path: vt-windows/

      - name: Download finalized Windows arm64 CLI
        if: steps.vt-check.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-windows-arm64
          path: vt-windows/

      - name: Upload Windows CLI to VirusTotal
        if: steps.vt-check.outputs.enabled == 'true'
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          request_rate: 4
          update_release_body: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            vt-windows/preloop-windows-amd64.exe
            vt-windows/preloop-windows-arm64.exe

  # ==========================================================================
  # Verify OSS Install (release smoke test)
  # ==========================================================================
  # Boots docker-compose.release.yaml with the just-pushed images — the same
  # artifact and images the OSS installer will use — and verifies the stack
  # comes up healthy, sign-up/login work, and no service restart-loops.
  # Guards against broken release artifacts like preloop/preloop#53.

  verify-oss-install:
    name: Verify OSS Install
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run release smoke test
        run: |
          PRELOOP_VERSION="${GITHUB_REF_NAME#v}" ./scripts/release_smoke_test.sh

  # Every v* image workflow and security check must finish on this tag/SHA.
  # This job only reads registry/API data; it never invokes a hosted audit flow.
  release-audit:
    name: Release audit
    runs-on: ubuntu-latest
    timeout-minutes: 200
    needs: [build-backend, build-frontend, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Download component SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: audited-sbom/
      - name: Download backend and console image SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-sbom-*
          merge-multiple: true
          path: audited-sbom/
      - name: Require tag image and security workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_audit.py collect --directory audited-sbom \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --source-sha "$GITHUB_SHA"
      - name: Verify complete release SBOMs against published digests
        run: |
          python3 scripts/release_audit.py validate --directory audited-sbom \
            --tag "$GITHUB_REF_NAME" --source-sha "$GITHUB_SHA" \
            --verify-registry --require-workflows --report audited-sbom/release-audit.json
      - name: Upload audited release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audited-sbom
          path: audited-sbom/
          if-no-files-found: error

  # ==========================================================================
  # Publish to PyPI
  # ==========================================================================

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-python, verify-oss-install, release-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ==========================================================================
  # Create GitHub Release (on tag)
  # ==========================================================================

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-python, build-cli, sign-windows-cli, validate-windows-cli, sbom, verify-oss-install, release-audit]
    # Tag push only. Publishing the draft emits release:published, and this
    # workflow also runs on that event for image builds. Creating the release
    # again there would flip a published release back to a draft.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # Push the Helm chart to oci://ghcr.io/preloop/charts (Artifact Hub).
      packages: write
      # Required by actions/attest-build-provenance to mint a Sigstore
      # signing certificate from the workflow's OIDC identity.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Copy Python packages
          if [ -d "artifacts/python-dist" ]; then
            cp artifacts/python-dist/* release-assets/
          fi
          # Copy finalized CLI binaries (skip *-unsigned and SignPath bundles)
          for dir in artifacts/cli-*; do
            case "$dir" in
              *-unsigned|*/windows-cli-unsigned-bundle) continue ;;
            esac
            [ -d "$dir" ] && cp "$dir"/* release-assets/
          done
          # Package Helm chart
          helm repo add nats https://nats-io.github.io/k8s/helm/charts
          helm repo update
          helm dependency build helm/preloop
          helm package helm/preloop --destination release-assets/
          # Fail closed if any audited image/platform/component artifact vanished.
          python3 scripts/release_audit.py validate --directory artifacts/audited-sbom \
            --tag "$GITHUB_REF_NAME" --source-sha "$GITHUB_SHA" --require-workflows
          cp artifacts/audited-sbom/*.json release-assets/
          # Copy installer assets
          cp docker-compose.release.yaml release-assets/docker-compose.release.yaml
          cp scripts/install-cli.sh release-assets/install-cli.sh
          cp scripts/install-cli.ps1 release-assets/install-cli.ps1
          cp scripts/install-oss.sh release-assets/install-oss.sh
          chmod +x release-assets/install-cli.sh release-assets/install-oss.sh
          # Cover every published payload; the manifest is itself attested.
          python3 scripts/release_assets.py checksum release-assets
          ls -la release-assets/

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        continue-on-error: true
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Compute package version
        id: version
        run: |
          package_version="${GITHUB_REF_NAME#v}"
          # scripts/release.py is the only PEP 440 normalization. A second
          # copy here would make release.sh expect an asset the build never
          # produced.
          python_package_version="$(
            python3 -c 'import sys; sys.path.insert(0, "scripts"); from release import python_package_version; print(python_package_version(sys.argv[1]))' \
              "$package_version"
          )"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "python_package_version=$python_package_version" >> "$GITHUB_OUTPUT"

      # Signed, verifiable build provenance (SLSA) for every published asset.
      # Consumers can verify an artifact really came from this workflow, at this
      # commit, with:  gh attestation verify <file> --repo preloop/preloop
      # The .intoto.jsonl bundle is uploaded alongside the assets below so the
      # provenance travels with the release rather than only living in the API.
      - name: Attest build provenance for release assets
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*'

      # Verify signed bytes and workflow identity before attaching release assets.
      # Keep the bundle outside release-assets until all subjects have passed.
      - name: Verify release asset provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          python3 scripts/release_assets.py verify release-assets \
            --bundle "$BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --source-sha "$GITHUB_SHA"

      - name: Stage provenance bundle with release assets
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # Name it after the tag so the asset is self-describing in the UI.
          cp "$BUNDLE_PATH" "release-assets/preloop-${GITHUB_REF_NAME}.intoto.jsonl"
          ls -la release-assets/

      # git-cliff's `content` output is the full notes string. Putting that in
      # `env:` or in `action-gh-release` `body:` exceeds Linux ARG_MAX
      # ("Argument list too long") on a large tag. Keep notes on disk and pass
      # the path. `outputs.changelog` is the file path, not the text.
      - name: Compose release notes
        env:
          CLIFF_CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          CHANGELOG_OUTCOME: ${{ steps.changelog.outcome }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes=release-notes.md
          cat > "$notes" <<EOF
          ## Install Standalone CLI

          macOS / Linux:

          \`\`\`bash
          curl -fsSL https://preloop.ai/install/cli | sh
          \`\`\`

          ### Windows binaries

          Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).

          Download \`preloop-windows-amd64.exe\` or \`preloop-windows-arm64.exe\` from the assets below (Authenticode signing via SignPath pending certificate approval — verify with \`SHA256SUMS\`), or install with PowerShell:

          \`\`\`powershell
          irm https://preloop.ai/install/cli.ps1 | iex
          \`\`\`

          Verify against \`SHA256SUMS\`. Pin with \`PRELOOP_VERSION=${PACKAGE_VERSION}\`.

          Code signing policy: [docs/code-signing-policy.md](https://github.com/preloop/preloop/blob/main/docs/code-signing-policy.md). Defender notes: [docs/windows-cli.md](https://github.com/preloop/preloop/blob/main/docs/windows-cli.md).

          ## Install Open Source Edition

          \`\`\`bash
          curl -fsSL https://preloop.ai/install/oss | sh
          \`\`\`

          This downloads the versioned \`docker-compose.release.yaml\`, writes a local \`.env\`, and starts the OSS stack with Docker Compose.

          ## Helm

          \`\`\`bash
          helm install preloop https://github.com/preloop/preloop/releases/download/${REF_NAME}/preloop-${PACKAGE_VERSION}.tgz
          \`\`\`

          For ingress and custom hostname, see [Kubernetes Setup](https://github.com/preloop/preloop#kubernetes-setup) and the [chart README](https://github.com/preloop/preloop/blob/main/helm/preloop/README.md).

          ## SBOM

          CycloneDX 1.6 SBOMs are attached for each shipped component:

          - \`preloop-sbom-backend-${PACKAGE_VERSION}.cdx.json\`
          - \`preloop-sbom-frontend-${PACKAGE_VERSION}.cdx.json\`
          - \`preloop-sbom-cli-${PACKAGE_VERSION}.cdx.json\` (linux/amd64 build constraints)

          Image SPDX SBOMs cover backend, console, scanner and universal images on linux/amd64 and linux/arm64. The \`preloop-image-*.json\` manifests bind each SBOM to its image digest; \`release-audit-runs.json\` records the tag security checks. Registry-attached SBOMs are checked against these assets before publication.

          Their digests are in \`SHA256SUMS\` and their build provenance is in the attestation bundle. Regenerate locally with \`scripts/generate_sbom.sh\`.

          ## Verify release provenance

          Each attached payload and \`SHA256SUMS\` has signed Sigstore build provenance.
          Download an asset and \`preloop-${REF_NAME}.intoto.jsonl\`, then run:

          \`\`\`bash
          gh attestation verify ./preloop-linux-amd64 --bundle ./preloop-${REF_NAME}.intoto.jsonl --repo preloop/preloop --signer-workflow preloop/preloop/.github/workflows/release.yml --source-ref refs/tags/${REF_NAME} --source-digest ${SOURCE_SHA} --deny-self-hosted-runners
          \`\`\`

          Replace the binary filename to verify any other attached payload.
          See [release verification](https://github.com/preloop/preloop/blob/main/docs/release-verification.md) for details and scope.

          ## Changelog

          EOF
          if [ -n "${CLIFF_CHANGELOG:-}" ] && [ -f "$CLIFF_CHANGELOG" ] && [ -s "$CLIFF_CHANGELOG" ]; then
            cat "$CLIFF_CHANGELOG" >> "$notes"
          else
            echo "_Changelog generation was unavailable for this release (${CHANGELOG_OUTCOME:-unknown})._" >> "$notes"
          fi

      # No GitHub release exists until this point. The next step refuses to
      # call the release API without a non-empty signed bundle on disk.
      - name: Require provenance bundle before creating the release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle="release-assets/preloop-${RELEASE_TAG}.intoto.jsonl"
          if [ ! -s "$bundle" ]; then
            echo "::error::Refusing to create ${RELEASE_TAG}: signed provenance bundle is missing"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          body_path: release-notes.md
          # Stay a draft until the publish step sees the provenance asset.
          # A failed upload must not leave a public unsigned release.
          draft: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish release only when provenance is attached
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle="preloop-${RELEASE_TAG}.intoto.jsonl"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -Fxq "$bundle"; then
            echo "::error::Refusing to publish ${RELEASE_TAG}: ${bundle} is not attached"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      # Artifact Hub indexes oci://ghcr.io/preloop/charts/preloop. The chart
      # pushed here is the same .tgz attached to the release, and the
      # artifacthub.io tag carries the repository metadata (ownership claim).
      # The ghcr.io package must be public once (org package settings).
      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Push Helm chart to GHCR (OCI)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          chart="release-assets/preloop-${PACKAGE_VERSION}.tgz"
          test -f "$chart"
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
          helm push "$chart" oci://ghcr.io/preloop/charts
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io -u "$GHCR_USER" --password-stdin
          oras push ghcr.io/preloop/charts/preloop:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            helm/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Trigger charts index update
        if: success()
        # The tag travels through env, not template expansion inside run:,
        # so a crafted ref name cannot become shell code (zizmor
        # template-injection).
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CHARTS_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/preloop/helm-charts/dispatches \
            -d "{\"event_type\":\"preloop-release\",\"client_payload\":{\"tag\":\"${RELEASE_TAG}\"}}"

  # ==========================================================================
  # Publish server.json to the official MCP registry (on tag)
  # ==========================================================================
  # Runs after the release (images, chart, assets) is out. A leaf job: nothing
  # needs it, so a registry outage cannot block the release, but a failure
  # still shows as a failed job on the run. Auth is GitHub OIDC
  # (`mcp-publisher login github-oidc`): no secret, and OIDC proves the
  # io.github.preloop namespace for a workflow in the preloop org.

  publish-mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
      # sha256 of mcp-publisher_linux_amd64.tar.gz from
      # registry_1.8.4_checksums.txt on the upstream release.
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # sbom.txt is hash-locked and lists jsonschema, the validator's only
      # dependency, as a direct requirement (sbom.in).
      - name: Install validator dependencies
        run: pip install --require-hashes -r .github/requirements/sbom.txt

      # Fails on a stable tag that server.json does not carry; skips (publish
      # =false) a pre-release tag that server.json was not bumped to.
      - name: Check server.json against the schema and the tag
        id: check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/validate_server_json.py --tag "$RELEASE_TAG"

      - name: Install mcp-publisher (pinned, checksum-verified)
        if: steps.check.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          cd "$RUNNER_TEMP/mcp-publisher"
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          echo "$RUNNER_TEMP/mcp-publisher" >> "$GITHUB_PATH"

      - name: Validate with mcp-publisher
        if: steps.check.outputs.publish == 'true'
        run: mcp-publisher validate server.json

      - name: Authenticate to the MCP registry (GitHub OIDC)
        if: steps.check.outputs.publish == 'true'
        run: mcp-publisher login github-oidc

      # The registry refuses to re-publish an existing version. On a re-run,
      # or when the version was already published by hand, that is success.
      - name: Publish server.json
        if: steps.check.outputs.publish == 'true'
        run: |
          out="$RUNNER_TEMP/mcp-publish.log"
          set +e
          mcp-publisher publish server.json > "$out" 2>&1
          status=$?
          set -e
          cat "$out"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # Classification lives in the validator so it is unit-tested.
          if python scripts/validate_server_json.py --is-duplicate-publish "$out"; then
            echo "::notice title=MCP registry::$(jq -r '.name + "@" + .version' server.json) is already published; nothing to do."
            exit 0
          fi
          echo "::error title=MCP registry::mcp-publisher publish failed (exit $status)"
          exit "$status"
