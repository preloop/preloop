# OpenSSF Scorecard supply-chain security analysis
# https://github.com/ossf/scorecard-action
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '30 2 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        # v2.4.4 pulls ghcr.io/ossf/scorecard-action (v2.4.0 used
        # gcr.io/openssf/scorecard-action, which now requires GCP billing).
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to OpenSSF REST API for badge and public visibility.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: results.sarif
