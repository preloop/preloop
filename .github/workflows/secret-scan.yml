# Credential scanning with gitleaks.
#
# codeql.yml covers SAST and scorecard.yml covers supply-chain posture, but
# nothing looked for a committed credential. That gap is not hypothetical for
# a repository that was private for its first year and is public now: the
# first history scan surfaced four high-entropy credential shapes in old
# commits, recorded and triaged in .gitleaksignore.
#
# Two scans, because they fail differently:
#   dir  the working tree. This is the one a PR must not regress.
#   git  the full commit history. Catches a secret that was added and then
#        "removed" in a later commit, which is the usual shape of the
#        mistake, and re-checks old commits as detection rules improve.
#
# gitleaks is installed with `go install` at a pinned version rather than
# through gitleaks/gitleaks-action, which requires a paid GITLEAKS_LICENSE
# for organisation repositories. The Go checksum database verifies the
# download, which is the same guarantee the SHA-pinned actions here give.

name: Secret Scan

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly. Detection rules move, and so does what counts as a secret.
    - cron: '30 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Findings go to the Security tab, not only to a job log. Not granted
      # on pull_request: the upload step is skipped there, because a fork PR
      # has no write token and the failure would be indistinguishable from a
      # real finding.
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history of this ref. A shallow clone would scan nothing and pass.
          # Do not rely on gitleaks' default `--all`; that walks every remote
          # branch fetch-depth: 0 pulled in.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      # --redact keeps a real secret out of a public build log. A scanner
      # that prints the credential it found has published it a second time.
      - name: Scan working tree
        id: scan-dir
        run: |
          gitleaks dir . \
            --no-banner \
            --redact \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks-worktree.sarif

      # Default `gitleaks git` is `git log --full-history --all`. Combined with
      # fetch-depth: 0 that walks every in-flight remote branch, so an unrelated
      # PR's false positive turns this check red. Keep full history of HEAD
      # (secrets added then removed on this lineage still fail) but not --all.
      - name: Scan git history
        if: always() && steps.scan-dir.conclusion != 'cancelled'
        run: |
          gitleaks git . \
            --no-banner \
            --redact \
            --config .gitleaks.toml \
            --log-opts="--full-history --diff-filter=tuxdb HEAD" \
            --report-format sarif \
            --report-path gitleaks-history.sarif

      - name: Upload SARIF reports as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-sarif
          path: gitleaks-*.sarif
          if-no-files-found: warn

      - name: Upload working-tree findings to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: gitleaks-worktree.sarif
          category: gitleaks-worktree

      - name: Upload history findings to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: gitleaks-history.sarif
          category: gitleaks-history
