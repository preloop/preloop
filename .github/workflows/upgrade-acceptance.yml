name: Upgrade acceptance

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      checkout_ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Published baseline tag (v1.0.2 or a stable 0.17.x tag)'
        required: true
        default: 'v1.0.2'
        type: string
      rc:
        description: 'Published 1.0.0/1.1.0 RC tag; empty rehearses the selected commit'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: upgrade-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PRELOOP_DISABLE_TELEMETRY: 'true'

jobs:
  harness-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r .github/requirements/upgrade-acceptance.txt
      - run: python -m pytest scripts/upgrade_acceptance/tests -q

  local-upgrade:
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && inputs.checkout_ref == ''
    needs: harness-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Install local harness prerequisites
        run: |
          python -m pip install --require-hashes -r .github/requirements/upgrade-acceptance.txt
          mkdir -p "$RUNNER_TEMP/upgrade-tools"
          cd "$RUNNER_TEMP/upgrade-tools"
          curl --fail --silent --show-error --location https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64 -o kind-linux-amd64
          curl --fail --silent --show-error --location https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64.sha256sum -o kind.sha256sum
          sha256sum --check kind.sha256sum
          install -m 755 kind-linux-amd64 kind
          echo "$RUNNER_TEMP/upgrade-tools" >> "$GITHUB_PATH"
      - name: Rehearse both local install surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ github.sha }}
          RC_TAG: ${{ inputs.rc }}
          BASELINE_TAG: ${{ inputs.baseline }}
        run: |
          args=(--runtime both --baseline "$BASELINE_TAG" --candidate-ref "$CANDIDATE_REF" --output "$RUNNER_TEMP/upgrade-evidence")
          if [[ "$BASELINE_TAG" == 'v1.0.2' ]]; then
            args+=(--installer --derive-encryption-key --cli-matrix)
          fi
          if [[ -n "$RC_TAG" ]]; then
            args+=(--rc "$RC_TAG")
          fi
          python scripts/upgrade_acceptance/runner.py "${args[@]}"
      - name: Upload only the credential-free result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: upgrade-acceptance-result
          path: ${{ runner.temp }}/upgrade-evidence/report.json
          if-no-files-found: warn
