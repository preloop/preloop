# GitHub Actions hardening audit with zizmor.
#
# The workflows here are pinned, permission-scoped, and credential-scrubbed;
# this job keeps them that way. It fails on ANY new finding, so the finding
# count cannot silently grow back. Deliberate acceptances live in
# .github/zizmor.yml with a reason each; fixes are preferred over entries
# there.
#
# zizmor is installed from PyPI at a pinned version rather than through an
# action, matching how secret-scan.yml installs gitleaks: the toolchain's
# package verification gives the same guarantee the SHA-pinned actions give.

name: Workflow Audit

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - '.github/**'
  schedule:
    # Weekly: zizmor's audit set moves, and so does what counts as a gap.
    - cron: '45 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install zizmor
        run: pip install zizmor==1.30.1

      # Exits non-zero on any finding not accepted in .github/zizmor.yml.
      - name: Audit workflows
        run: zizmor --no-progress .github/workflows
