exclude: |
    (?x)^(
        .*\.log\.json$
    )$

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        exclude: ^(helm/|scripts/examples/helm|mkdocs\.yml$|docs/scripts/screenshot-stack/compose\.(screenshots|ee)\.yml$)
    -   id: check-added-large-files
        exclude: ^(frontend/public/assets/screenshots/quickstart/dark/agents-onboarding\.webp|docs/assets/animations/quickstart/dark/agents-onboarding\.webp)$
    -   id: debug-statements
    -   id: check-toml

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

-   repo: local
    hooks:
      - id: forbid-junk-files
        name: Forbid backup and editor junk files
        entry: 'Backup/editor junk files (*.bak, *.orig, *.swp) must not be committed. Delete the file or rename it if it is real source:'
        language: fail
        files: '\.(bak|orig|swp)$'

-   repo: local
    hooks:
      - id: frontend-format
        name: Format frontend TypeScript
        entry: bash -c 'cd frontend && npm run format'
        language: system
        files: ^frontend/src/.*\.ts$
        pass_filenames: false

-   repo: local
    hooks:
    -   id: generate-openapi
        name: Generate OpenAPI schema
        entry: python scripts/generate_openapi.py
        language: system
        types: [python] # Run when Python files are committed
        pass_filenames: false # The script doesn't need filenames
        stages: [pre-commit] # Run during the commit stage
