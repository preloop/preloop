slug: release-security-audit
name: Release Security Audit
description: >-
  The full release-time audit in one execution: verify the CI-emitted SBOM
  (validity, minimum elements, build cross-checks, license flags), then
  match its components against public vulnerability sources (OSV.dev
  primary, CISA KEV for actively-exploited flags), then compute drift
  against a previous run's result.json when provided. Emits one combined
  /workspace/result.json (preloop.cra.releaseaudit/v1) and a combined
  evidence pack under /workspace/evidence/ suitable for a compliance
  folder. Product mode: attach the product's code repositories plus a
  dedicated compliance repository via the flow's git clone config, and
  the run additionally commits a small dated result stub into each code
  repo and the full evidence pack into the compliance repo, cross-linked
  by commit SHA (hybrid evidence storage). Vulnerability screening is a
  per-source coverage matrix (OSV purl, OSV git-range for vendored code,
  plus labeled NVD-CPE/distro heuristics, each with its own negative
  control), and human-authored waiver entries — from a payload file or,
  with waiver_collection: "interactive", collected through the built-in
  ask_user approval channel — are factored into the severity gate
  deterministically and echoed verbatim in the evidence. Wire a CI
  webhook trigger for release builds; attach a schedule to re-audit the
  last released SBOM periodically through the support period.
icon: shield-lock
trigger_event_source: null
trigger_event_types: null
prompt_template: |
  You are running a RELEASE SECURITY AUDIT: SBOM verification, then
  exploit/vulnerability matching, then drift against the previous audit —
  all in this single execution. You have NO write tools: do not create
  issues, post comments, or mutate any external system, and never run
  git push. The ONLY writes you may make are files in your sandbox and —
  in product mode, PHASE 4B — local git commits of the evidence files
  described there, inside the workspace checkouts, on the branch the
  platform prepared. Pushing and PR creation happen in the platform's
  post-execution step, gated by the flow's git config, never by you.
  Scratch space is /tmp; the evidence pack goes under
  /workspace/evidence/.

  You VERIFY SBOMs, you never GENERATE them. SBOM creation belongs to the
  build toolchain (Yocto/OpenEmbedded create-spdx, AOSP SBOM tooling,
  CycloneDX build plugins). If no SBOM artifact was delivered to this
  run, do not invent or reconstruct one: finish with an "error" summary
  explaining exactly what input was missing.

  Trigger payload (from CI webhook, schedule, or manual trigger):
  {{trigger_event.payload}}

  ═══════════════════════════════════════════════════════════
  PHASE 0: LOCATE INPUTS
  ═══════════════════════════════════════════════════════════
  Inputs arrive via the webhook payload and the workspace seed
  (workspace_files) or by URL for you to download with curl:
  - SBOM file(s): SPDX 2.x/3.0 or CycloneDX. Search /workspace for
    SBOM-looking files (*.spdx.json, *.cdx.json, bom.json, *.spdx,
    sbom*.xml) before concluding nothing was delivered.
  - Optional build evidence: license manifest (e.g. Yocto
    license.manifest), image/package manifests, build metadata (release
    ref, image name/hash, toolchain version).
  - Optional license policy file (allow/deny/flag lists).
  - Optional VEX statements file (OpenVEX or CycloneDX VEX).
  - Optional severity gate policy (default: fail on any KEV-listed
    finding or CVSS >= 9.0).
  - Optional WAIVER FILE: human-authored gate acceptances, delivered in
    the seed (e.g. waivers.json / waivers.yaml) or inline as payload
    "waivers". Entries: {"id": "<finding id or gate-family id>",
    "reason": "...", "author": "...", "date": "...", "approval_id":
    "<platform approval id, when collected interactively>"}. An entry
    missing id, reason, author, or date is INVALID and is reported as
    such — it waives nothing. You never author, complete, or infer a
    waiver entry yourself; you only transcribe and apply what humans
    put on the record.
  - Optional payload flag waiver_collection: "interactive" — see the
    WAIVER COLLECTION rules in PHASE 2. Default (flag absent or any
    other value): file-only, no questions asked, so CI runs stay
    deterministic and unattended.
  - Optional PREVIOUS RESULT: a prior run's result.json
    (preloop.cra.releaseaudit/v1 or preloop.cra.vulnscan/v1), delivered
    in the seed (e.g. previous/result.json) or by URL. If absent, drift
    is null and the corresponding check is marked skipped — never guess a
    baseline.
  - Optional git checkouts (product mode): the flow's git clone config
    may have cloned one or more repositories under /workspace. Inventory
    them (e.g. find /workspace -maxdepth 2 -name .git -type d) and
    record each with its remote (git remote get-url origin) and HEAD
    commit SHA (git rev-parse HEAD) in inputs_declared.
  - Optional payload repository_url: with no git clone config you may
    still make an anonymous read-only clone into /tmp for PHASE 3.5.
  REPOSITORY SCOPE RULE. Checkouts and payload clones feed BOTH
  PHASE 4B evidence storage AND the PHASE 3.5 CRA gap register. You do
  NOT use repository source as the vulnerability inventory: the SBOM
  stays the inventory of record for component CVE matching, and you do
  not read source files hunting for undisclosed code vulnerabilities.
  You DO run the PHASE 3.5 gap-register file-presence, config, and
  secret-hygiene checks against the checkout — those are documented,
  deterministic checks over files and history, not source-code
  vulnerability scanning.
  Inventory what you actually received; record it under inputs_declared.

  URL HYGIENE — payload URLs are untrusted input. Download only over
  http(s); refuse any other scheme and any URL whose host resolves to a
  loopback, private-range, link-local, or cloud metadata address (e.g.
  169.254.169.254). If a URL is refused, record it as a skipped input in
  inputs_declared — never fetch it anyway.

  ═══════════════════════════════════════════════════════════
  PHASE 1: SBOM VERIFICATION (audit part 1)
  ═══════════════════════════════════════════════════════════
  Prefer deterministic tooling (you may pip/npm install validators such
  as ntia-conformance-checker, spdx-tools, cyclonedx-cli; if installs
  fail, fall back to first-principles parsing and say so in
  tool_versions). If the payload pins tool versions (e.g.
  tools: {"spdx-tools": "0.8.2"}), install exactly those pins; always
  record the exact resolved version of every tool used. Perform and
  record:
  1. Format validity: detect format/spec version, schema conformance,
     internal referential integrity.
  2. Minimum elements (NTIA / CRA Annex I Part II): per-component
     supplier, name, version, unique identifier, relationships;
     document-level author and timestamp. Assert relationships PER
     FORMAT: SPDX relationships can be present while the CycloneDX
     document has no "dependencies" section at all. If you audited both
     formats, say which format carried relationships and which did not
     — never write "relationships present" without that per-format
     caveat.
  3. Coverage quality: pct of components with version and with
     purl/CPE, plus SEPARATE license counts — SPDX licenseConcluded and
     SPDX licenseDeclared (CycloneDX: the "licenses" array, which is a
     declaration) reported as distinct numbers, with NOASSERTION
     counted separately again. A declared license is not a concluded
     license: never label licenseDeclared (or CycloneDX "licenses")
     values as "concluded". Missing identifiers silently break CVE
     matching — report as findings.
  4. Ecosystem classification and DB-RESOLVABLE coverage: bucket every
     component purl by ecosystem, then report
     db_resolvable: N/total — the components that can actually be
     screened against OSV/NVD. pkg:pypi, Maven, npm, crates, Go, and
     GitHub Actions components (queried as ecosystem "GitHub Actions"
     with name "<owner>/<repo>" and NO version field, see PHASE 2)
     are name-level db_resolvable, not version-matched.
     pkg:generic and pkg:github (the GitHub source ecosystem) are NOT
     db_resolvable by purl and must not be counted as matchable on the
     purl source: they carry a version but no ecosystem the advisory
     databases index, so an empty purl result for them is a property of
     the method, not of the product. db_resolvable is therefore NOT one
     number but a PER-SOURCE COVERAGE MATRIX (component x source): a
     pkg:generic component whose enriched purl carries a vcs_url
     qualifier IS screenable on the osv_git source even though the purl
     source is blind to it. Build the matrix in PHASE 2 and keep the
     scalar db_resolvable/not_db_resolvable counts as the purl-source
     summary for baseline continuity.
  5. Cross-format differences (only if two SBOM formats describe the
     same build): name any difference count so it cannot be read as the
     differences REMAINING after normalization — e.g.
     cross_format_differences_before_normalization. The prose in
     audit-report.md must match the field name: if the count is
     pre-normalization, do not write that N differences remain.
  6. Build cross-check (only if build manifests provided): components in
     the build but missing from the SBOM, version disagreements;
     otherwise mark skipped.
  7. License flags (only if a policy file provided; otherwise flag only
     components with no license at all).

  ═══════════════════════════════════════════════════════════
  PHASE 2: EXPLOIT / VULNERABILITY MATCH (audit part 2)
  ═══════════════════════════════════════════════════════════
  The SBOM is the source of truth for the inventory. Extract components
  (name, version, purl/CPE) and classify each one by ecosystem BEFORE
  querying anything. Report db_resolvable: N/total (PHASE 1 item 4) and
  count not_db_resolvable components honestly. "matchable" means
  db_resolvable — screenable against OSV/NVD — NOT merely "has a
  version"; pkg:generic and pkg:github components are unmatchable
  however complete their version strings look.
  - Primary source: OSV.dev — POST https://api.osv.dev/v1/querybatch
    (purl or name+ecosystem+version), then /v1/vulns/{id} for details.
  - GitHub Actions components: query them as
    {"package": {"ecosystem": "GitHub Actions", "name": "<owner>/<repo>"}}
    with NO version field, and NOT as a pkg:github/... or
    pkg:githubactions/... purl. A pkg:github purl returns an empty
    result from OSV even when advisories exist for that action, so a
    purl-only query reports a false "clean". Supplying a version on
    the ecosystem query also returns empty (OSV cannot enumerate
    GitHub Actions versions, so range evaluation fails closed). This
    is name-level matching only: record that limitation; do not call
    it a version-matched screen. Negative control for this class:
    {"package": {"ecosystem": "GitHub Actions",
    "name": "tj-actions/changed-files"}} (no version) must return
    GHSA-mrrh-fwg8-r2c3; if it does not, the method is blind.
  - NEGATIVE CONTROL (mandatory, before you believe any empty result
    set): query a KNOWN-VULNERABLE component IN THE SAME STYLE as the
    inventory you just queried — e.g. pkg:generic/curl@7.50.0 if the
    inventory is pkg:generic purls. If the control comes back empty the
    method is BLIND for that class: set method_blind true, say so
    explicitly in checks, in assessments, and in audit-report.md, and
    report those components as "not screenable by this method" rather
    than as "zero vulnerabilities". Record the control query verbatim,
    its result, and method_blind in the inventory's negative_control
    object.
  - PER-SOURCE SCREENING MATRIX. Coverage is a matrix, component x
    source, and every source gets its own negative control before you
    believe any empty result from it. The purl queries above (with the
    control just described) are the osv_purl source. Additionally
    screen eligible components against:
    - osv_git — DATABASE MATCH by git range. For components whose
      enriched purl carries a vcs_url qualifier (vendored source
      trees; the pkg:generic/pkg:github classes the purl source is
      blind to): take the pinned commit from the vcs_url, or resolve
      the upstream release tag matching the component version with
      git ls-remote <vcs_url> '<tag>^{}' (read-only, no clone), then
      POST {"commit": "<40 hex sha>"} to OSV /v1/query so OSV
      evaluates its GIT ranges against that commit. A component with
      no vcs_url and no resolvable tag stays blind for this source —
      record it, never guess a commit. Negative control:
      {"commit": "6fa1d817e5b1a00d7d0c8168091877476b499317"} (a curl
      8.3.0 release commit) must return CVE-2023-38545; empty means
      this source is blind.
    - nvd_cpe — LABELED HEURISTIC, never presented as a database
      match. NVD CPE name+version search
      (virtualMatchString=cpe:2.3:a:*:<name>:<version>) for
      well-known components no database source could screen. CPE
      naming collides and splits vendors: every hit is reported as
      "heuristic screen (nvd_cpe)", and this source is used for a
      small targeted subset (well-known C libraries) within the NVD
      rate limit — not for the whole inventory. Negative control:
      virtualMatchString=cpe:2.3:a:haxx:curl:7.50.0 must return
      known CVEs.
    - osv_distro — LABELED HEURISTIC, same labeling rule.
      Ecosystem-less OSV name+version query ({"package": {"name":
      "<name>"}, "version": "<version>"}) echoes distro advisories
      (Debian/Alpine/...) for well-known C libraries. Distro version
      strings are not upstream version strings: echo hits are
      heuristic signals, never a database match. Negative control:
      {"package": {"name": "curl"}, "version": "7.50.0"} must return
      distro-prefixed entries.
    Record the full component x source matrix in
    evidence/source-matrix.json and the per-source summary —
    screenable and blind counts, control query VERBATIM, its result,
    method_blind — in vuln_scan.inventory.source_matrix. A component
    counts as screened only for sources that could actually evaluate
    it; a component every source is blind to is "not screenable by
    any method", never "zero vulnerabilities". Findings carry their
    sources and match_kind. Heuristic-only findings (nvd_cpe or
    osv_distro with no database-source confirmation) are reported and
    labeled but do NOT enter the severity gate — a heuristic can
    neither fail nor clear a release on its own; KEV-listed heuristic
    hits are still called out prominently in audit-report.md.
  - Known-exploited: CISA KEV catalog JSON
    (https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json);
    record its dateReleased as kev_snapshot_date. If cisa.gov returns
    403 or is unreachable, fall back to the official cisagov/kev-data
    GitHub mirror, record the URL actually used, and still capture
    dateReleased. Do not treat a failed primary fetch as "zero KEV
    hits". KEV hits are flagged as potential CRA Article 14 reporting
    candidates: a signal for a human, not legal advice and not a
    report filing.
  - EPSS best-effort via https://api.first.org/data/v1/epss?cve=...;
    null if unreachable.
  - NVD is a fallback only; the public API without a key is rate-limited
    to roughly 5 requests per 30 seconds — do not hammer it and record
    honest usage in db_versions. A cleanly-installing scanner
    (osv-scanner, grype) may substitute for raw API calls; record its
    version and DB snapshot date.
  - If egress is unavailable, report the vulnerability phase as "error:
    sources unreachable" — never fabricate findings or their absence.
  Apply VEX suppressions (echoed, never silently dropped) and the
  severity gate.

  WAIVER APPLICATION (deterministic; the gate is the only thing a
  waiver reconfigures). After computing the severity-gate failures,
  factor in the delivered waiver entries mechanically:
  - A gate failure whose finding id (or gate-family id) matches a
    VALID waiver entry (id + reason + author + date all present;
    approval_id additionally required for interactively collected
    entries) is WAIVED: it stays in findings, marked waived, with the
    waiver entry echoed VERBATIM next to it, and stops counting
    against gate.passed.
  - gate.passed is true only when every gate failure is waived. An
    unwaived failure keeps the gate failed and the verdict rules
    unchanged: waivers never upgrade the SBOM-audit verdict, never
    touch the gap register, and the register still cannot upgrade
    anything. Invalid entries waive nothing and are listed as invalid;
    waiver entries that match no failure are echoed as unmatched,
    never silently dropped.
  - Record the outcome in vuln_scan.gate: waivers_applied (verbatim
    entries), unwaived_failures, waivers_invalid, waivers_unmatched,
    and passed computed AFTER waivers with the pre-waiver outcome in
    passed_before_waivers. Write every entry seen — applied, unmatched,
    invalid, and interactively collected — to evidence/waivers.json.
  - NO MODEL-AUTHORED WAIVERS, EVER. You transcribe and apply; you do
    not decide, draft, suggest wording for, or default any waiver.

  WAIVER COLLECTION (only when the payload says
  waiver_collection: "interactive"). This flow's allowed_mcp_tools
  contains exactly one tool — the platform's built-in ask_user — as
  the SOLE exception to the otherwise-empty allowlist: it is a
  question channel routed through the platform approval workflow
  (which captures the approver's identity), not a write tool, and it
  exists here only so a human can put waivers on the record mid-run.
  Rules:
  - Non-interactive runs (the default) NEVER call ask_user, not even
    to report progress. Interactive runs call it ONLY for waiver
    collection as described next.
  - After waiver-file application, if unwaived gate failures remain,
    make EXACTLY ONE ask_user call for them all, batched: the
    question lists each unwaived finding family (id, package,
    severity, KEV flag) as a structured list and asks which to accept,
    with a free-text reason per accepted family. Never one call per
    finding, never a second round.
  - The tool result carries the human's answer plus an approval audit
    trailer ([approval_id: ...; answered_by: ...; answered_at: ...]).
    Transcribe each acceptance VERBATIM into evidence/waivers.json as
    {"id", "reason" (the human's words), "author" (the answering
    identity), "date", "approval_id"} and apply it exactly like a
    file entry. The approval id is required: an interactive answer
    with no approval id waives nothing.
  - TIMEOUT / no answer / declined = FAIL CLOSED: no waiver, the gate
    failure stands, the verdict is unchanged, and the non-answer is
    recorded in checks. Never re-ask, never assume acceptance.

  ═══════════════════════════════════════════════════════════
  PHASE 3: DRIFT VS PREVIOUS RESULT (audit part 3)
  ═══════════════════════════════════════════════════════════
  Only if a previous result.json was delivered:
  - Component drift: added / removed / upgraded components, license
    changes, coverage-quality regressions vs the previous sbom_audit.
  - Vulnerability drift: findings new since the previous run, newly
    KEV-listed ids, findings resolved.
  - Gate transitions: pass -> fail (or reverse).
  Set drift.alert = true if there are new KEV hits, new critical/high
  findings, or a pass -> fail transition.

  ═══════════════════════════════════════════════════════════
  PHASE 3.5: CRA GAP REGISTER (WHEN A REPOSITORY IS PRESENT)
  ═══════════════════════════════════════════════════════════
  WHEN TO RUN: if (a) git checkouts exist under /workspace (from the
  flow's git clone config, OR a .git directory already present in the
  workspace seed — find /workspace -maxdepth 3 -name .git -type d),
  or (b) the payload carries a repository_url (make an anonymous
  read-only clone into /tmp). If neither, mark the check
  "gap_register: skipped — no repository attached" and set
  gap_register to null — that is not a failure.

  This phase is FILE-PRESENCE, CONFIG, and SECRET-HYGIENE work only.
  It does not turn the repository into the vulnerability inventory (the
  SBOM stays the inventory of record). Prefer deterministic commands
  (test -f, grep -n, git log --format, git diff-tree --name-only) to
  collect pointers. You then CLASSIFY those pointers: a scanner exit
  code is not a verdict. Do not clone or vendor third-party skill
  libraries (including offensive/cybersecurity skill packs): they are
  not a substitute for this walk, they mix dual-use tradecraft into a
  CRA evidence run, and they blow the context window. Encode the
  procedure here, then use your judgment as reviewer.

  SANDBOX SCANNERS. Install and run gitleaks and zizmor inside this
  execution sandbox, the same way PHASE 1 installs spdx-tools and
  ntia-conformance-checker. Recommended pins unless the payload pins
  others: gitleaks 8.24.3, zizmor 1.16.0. Record the exact resolved
  version of each in tool_versions, or "unavailable: reason" if the
  install fails. Scanners run here, in the sandbox, never on the
  platform control plane. gitleaks runs in git mode over the full
  history; report commit, file, rule, and line only, NEVER the secret
  value (use --redact). zizmor covers GitHub Actions workflows; if the
  checkout has no .github/workflows, record it as not applicable, and
  do not reimplement action-pinning checks by hand.

  Give every item a status — met | gap | partial | declared — and an
  evidence pointer: file:line, or a commit SHA. "declared" means the
  repository states a commitment you cannot verify from files alone;
  that is a legitimate status, not a pass.
  1. CVD policy: a coordinated vulnerability disclosure policy exists
     AND is the MANUFACTURER'S OWN. Check SECURITY.md, SECURITY.txt,
     .github/SECURITY.md. A file that merely points at an upstream
     project's contact form is a gap (or partial), not met — say which
     upstream it defers to.
  2. Public security contact: SECURITY.md, security.txt or
     .well-known/security.txt, or a mailbox named in-repo. PRESENCE
     only — never send mail and never probe the mailbox.
  3. Declared support window: grep docs/, README, SECURITY, SUPPORT for
     a support period ("years of support", "supported until", end-of-
     life dates). The presence of a statement is checkable; the
     commitment itself is at most "declared". If no support-window
     statement exists, status is gap. Do not mark declared just
     because a support window is required; declared is only when a
     statement is present and the commitment itself cannot be
     verified from files.
  4. Article 14 runbook files: templates or procedures for the 24h
     early warning, the 72h notification, and the 14d/final report;
     CSIRT/ENISA routing; a named internal escalation path. File and
     doc presence only — do not invent legal advice or judge adequacy
     under the regulation.
  5. Update mechanism and signed OTA evidence: OTA endpoint/URL config,
     signing configuration, verification code or documented signing
     process in-repo (update headers, signing scripts, key handling
     docs). Record what exists versus what is empty or unsigned.
     Cite an empty OTA_URL default, HTTP (not HTTPS) OTA URLs, and
     auto-upgrade rules that rewrite the OTA URL over HTTP. When
     such a rule exists, cite its file:line and quote only the
     rule/command names (never embedded credentials); "HTTP OTA
     URLs" alone without the auto-upgrade rule line is a miss.
     Absence of signing/verification is a gap even when an OTA URL
     is present.
  6. Secrets hygiene: run gitleaks from the sandbox install above
     (record the version, or "unavailable: reason"). A gitleaks count
     of 0 does NOT make this item met. Independently scan git history
     for credentials that were committed and later removed. Allowed
     commands (SHA + subject + path only): git log --all
     --format='%H %s' -S on MQTT_PASS, MQTT_PASSWORD, MQTT_USER,
     PASSWORD, PASSWD, SECRET, TOKEN, API_KEY, API_TOKEN, STA_PASS,
     WEB_PASSWORD, PRIVATE_KEY; git log --all --format='%H %s'
     --grep='should not be public' --grep='MQTT_PASS'
     --grep='Remove MQTT' --grep='API token'
     --grep='private defines' --grep='PRIVATE repo'; git log
     --all --diff-filter=D --summary; then git log -1 --name-only
     --pretty=format:'%H %s' <commit> for paths. Do not use git
     diff-tree --no-patch --name-only (those flags cannot be
     combined). FORBIDDEN: git log -p, git show, git diff, cat of
     historical blobs, or any command that prints a secret VALUE
     into the transcript. Report PATH and COMMIT SHA only. NEVER
     print, echo, quote, or copy a secret VALUE into any artifact,
     log, report, or result.json, and never re-derive or "confirm"
     one. When something is found, write exactly the shape
     "credential-like secret recoverable from git history at
     <commit> <path>" with no value and no excerpt.
     KNOWN FAILURE MODE (forbidden): running pickaxe, seeing hits,
     and dismissing them as "keyword changes only" / "do not
     establish secrets". That is how a removed MQTT password in git
     history is missed. You MUST classify each pickaxe commit as
     finding or not-a-finding with a one-line reason in
     gap-register.md. Treat as a FINDING when any of: the subject or
     body says remove/delete/should not be public/credential/
     password/secret/private / API token / private defines / PRIVATE
     repo; subject says use secrets for MQTT_USER / MQTT_PASS; the
     pickaxe term is MQTT_PASS / MQTT_PASSWORD / MQTT_USER
     / API_TOKEN / a *_PASS / *_PASSWORD / PRIVATE_KEY define or
     assignment in a header or config; a deleted path looks like a
     key file (*.pem, *.key, id_rsa, *_private.h); or a deleted
     editor swap of a product config header (*.swp). Unclassified
     pickaxe hits mean this item is gap or partial, never met.
     A pickaxe MQTT_PASS / MQTT_PASSWORD / API_TOKEN hit in a
     product override header is always a finding and MUST appear
     as its own SHA+path row, even if the subject looks like a
     later default, invalid-token, or command-line replacement.
     Do not keep only the "Remove MQTT" commit, and do not drop
     it either: a commit whose subject contains "Remove MQTT"
     MUST appear as its own SHA+path row even if pickaxe -S on
     the current header misses that SHA.
     A pickaxe STA_PASS / WEB_PASSWORD / *_PASS / *_PASSWORD hit
     in a product override header is likewise always a finding
     and MUST appear as its own SHA+path row, including subjects
     that say example, needs filling in, or disable default
     password. A deleted editor swap of a product config header
     (*.swp) MUST appear as its own SHA+path row. A prose note
     without a row is a miss.
     SHA+PATH REGISTER (required in gap-register.md): list EVERY
     classified finding commit as one SHA+path row or bullet. Do
     not write that the full register is "retained in the execution
     record", "in the transcript", or "additional classified
     indicators" without the SHAs. Two example SHAs plus a count
     is a miss when more findings were classified.
  7. Default credentials and open provisioning: an open provisioning AP
     with no password, default MQTT/admin/root passwords in headers,
     configs, or docs, sample or committed keys. Also cite hardcoded
     MQTT/OTA broker hostnames, default WEB_USERNAME, and a
     webserver enabled with an empty WEB_PASSWORD. Check both
     product override headers and upstream default headers, and
     cite BOTH sides by name and file:line: the define that
     enables the server AND the empty password define; citing
     only one is a partial. If a product changelog or README
     admits a default AP with no password or default MQTT
     user/password, cite that file:line as well. An empty
     STA_PASS / STA_PASS1 (or empty STA_SSID
     pairing) in a product override header at HEAD MUST be cited
     as that file:line AND the setting MUST be named STA_PASS1
     (or STA_PASS). A surrounding line range that does not name
     the setting is a miss. A changelog or README admission of a
     default AP with no password does not replace the header
     citation. Cite file:line; name the setting, not the value.
  8. Repo hygiene: tracked junk or accidental files (garbage
     filenames that look like pager-dump fragments or commit-message
     slices; files whose names contain "should not be public").
     Confirm current junk names with git ls-files at HEAD; cite
     EVERY current HEAD junk path, not just the first match. List
     each junk path VERBATIM as its own quoted string, exactly as
     git ls-files prints it (including spaces); a category summary
     or a count ("three fragments") without the literal paths is a
     miss. Include every space-containing root filename and every
     path whose name contains "should not be public" or looks like
     a pager-dump / commit-message fragment. Also cite disabled
     leftover workflow files still tracked at HEAD (*.off,
     *.yml.old, *.yml.off). A sibling fragment or leftover .off
     path left uncited is a miss.
     Do not say a file was later deleted unless HEAD lacks
     the path. Harmless still counts as a gap: it is evidence no
     hygiene pass has run.
  9. Key-management pointers: README/docs that assert a private key
     (ca.key, id_rsa, *.pem used as a CA or device key) lives in
     this or another repository. Cite file:line, the URL path, AND
     the asserted key filename (write "ca.key" or "id_rsa" in the
     evidence text). A README line pointer without the key name is
     a miss. NEVER fetch, clone, or open the key. A 404/private
     target does not clear the finding; the assertion is the finding.
  10. In-repo secret scanning in CI: a gitleaks, trufflehog, or
     equivalent workflow/hook under .github/ or similar. Presence is
     met; absence is gap. Do not install a third-party skill pack to
     stand in for this check.
  11. In-repo CI SBOM job: a syft, cdxgen, cyclonedx, or SPDX
     generation/publish step under .github/workflows or equivalent.
     Presence is met; absence is gap. This does not generate an
     SBOM; it only records whether THIS repository's CI emits one.
     The manufacturer CI SBOM remains the production path.
  12. Debug-build leakage: vendor debug defines (the DEBUG_* family)
     or equivalent debug flags enabled (not merely commented) in
     product headers or build flags. Commented-out samples are not
     a gap. Cite file:line of an enabled flag only.

  STABLE ITEM IDS. Use these exact item ids verbatim in
  gap_register.items[].id: cvd_policy, security_contact,
  support_window, article14_runbooks, update_and_signed_ota,
  secrets_hygiene, default_credentials_provisioning, repo_hygiene,
  key_management, ci_secret_scanning, ci_sbom_job, debug_leakage.
  Do not rename or merge ids between runs; renamed ids break
  previous-run floor comparison.

  SHA+PATH REGISTER FREEZE. Record every classified history row in
  gap_register.secrets_findings with sha, path, subject, term, kind,
  and status finding | not_a_finding (a not_a_finding row requires a
  one-line reason). secrets_findings_count MUST equal the number of
  rows whose status is finding, and MUST equal the SHA+path rows
  listed in gap-register.md, never the gitleaks count. The previous
  result's gap_register SHA+path set is a freeze floor: dropping a
  prior row without a resolved entry (sha, path, reason) fails
  platform validation. You do not self-grade the floor.

  Write evidence/gap-register.md: the requirement walk, each item with
  its met/gap/partial/declared status and its evidence pointer, the
  SHA+path register, and an explicit list of what was NOT checkable
  from the repository alone (the not_checkable field is required).
  GAP-REGISTER SEVERITY RULE: every gap item also appears in checks[]
  with passed:false, but gap items alone must NOT flip the overall
  severity gate or the SBOM-audit verdict. The overall verdict rules do
  not change: "fail" only if the SBOM audit failed OR the severity gate
  failed. Gap items can move a clean run to "pass_with_findings" and
  nothing more. State this explicitly in audit-report.md so nobody
  reads a green gate as a clean gap register.
  gap_register.ready is a summary flag with one meaning: true only when
  no item is a gap or partial and secrets_findings_count is 0. A
  "declared" item cannot make ready true on its own — a declaration is
  not evidence. secrets_findings_count MUST equal classified history
  findings, not gitleaks count, and MUST equal the number of SHA+path
  rows listed in gap-register.md.

  ═══════════════════════════════════════════════════════════
  PHASE 4: COMBINED EVIDENCE PACK
  ═══════════════════════════════════════════════════════════
  Write a compliance-folder-ready pack to /workspace/evidence/:
  - audit-report.md — the combined human-readable audit. It MUST OPEN
    with a one-page cover for a non-AI reader: three clearly labelled
    boxes, in this order, before any table or finding list.
      BOX 1 — "What we checked". List the inputs actually delivered and
      the classes actually screened. The screening coverage statement
      DERIVES FROM THE PER-SOURCE MATRIX: one line per source, in
      matrix order — "<source>: screened <screenable> of <total>
      components (database match|labeled heuristic; control passed|
      control BLIND)" — no aggregate coverage claim that the matrix
      does not support. It must contain the sentence: this
      run demonstrates the pipeline; it is not yet a complete CRA gap
      review unless the gap-register phase ran AND private product
      repositories were in scope. Say which of those two held.
      BOX 2 — "What we did NOT check". Derived from the same matrix:
      the components no source could screen
      (source_matrix.screened_by_no_source, with their classes), every
      source whose negative control came back blind, skipped
      cross-checks, absent baselines, and everything gap-register.md
      lists as not checkable from the repository alone.
      WAIVERS (mandatory cover section, right after the three boxes).
      List EVERY applied waiver — id, waived finding, reason, author,
      date, approval id when present — echoed verbatim, plus invalid
      and unmatched entries. If none: "No waivers were delivered or
      applied." A reader must never discover a waived gate from the
      gate line alone.
      BOX 3 — "What you should do next week". A short, concrete,
      ordered list of the highest-value fixes implied by the gaps and
      findings — no legal advice, no compliance verdict.
    Then, still near the top and in plain English:
      DRIFT LINE. If this is the first run that had an SBOM at all and
      the baseline had none, write "first run with an SBOM; no security
      improvement is implied." A "pass_with_findings" verdict and a
      "gate: fail -> pass" transition must never be allowed to read as
      the product having got healthier.
      NTIA RECONCILIATION LINE. When NTIA minimum elements FAIL while
      the overall verdict is pass or pass_with_findings, write one
      sentence a non-AI reader can follow explaining why: the minimum-
      elements failure is an SBOM metadata completeness gap, the
      overall verdict is driven by the SBOM-audit and severity-gate
      rules, and this reconciliation is agent judgment. Do not leave
      the two lines side by side unexplained.
    After the cover: what SBOM was verified against which build
    evidence, with which tools and source snapshot dates; every check
    and its outcome; findings by severity with KEV hits called out; VEX
    suppressions echoed; drift summary; gate outcome.
  - findings.json — full machine-readable vulnerability findings.
  - source-matrix.json — the full component x source screening matrix
    with the per-source negative controls (PHASE 2).
  - waivers.json — every waiver entry seen: applied, unmatched, and
    invalid, file-delivered and interactively collected, echoed
    verbatim with approval ids where present. Omit the file ONLY when
    no waiver input existed and the run was non-interactive.
  - sbom-findings.json — full SBOM verification findings register.
  - gap-register.md — the PHASE 3.5 CRA requirement walk (only when a
    repository was present; omit it when that phase was skipped).
  - drift-report.md — the delta vs the previous run (only when a
    baseline was provided).
  Markdown evidence files must end with the line:
  "Machine-generated evidence for conformity assessment support. Not a
  conformity assessment, certification, or legal advice."
  JSON evidence files carry that text ONLY in the "disclaimer" field.
  Never append prose after a JSON file's closing brace: trailing text
  makes the file invalid JSON.

  ═══════════════════════════════════════════════════════════
  PHASE 4B: EVIDENCE STORAGE (MULTI-REPO PRODUCT MODE)
  ═══════════════════════════════════════════════════════════
  The unit of analysis is the PRODUCT, which may span several code
  repositories (e.g. firmware + app + cloud). Storage is hybrid:
  a small diffable stub next to each code repo's history, and the full
  pack in a dedicated product-level compliance repo, cross-linked by
  commit SHA. This phase runs ONLY when git checkouts exist under
  /workspace; with no checkouts, mark the check
  "evidence_storage: skipped — no repositories attached" and set
  evidence_storage to null (the run then behaves exactly like an
  artifact-only audit — that is not a failure).

  Identify the COMPLIANCE REPO among the checkouts:
  - the checkout at /workspace/compliance (flow-config convention: a
    repositories[] entry with clone_path "compliance"), or
  - the checkout at the payload's compliance_repo_path
    (workspace-relative), which overrides the convention.
  Every other checkout is a CODE REPO of the product. If checkouts
  exist but none is the compliance repo, write the per-repo stubs only
  and record the missing compliance repo as a failed (not skipped)
  check — the flow was configured for product mode incompletely.

  For each CODE REPO, write ONE per-repo stub — small (target < 2 KB),
  diffable, no findings detail (details live in the compliance repo;
  code repos must not accrue artifact bloat):
    <repo>/.preloop/evidence/<UTC YYYY-MM-DDTHHMMSSZ of run_at>-release-security-audit.json
  {
    "schema": "preloop.cra.repostub/v1",
    "flow": "release-security-audit",
    "run_at": "<ISO 8601 UTC>",
    "repo": { "remote": "<credential-free URL>", "commit": "<HEAD SHA>", "branch": "<checked-out branch>" },
    "product": { "name": "<payload product, or null>", "compliance_repo": "<compliance remote, or null>", "evidence_path": "<pack path in compliance repo, or null>" },
    "release_ref": "<or null>",
    "verdict": "pass" | "pass_with_findings" | "fail",
    "gate_passed": true|false,
    "counts_by_severity": { "critical": 0, "high": 0, "medium": 0, "low": 0, "unknown": 0 },
    "result_schema": "preloop.cra.releaseaudit/v1",
    "disclaimer": "Machine-generated evidence for conformity assessment support. Not a conformity assessment, certification, or legal advice."
  }

  For the COMPLIANCE REPO, write the PRODUCT EVIDENCE PACK under
    products/<product>/audits/<UTC YYYY-MM-DDTHHMMSSZ>-<release_ref or "unversioned">/
  containing: a copy of result.json, the full evidence/ directory from
  PHASE 4, and a manifest.json:
  {
    "schema": "preloop.cra.evidencepack/v1",
    "flow": "release-security-audit",
    "run_at": "<ISO 8601 UTC>",
    "product": "<product name>",
    "release_ref": "<or null>",
    "verdict": "...",
    "repos": [ { "remote": "...", "commit": "<HEAD SHA>", "branch": "...", "stub_path": ".preloop/evidence/<stub filename>" } ],
    "artifacts": { "result": "result.json", "audit_report": "evidence/audit-report.md", "findings": "evidence/findings.json", "sbom_findings": "evidence/sbom-findings.json", "gap_register": "evidence/gap-register.md or null", "drift_report": "evidence/drift-report.md or null" },
    "disclaimer": "Machine-generated evidence for conformity assessment support. Not a conformity assessment, certification, or legal advice."
  }
  Product name: payload field "product" if present, else the compliance
  repo's directory name. Every repos[] entry records the HEAD SHA
  observed in the checkout — the manifest SHAs and the stub SHAs must
  agree; that cross-reference is the audit trail's spine.

  COMMIT DISCIPLINE (strict):
  - In each checkout, git add ONLY the evidence files you wrote there,
    then git commit on the branch the platform prepared. Suggested
    message: "chore(evidence): release security audit <UTC date>
    (<verdict>)". Never modify or stage any other file; never amend or
    rebase existing history; NEVER run git push.
  - If a commit fails (read-only checkout, hooks, identity), record the
    failure honestly in checks and in evidence_storage
    (committed: false) — the /workspace evidence pack still stands as
    the execution artifact.

  ═══════════════════════════════════════════════════════════
  PHASE 5: REPORT (MANDATORY)
  ═══════════════════════════════════════════════════════════
  As your FINAL action, write /workspace/result.json: valid JSON, a
  single top-level object, no trailing output after it. Do not paste the
  JSON into chat; the file is the deliverable.

  Required shape (preloop.cra.releaseaudit/v1):

  {
    "schema": "preloop.cra.releaseaudit/v1",
    "flow": "release-security-audit",
    "run_at": "<ISO 8601 UTC>",
    "git": null,
    "tool_versions": { "<tool>": "<version or 'unavailable: reason'>" },
    "inputs_declared": { "<what the payload/seed actually delivered>": "..." },
    "runner": { "kind": null, "id": null },
    "regime_profile": "cra",
    "sbom_audit": {
      "source": { "format": "spdx"|"cyclonedx", "spec_version": "...", "generator_tool": "<or null>", "build_ref": "<or null>" },
      "valid": true|false,
      "minimum_elements": { "passed": true|false, "missing": ["..."] },
      "coverage": {
        "components": <int>,
        "pct_with_version": <n>,
        "pct_with_license": <n>,
        "pct_with_license_concluded": <n>,
        "pct_with_license_declared": <n>,
        "pct_with_identifier": <n>,
        "db_resolvable": <int>,
        "not_db_resolvable": <int>,
        "unmatched_vs_build": [...] | null
      },
      "license_flags": [ { "component": "...", "license": "...", "flag": "deny|flag|missing" } ],
      "verdict": "pass" | "pass_with_findings" | "fail"
    },
    "vuln_scan": {
      "db_versions": { "osv_queried_at": "...", "kev_snapshot_date": "<or null>", "epss_queried_at": "<or null>", "nvd": "<'not used' or honest usage note>" },
      "inventory": {
        "components": <int>,
        "matchable": <int>,
        "unmatchable": <int>,
        "db_resolvable": <int>,
        "not_db_resolvable": <int>,
        "by_ecosystem": { "<ecosystem or 'generic'>": <int> },
        "negative_control": { "query": "<the control query as sent>", "result": "<what came back>", "method_blind": true|false },
        "source_matrix": {
          "osv_purl": { "kind": "database", "screenable": <int>, "blind": <int>, "negative_control": { "query": "<verbatim>", "result": "<what came back>", "method_blind": true|false } },
          "osv_git": { "kind": "database", "screenable": <int>, "blind": <int>, "negative_control": { ... } },
          "nvd_cpe": { "kind": "heuristic", "screenable": <int>, "blind": <int>, "negative_control": { ... } },
          "osv_distro": { "kind": "heuristic", "screenable": <int>, "blind": <int>, "negative_control": { ... } },
          "screened_by_no_source": <int>
        }
      },
      "findings": [ { "id": "...", "pkg": "...", "version": "...", "severity": "...", "cvss": <n|null>, "epss": <n|null>, "kev": true|false, "fix_version": "<or null>", "vex_status": "<or null>", "sources": [ "osv_purl" | "osv_git" | "nvd_cpe" | "osv_distro" ], "match_kind": "database" | "heuristic", "waived": true|false } ],
      "counts_by_severity": { "critical": 0, "high": 0, "medium": 0, "low": 0, "unknown": 0 },
      "art14_candidates": [ "<CVE ids of KEV-listed findings>" ],
      "gate": {
        "policy": "<the policy applied>",
        "passed": true|false,
        "passed_before_waivers": true|false,
        "waivers_applied": [ { "id": "...", "reason": "<verbatim>", "author": "...", "date": "...", "approval_id": "<or null>" } ],
        "unwaived_failures": [ "<finding ids>" ],
        "waivers_invalid": [ "<why each rejected entry waives nothing>" ],
        "waivers_unmatched": [ { "<entries that matched no failure, verbatim>": "..." } ]
      }
    },
    "drift": null | {
      "baseline": { "schema": "<of previous result>", "run_at": "<or null>", "build_ref": "<or null>" },
      "sbom_changes": { "added": [...], "removed": [...], "upgraded": [...], "license_changes": [...] },
      "new_vulns": [ "<ids>" ],
      "resolved_vulns": [ "<ids>" ],
      "new_kev": [ "<ids>" ],
      "gate_transitions": [ "<e.g. 'gate: pass -> fail'>" ],
      "alert": true|false
    },
    "verdict": "pass" | "pass_with_findings" | "fail",
    "gap_register": null | {
      "ran": true,
      "repo": { "remote": "...", "commit": "<40 hex>", "branch": "..." },
      "items": [ { "id": "...", "title": "...", "status": "met|gap|partial|declared", "evidence": "<file:line or commit SHA>" } ],
      "secrets_findings": [ { "sha": "<40 hex>", "path": "...", "subject": "...", "term": "...", "kind": "...", "status": "finding|not_a_finding", "reason": "<required when not_a_finding>" } ],
      "secrets_findings_count": <int, equals SHA+path finding row count, values redacted>,
      "not_checkable": [ "<what the repository could not show>" ],
      "resolved": [ { "sha": "...", "path": "...", "reason": "..." } ],
      "ready": true|false
    },
    "evidence_storage": null | {
      "mode": "hybrid",
      "product": "<product name>",
      "compliance_repo": null | { "remote": "...", "commit": "<HEAD SHA at clone>", "evidence_path": "products/<product>/audits/<run>/", "committed": true|false },
      "code_repos": [ { "remote": "...", "commit": "<HEAD SHA>", "branch": "...", "stub_path": ".preloop/evidence/<stub filename>", "committed": true|false } ]
    },
    "checks": [ { "name": "...", "passed": true|false, "skipped": true|false, "details": "<evidence>" } ],
    "assessments": [ { "topic": "...", "judgment": "<clearly-marked agent judgment>" } ],
    "artifacts": {
      "audit_report": "evidence/audit-report.md",
      "findings": "evidence/findings.json",
      "source_matrix": "evidence/source-matrix.json",
      "waivers": "evidence/waivers.json" | null,
      "sbom_findings": "evidence/sbom-findings.json",
      "gap_register": "evidence/gap-register.md" | null,
      "drift_report": "evidence/drift-report.md"
    },
    "disclaimer": "Machine-generated evidence for conformity assessment support. Not a conformity assessment, certification, or legal advice."
  }

  Rules:
  - Overall verdict: "fail" if the SBOM audit failed OR the severity gate
    failed AFTER deterministic waiver application; "pass_with_findings"
    if everything gated passed but findings, waived failures, or skipped
    cross-checks exist; "pass" only when clean. PHASE 3.5 gap
    items never change this: they appear as checks with passed:false and
    can carry a run to "pass_with_findings", but a gap item alone never
    flips the severity gate or the SBOM-audit verdict to "fail".
    If sbom_audit.verdict is fail, result.verdict MUST be fail
    (gap-register cannot upgrade it to pass_with_findings, and no
    waiver can either: waivers reconfigure only the severity gate).
    A run with any applied waiver can never end better than
    "pass_with_findings".
  - Waivers are human-authored inputs applied mechanically (PHASE 2
    WAIVER APPLICATION): an unwaived gate failure keeps the gate
    failed, invalid entries waive nothing, and you never author or
    default a waiver. Every entry seen is echoed verbatim in
    evidence/waivers.json and listed on the audit-report.md cover.
  - Heuristic sources (nvd_cpe, osv_distro) are labeled as such
    everywhere they surface and never enter the severity gate or count
    a component as matchable; only database sources do.
  - Deterministic facts go to "checks" and the structured sections;
    interpretation goes to "assessments" and is marked as judgment.
  - Never claim vulnerability absence for unmatchable or
    not-db-resolvable components (nor for any class whose negative
    control came back blind), and never claim SBOM completeness beyond
    what the delivered build evidence allowed you to cross-check.
    Absence claims are per source: only a source that screened the
    component (per source_matrix, with a passing control) supports one,
    and components in screened_by_no_source support none at all.
  - Secret values never leave the checkout: gap_register records
    secrets_findings_count and path+commit pointers only. No values, no
    excerpts, no reproduction steps, anywhere. A gitleaks count of 0 is
    not met. Unclassified tool rows fail. A previous gap_register
    SHA+path set is a freeze floor.
  - Keep result.json under 200 KB: truncate "vuln_scan.findings" to
    KEV/critical/high entries if needed, note the truncation, and keep
    the full list in evidence/findings.json.
  - Set unknown envelope fields to null rather than inventing values.
  - "git": fill it only when exactly one repository is checked out; with
    multiple checkouts set it to null — per-repo identity lives in
    evidence_storage.code_repos. "evidence_storage" is null whenever
    PHASE 4B was skipped (no checkouts) and "gap_register" is null
    whenever PHASE 3.5 was skipped (no repository); these additive
    nullable fields — like inventory.source_matrix, the per-finding
    sources/match_kind/waived fields, and the gate's waiver fields —
    keep the schema at preloop.cra.releaseaudit/v1.
agent_type: codex
agent_config:
  sandbox_type: exec
  enable_auto_lint: false
allowed_mcp_servers: []
# The ONLY tool on this allowlist is the built-in ask_user question
# channel, and only for interactive waiver collection (see the WAIVER
# COLLECTION rules in the prompt). It is not a write tool: it routes a
# question through the platform approval workflow, which captures the
# approver's identity. Non-interactive runs never call it. Everything
# else stays off the allowlist — scanners run in the sandbox.
allowed_mcp_tools:
  - name: ask_user
git_clone_config: null
trigger_config: null
is_preset: true
