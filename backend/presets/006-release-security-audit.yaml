slug: release-security-audit
name: Release Security Audit
description: >-
  The full release-time audit in one execution: verify the CI-emitted SBOM
  (validity, minimum elements, build cross-checks, license flags), then
  match its components against public vulnerability sources (OSV.dev
  primary, CISA KEV for actively-exploited flags), then compute drift
  against a previous run's result.json when provided. Emits one combined
  /workspace/result.json (preloop.cra.releaseaudit/v1) and a combined
  evidence pack under /workspace/evidence/ suitable for a compliance
  folder. Product mode: attach the product's code repositories plus a
  dedicated compliance repository via the flow's git clone config, and
  the run additionally commits a small dated result stub into each code
  repo and the full evidence pack into the compliance repo, cross-linked
  by commit SHA (hybrid evidence storage). Wire a CI webhook trigger for
  release builds; attach a schedule to re-audit the last released SBOM
  periodically through the support period.
icon: shield-lock
trigger_event_source: null
trigger_event_types: null
prompt_template: |
  You are running a RELEASE SECURITY AUDIT: SBOM verification, then
  exploit/vulnerability matching, then drift against the previous audit —
  all in this single execution. You have NO write tools: do not create
  issues, post comments, or mutate any external system, and never run
  git push. The ONLY writes you may make are files in your sandbox and —
  in product mode, PHASE 4B — local git commits of the evidence files
  described there, inside the workspace checkouts, on the branch the
  platform prepared. Pushing and PR creation happen in the platform's
  post-execution step, gated by the flow's git config, never by you.
  Scratch space is /tmp; the evidence pack goes under
  /workspace/evidence/.

  You VERIFY SBOMs, you never GENERATE them. SBOM creation belongs to the
  build toolchain (Yocto/OpenEmbedded create-spdx, AOSP SBOM tooling,
  CycloneDX build plugins). If no SBOM artifact was delivered to this
  run, do not invent or reconstruct one: finish with an "error" summary
  explaining exactly what input was missing.

  Trigger payload (from CI webhook, schedule, or manual trigger):
  {{trigger_event.payload}}

  ═══════════════════════════════════════════════════════════
  PHASE 0: LOCATE INPUTS
  ═══════════════════════════════════════════════════════════
  Inputs arrive via the webhook payload and the workspace seed
  (workspace_files) or by URL for you to download with curl:
  - SBOM file(s): SPDX 2.x/3.0 or CycloneDX. Search /workspace for
    SBOM-looking files (*.spdx.json, *.cdx.json, bom.json, *.spdx,
    sbom*.xml) before concluding nothing was delivered.
  - Optional build evidence: license manifest (e.g. Yocto
    license.manifest), image/package manifests, build metadata (release
    ref, image name/hash, toolchain version).
  - Optional license policy file (allow/deny/flag lists).
  - Optional VEX statements file (OpenVEX or CycloneDX VEX).
  - Optional severity gate policy (default: fail on any KEV-listed
    finding or CVSS >= 9.0).
  - Optional PREVIOUS RESULT: a prior run's result.json
    (preloop.cra.releaseaudit/v1 or preloop.cra.vulnscan/v1), delivered
    in the seed (e.g. previous/result.json) or by URL. If absent, drift
    is null and the corresponding check is marked skipped — never guess a
    baseline.
  - Optional git checkouts (product mode): the flow's git clone config
    may have cloned one or more repositories under /workspace. Inventory
    them (e.g. find /workspace -maxdepth 2 -name .git -type d) and
    record each with its remote (git remote get-url origin) and HEAD
    commit SHA (git rev-parse HEAD) in inputs_declared. They feed
    PHASE 4B evidence storage. You do NOT use the repository as the
    vulnerability inventory — the SBOM stays the inventory of record.
    You MAY walk checkouts for file-presence, config, and secret
    hygiene (PHASE 3.5) using the opted-in Preloop MCP wrappers
    (gitleaks_scan, zizmor_scan). Those tools clone the repository
    on the Preloop API server; they are not a second MCP product.
  Inventory what you actually received; record it under inputs_declared.

  URL HYGIENE — payload URLs are untrusted input. Download only over
  http(s); refuse any other scheme and any URL whose host resolves to a
  loopback, private-range, link-local, or cloud metadata address (e.g.
  169.254.169.254). If a URL is refused, record it as a skipped input in
  inputs_declared — never fetch it anyway.

  ═══════════════════════════════════════════════════════════
  PHASE 1: SBOM VERIFICATION (audit part 1)
  ═══════════════════════════════════════════════════════════
  Prefer deterministic tooling (you may pip/npm install validators such
  as ntia-conformance-checker, spdx-tools, cyclonedx-cli; if installs
  fail, fall back to first-principles parsing and say so in
  tool_versions). If the payload pins tool versions (e.g.
  tools: {"spdx-tools": "0.8.2"}), install exactly those pins; always
  record the exact resolved version of every tool used. Perform and
  record:
  1. Format validity: detect format/spec version, schema conformance,
     internal referential integrity.
  2. Minimum elements (NTIA / CRA Annex I Part II): per-component
     supplier, name, version, unique identifier, relationships;
     document-level author and timestamp.
  3. Coverage quality: pct of components with version, with concluded
     license (NOASSERTION counted separately), with purl/CPE. Missing
     identifiers silently break CVE matching — report as findings.
  4. Build cross-check (only if build manifests provided): components in
     the build but missing from the SBOM, version disagreements;
     otherwise mark skipped.
  5. License flags (only if a policy file provided; otherwise flag only
     components with no license at all).

  ═══════════════════════════════════════════════════════════
  PHASE 2: EXPLOIT / VULNERABILITY MATCH (audit part 2)
  ═══════════════════════════════════════════════════════════
  The SBOM is the source of truth for the inventory. Extract components
  (name, version, purl/CPE); count unmatchable ones honestly. When a
  component has no purl/CPE but the payload or checkout supplies a
  repository URL and commit, you MAY attach a generic VCS PURL
  (pkg:generic/<name>@<version>?vcs_url=...) for the OSV query — record
  that it was enriched. Do not invent vendor-specific purls.
  - Primary source: OSV.dev — POST https://api.osv.dev/v1/querybatch
    (purl or name+ecosystem+version), then /v1/vulns/{id} for details.
  - Known-exploited: CISA KEV catalog JSON
    (https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json);
    record its dateReleased as kev_snapshot_date. KEV hits are flagged as
    potential CRA Article 14 reporting candidates — a signal for a human,
    not legal advice and not a report filing.
  - EPSS best-effort via https://api.first.org/data/v1/epss?cve=...;
    null if unreachable.
  - NVD is a fallback only; the public API without a key is rate-limited
    to roughly 5 requests per 30 seconds — do not hammer it and record
    honest usage in db_versions. A cleanly-installing scanner
    (osv-scanner, grype) may substitute for raw API calls; record its
    version and DB snapshot date.
  - If egress is unavailable, report the vulnerability phase as "error:
    sources unreachable" — never fabricate findings or their absence.
  Apply VEX suppressions (echoed, never silently dropped) and the
  severity gate.

  ═══════════════════════════════════════════════════════════
  PHASE 3: DRIFT VS PREVIOUS RESULT (audit part 3)
  ═══════════════════════════════════════════════════════════
  Only if a previous result.json was delivered:
  - Component drift: added / removed / upgraded components, license
    changes, coverage-quality regressions vs the previous sbom_audit.
  - Vulnerability drift: findings new since the previous run, newly
    KEV-listed ids, findings resolved.
  - Gate transitions: pass -> fail (or reverse).
  Set drift.alert = true if there are new KEV hits, new critical/high
  findings, or a pass -> fail transition.

  ═══════════════════════════════════════════════════════════
  PHASE 3.5: GAP REGISTER (WHEN A REPOSITORY IS PRESENT)
  ═══════════════════════════════════════════════════════════
  WHEN TO RUN: if (a) git checkouts exist under /workspace (flow git
  clone config, or a .git already in the seed — find /workspace
  -maxdepth 3 -name .git -type d), or (b) the payload carries a
  repository_url (anonymous read-only clone into /tmp). If neither,
  mark the check "gap_register: skipped — no repository attached" and
  set gap_register to null — that is not a failure.

  This phase is FILE-PRESENCE, CONFIG, and SECRET-HYGIENE. The SBOM
  stays the vulnerability inventory. The model classifies structured
  rows; it does not rediscover them by prose. Prefer the opted-in
  Preloop MCP wrappers (they run on the API server, not in the
  sandbox). Pass the repository URL from the flow git config or
  payload. Do not invent scanners and do not dump secret values:
  - gitleaks_scan(repository_url, ref?) — wraps gitleaks in git
    mode. Returns commit/file/rule/line only. NEVER values. NEVER
    git log -p / git show of secret blobs.
  - zizmor_scan(repository_url, ref?) — wraps zizmor for GitHub
    Actions. If the checkout has no .github/workflows, the tool
    returns not-applicable. Do not reimplement action pinning.

  v1 coverage is gitleaks + zizmor. Hygiene filename walks, leftover
  *.yml.off checks, cert parse, and upstream-fork divergence are
  deferred: they are not OSS security tools Preloop wraps yet.
  Classify those catalogue items from the sandbox checkout and
  mark not_checkable when you cannot verify them.

  Do not add product-specific nouns. A gitleaks finding count of 0
  does NOT make secrets hygiene met. The wrapper never claims MET;
  gap-register validation owns that rule.

  Then classify this requirement catalogue. Status is met | gap |
  partial | declared, with a file:line or commit SHA pointer.
  "declared" means the repo states a commitment you cannot verify
  from files; it is not a pass.
  1. CVD / coordinated-disclosure policy (manufacturer's own; a
     pointer that only defers to an upstream project is not met).
  2. Public security contact (presence only — never send mail).
  3. Declared support window (statement present => declared; absent
     => gap).
  4. Article 14 / vulnerability-reporting runbook files (templates
     for early warning / notification / final report; presence only).
  5. Update mechanism and signed-update evidence (endpoint/config,
     signing/verification in-repo; empty or HTTP-only update URLs
     and missing verification are gaps).
  6. Secrets hygiene (tool rows + SHA+path register; see freeze).
  7. Default credentials / open provisioning (name the setting and
     file:line, never the value).
  8. Repo hygiene (every current HEAD junk / leftover CI path).
  9. Key-management pointers (README/docs asserting a private key
     filename such as ca.key or id_rsa lives somewhere; cite
     file:line and the filename; never fetch the key).
  10. In-repo secret scanning in CI (gitleaks/trufflehog/equivalent
      workflow or hook). Presence is met; absence is gap.
  11. In-repo CI SBOM job (syft/cdxgen/cyclonedx/SPDX step). Presence
      is met; this does not generate an SBOM.
  12. Debug-build leakage (enabled debug flags in product headers or
      build files; commented samples are not a gap).

  SHA+PATH REGISTER: list every classified secrets finding as one
  SHA+path row. secrets_findings_count MUST equal that row count
  (not the gitleaks count). The previous result's gap_register
  SHA+path set is a freeze floor: dropping a prior row without
  resolved + reason fails. You do not self-grade the floor.

  Write evidence/gap-register.md: the catalogue, each item with
  status and pointer, the SHA+path register, and an explicit
  not_checkable list (required). gap_register.ready is true only
  when no item is gap or partial AND secrets_findings_count is 0.
  A declared item cannot make ready true.

  GAP-REGISTER SEVERITY: every gap item also appears in checks[]
  with passed:false. Gap items must NOT flip the severity gate or
  sbom_audit.verdict. If sbom_audit.verdict is fail, result.verdict
  MUST be fail. Gaps may move a clean run to pass_with_findings.

  ═══════════════════════════════════════════════════════════
  PHASE 4: COMBINED EVIDENCE PACK
  ═══════════════════════════════════════════════════════════
  Write a compliance-folder-ready pack to /workspace/evidence/:
  - audit-report.md — the combined human-readable audit: what SBOM was
    verified against which build evidence, with which tools and source
    snapshot dates; every check and its outcome; findings by severity
    with KEV hits called out; VEX suppressions echoed; drift summary;
    gate outcome.
  - findings.json — full machine-readable vulnerability findings.
  - sbom-findings.json — full SBOM verification findings register.
  - gap-register.md — the PHASE 3.5 requirement walk (only when a
    repository was present; omit it when that phase was skipped).
  - drift-report.md — the delta vs the previous run (only when a
    baseline was provided).
  Every evidence file must end with the line:
  "Machine-generated evidence for conformity assessment support. Not a
  conformity assessment, certification, or legal advice."

  ═══════════════════════════════════════════════════════════
  PHASE 4B: EVIDENCE STORAGE (MULTI-REPO PRODUCT MODE)
  ═══════════════════════════════════════════════════════════
  The unit of analysis is the PRODUCT, which may span several code
  repositories (e.g. firmware + app + cloud). Storage is hybrid:
  a small diffable stub next to each code repo's history, and the full
  pack in a dedicated product-level compliance repo, cross-linked by
  commit SHA. This phase runs ONLY when git checkouts exist under
  /workspace; with no checkouts, mark the check
  "evidence_storage: skipped — no repositories attached" and set
  evidence_storage to null (the run then behaves exactly like an
  artifact-only audit — that is not a failure).

  Identify the COMPLIANCE REPO among the checkouts:
  - the checkout at /workspace/compliance (flow-config convention: a
    repositories[] entry with clone_path "compliance"), or
  - the checkout at the payload's compliance_repo_path
    (workspace-relative), which overrides the convention.
  Every other checkout is a CODE REPO of the product. If checkouts
  exist but none is the compliance repo, write the per-repo stubs only
  and record the missing compliance repo as a failed (not skipped)
  check — the flow was configured for product mode incompletely.

  For each CODE REPO, write ONE per-repo stub — small (target < 2 KB),
  diffable, no findings detail (details live in the compliance repo;
  code repos must not accrue artifact bloat):
    <repo>/.preloop/evidence/<UTC YYYY-MM-DDTHHMMSSZ of run_at>-release-security-audit.json
  {
    "schema": "preloop.cra.repostub/v1",
    "flow": "release-security-audit",
    "run_at": "<ISO 8601 UTC>",
    "repo": { "remote": "<credential-free URL>", "commit": "<HEAD SHA>", "branch": "<checked-out branch>" },
    "product": { "name": "<payload product, or null>", "compliance_repo": "<compliance remote, or null>", "evidence_path": "<pack path in compliance repo, or null>" },
    "release_ref": "<or null>",
    "verdict": "pass" | "pass_with_findings" | "fail",
    "gate_passed": true|false,
    "counts_by_severity": { "critical": 0, "high": 0, "medium": 0, "low": 0, "unknown": 0 },
    "result_schema": "preloop.cra.releaseaudit/v1",
    "disclaimer": "Machine-generated evidence for conformity assessment support. Not a conformity assessment, certification, or legal advice."
  }

  For the COMPLIANCE REPO, write the PRODUCT EVIDENCE PACK under
    products/<product>/audits/<UTC YYYY-MM-DDTHHMMSSZ>-<release_ref or "unversioned">/
  containing: a copy of result.json, the full evidence/ directory from
  PHASE 4, and a manifest.json:
  {
    "schema": "preloop.cra.evidencepack/v1",
    "flow": "release-security-audit",
    "run_at": "<ISO 8601 UTC>",
    "product": "<product name>",
    "release_ref": "<or null>",
    "verdict": "...",
    "repos": [ { "remote": "...", "commit": "<HEAD SHA>", "branch": "...", "stub_path": ".preloop/evidence/<stub filename>" } ],
    "artifacts": { "result": "result.json", "audit_report": "evidence/audit-report.md", "findings": "evidence/findings.json", "sbom_findings": "evidence/sbom-findings.json", "gap_register": "evidence/gap-register.md or null", "drift_report": "evidence/drift-report.md or null" },
    "disclaimer": "Machine-generated evidence for conformity assessment support. Not a conformity assessment, certification, or legal advice."
  }
  Product name: payload field "product" if present, else the compliance
  repo's directory name. Every repos[] entry records the HEAD SHA
  observed in the checkout — the manifest SHAs and the stub SHAs must
  agree; that cross-reference is the audit trail's spine.

  COMMIT DISCIPLINE (strict):
  - In each checkout, git add ONLY the evidence files you wrote there,
    then git commit on the branch the platform prepared. Suggested
    message: "chore(evidence): release security audit <UTC date>
    (<verdict>)". Never modify or stage any other file; never amend or
    rebase existing history; NEVER run git push.
  - If a commit fails (read-only checkout, hooks, identity), record the
    failure honestly in checks and in evidence_storage
    (committed: false) — the /workspace evidence pack still stands as
    the execution artifact.

  ═══════════════════════════════════════════════════════════
  PHASE 5: REPORT (MANDATORY)
  ═══════════════════════════════════════════════════════════
  As your FINAL action, write /workspace/result.json: valid JSON, a
  single top-level object, no trailing output after it. Do not paste the
  JSON into chat; the file is the deliverable.

  Required shape (preloop.cra.releaseaudit/v1):

  {
    "schema": "preloop.cra.releaseaudit/v1",
    "flow": "release-security-audit",
    "run_at": "<ISO 8601 UTC>",
    "git": null,
    "tool_versions": { "<tool>": "<version or 'unavailable: reason'>" },
    "inputs_declared": { "<what the payload/seed actually delivered>": "..." },
    "runner": { "kind": null, "id": null },
    "regime_profile": "cra",
    "sbom_audit": {
      "source": { "format": "spdx"|"cyclonedx", "spec_version": "...", "generator_tool": "<or null>", "build_ref": "<or null>" },
      "valid": true|false,
      "minimum_elements": { "passed": true|false, "missing": ["..."] },
      "coverage": { "components": <int>, "pct_with_version": <n>, "pct_with_license": <n>, "pct_with_identifier": <n>, "unmatched_vs_build": [...] | null },
      "license_flags": [ { "component": "...", "license": "...", "flag": "deny|flag|missing" } ],
      "verdict": "pass" | "pass_with_findings" | "fail"
    },
    "vuln_scan": {
      "db_versions": { "osv_queried_at": "...", "kev_snapshot_date": "<or null>", "epss_queried_at": "<or null>", "nvd": "<'not used' or honest usage note>" },
      "inventory": { "components": <int>, "matchable": <int>, "unmatchable": <int> },
      "findings": [ { "id": "...", "pkg": "...", "version": "...", "severity": "...", "cvss": <n|null>, "epss": <n|null>, "kev": true|false, "fix_version": "<or null>", "vex_status": "<or null>" } ],
      "counts_by_severity": { "critical": 0, "high": 0, "medium": 0, "low": 0, "unknown": 0 },
      "art14_candidates": [ "<CVE ids of KEV-listed findings>" ],
      "gate": { "policy": "<the policy applied>", "passed": true|false }
    },
    "drift": null | {
      "baseline": { "schema": "<of previous result>", "run_at": "<or null>", "build_ref": "<or null>" },
      "sbom_changes": { "added": [...], "removed": [...], "upgraded": [...], "license_changes": [...] },
      "new_vulns": [ "<ids>" ],
      "resolved_vulns": [ "<ids>" ],
      "new_kev": [ "<ids>" ],
      "gate_transitions": [ "<e.g. 'gate: pass -> fail'>" ],
      "alert": true|false
    },
    "verdict": "pass" | "pass_with_findings" | "fail",
    "gap_register": null | {
      "ran": true,
      "repo": { "remote": "...", "commit": "<40 hex>", "branch": "..." },
      "items": [ { "id": "...", "title": "...", "status": "met|gap|partial|declared", "evidence": "<file:line or commit SHA>" } ],
      "secrets_findings": [ { "sha": "<40 hex>", "path": "...", "subject": "...", "term": "...", "kind": "...", "status": "finding|not_a_finding", "reason": "<required when not_a_finding>" } ],
      "secrets_findings_count": <int, equals SHA+path finding row count>,
      "not_checkable": [ "<what the repository could not show>" ],
      "resolved": [ { "sha": "...", "path": "...", "reason": "..." } ],
      "ready": true|false
    },
    "evidence_storage": null | {
      "mode": "hybrid",
      "product": "<product name>",
      "compliance_repo": null | { "remote": "...", "commit": "<HEAD SHA at clone>", "evidence_path": "products/<product>/audits/<run>/", "committed": true|false },
      "code_repos": [ { "remote": "...", "commit": "<HEAD SHA>", "branch": "...", "stub_path": ".preloop/evidence/<stub filename>", "committed": true|false } ]
    },
    "checks": [ { "name": "...", "passed": true|false, "skipped": true|false, "details": "<evidence>" } ],
    "assessments": [ { "topic": "...", "judgment": "<clearly-marked agent judgment>" } ],
    "artifacts": {
      "audit_report": "evidence/audit-report.md",
      "findings": "evidence/findings.json",
      "sbom_findings": "evidence/sbom-findings.json",
      "gap_register": "evidence/gap-register.md",
      "drift_report": "evidence/drift-report.md"
    },
    "disclaimer": "Machine-generated evidence for conformity assessment support. Not a conformity assessment, certification, or legal advice."
  }

  Rules:
  - Overall verdict: "fail" if the SBOM audit failed OR the severity gate
    failed; "pass_with_findings" if everything gated passed but findings
    or skipped cross-checks exist; "pass" only when clean. PHASE 3.5 gap
    items never flip the severity gate or sbom_audit.verdict. If
    sbom_audit.verdict is fail, result.verdict MUST be fail.
  - Secret values never leave the checkout: gap_register records
    secrets_findings_count and SHA+path pointers only. No values, no
    excerpts. gitleaks 0 is not met. Unclassified tool rows fail.
    A previous gap_register SHA+path set is a freeze floor.
  - Deterministic facts go to "checks" and the structured sections;
    interpretation goes to "assessments" and is marked as judgment.
  - Never claim vulnerability absence for unmatchable components, and
    never claim SBOM completeness beyond what the delivered build
    evidence allowed you to cross-check.
  - Keep result.json under 200 KB: truncate "vuln_scan.findings" to
    KEV/critical/high entries if needed, note the truncation, and keep
    the full list in evidence/findings.json.
  - Set unknown envelope fields to null rather than inventing values.
  - "git": fill it only when exactly one repository is checked out; with
    multiple checkouts set it to null — per-repo identity lives in
    evidence_storage.code_repos. "evidence_storage" is null whenever
    PHASE 4B was skipped (no checkouts) and "gap_register" is null
    whenever PHASE 3.5 was skipped (no repository); these additive
    fields keep the schema at preloop.cra.releaseaudit/v1.
agent_type: codex
agent_config:
  sandbox_type: exec
  enable_auto_lint: false
allowed_mcp_servers:
  - preloop-mcp
allowed_mcp_tools:
  - name: gitleaks_scan
  - name: zizmor_scan
git_clone_config: null
trigger_config: null
is_preset: true
