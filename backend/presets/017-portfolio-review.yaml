    "projects": [ { "path": "...", "status": "healthy" | "findings" | "failing" | "unknown", "cost_usd": <float or null>, "lenses": [ { "lens": "<lens slug>", "lens_schema": "<the schema that lens emits>" | null, "lens_status": "ran" | "failed" | "refused" | "expired" | "not_checkable" | "not_run", "reason": "<required unless lens_status is 'ran', else null>", "verdict": "pass" | "pass_with_findings" | "fail" | null, "health": "healthy" | "findings" | "failing" | "unknown", "counts": { "high": 0, "medium": 0, "low": 0 }, "child": { "execution_id": "<id>", "state": "<the platform status>", "cost_usd": <float or null>, "label": "<project path>|<lens slug>" } | null, "result_artifact": "evidence/projects/<slug>/<lens slug>/result.json" | null, "lens_payload": { "project_path": "...", "depth": "quick" | "standard" | "deep" } | null } ] } ],
