    "publication": { "open_portfolio_readme_pr": true|false, "source": "human" | "default" | "expired_default", "pr_opened": false, "pr_url": null, "reason": "<why nothing was opened>" },
    "verdict": "pass" | "pass_with_findings" | "fail",
    "checks": [ { "name": "...", "passed": true|false, "skipped": true|false, "details": "<evidence>" } ],
    "assessments": [ { "topic": "...", "judgment": "<clearly-marked agent judgment>" } ],
    "artifacts": { "report": "evidence/portfolio-report.md", "register": "evidence/projects-register.md", "findings": "evidence/findings.json", "inventory": "evidence/inventory.json", "questions": "evidence/questions.json", "children": "evidence/children.json" },
    "disclaimer": "Machine-generated review evidence. Not a certification, audit opinion, or legal advice."
  }

  Rules:
  - "status" is REQUIRED — it is the flow completion signal read by
    Preloop. Write "success" when the portfolio review ran to completion
    and this report was written (regardless of the verdict, and
    including the inventory-only run a question expiry produces, and
    including the run the ceiling stopped early — a parked run that
    resumed on an expiry still completed, and so did a run that stopped
    where the human's money stopped); write "error"
    (and add a "reason" field) when the review could not be completed.
  - coverage.plan_completed is true when the walk finished, the
    selection was resolved (human answer, payload, or
    auto_below_threshold), every project in selection.selected that is
    not in over_project_cap had its lens run, and the aggregation was
    written. An expired, declined, cancelled or unroutable selection
    question leaves plan_completed false: the inventory still lands
    (status success) but the review plan did not complete. An empty
    discovery that finished the walk is plan_completed true: there was
    nothing to select or review, and that emptiness is never a "pass".
    A run the ceiling stopped early also leaves plan_completed false.
  - coverage.projects_not_reviewed IS THE FLAT PATH LIST OF
    coverage.not_reviewed, in the same order: one entry there for every
    entry here, no path in one and not the other, and the reasons stay
    in not_reviewed.
  - Verdict, computed from LENS RESULTS AND COVERAGE ONLY: "fail" if
    any project's status is "failing". "pass" only when at least one
    project was discovered, every discovered project was reviewed by a
    lens that ran, plan_completed is true, not_reviewed is empty, and
    every project's status is "healthy". An empty discovery is never a
    "pass". Everything else, including any "unknown" project, any
    "findings" project, any failed, refused or expired child, any
    truncated coverage and a repository that held no projects, is
    "pass_with_findings".
  - PLATFORM OWNED FIELDS. "filed", "filed_issue" and
    rollup.issues_filed describe what the platform did after you exited.
    You always write false, null and 0; the platform rewrites them from
    the issues it actually filed, and adds its own receipt.
    "child_execution_id" is the child that produced the finding, when
    there was one.
  - THE REGISTER CANNOT UPGRADE THE VERDICT. Healthy rows, approved
    follow ups, a high healthy-to-failing ratio and positive prose never
    raise it. A project nobody reviewed is not evidence of health, an
    inventory-only run is never a "pass", and the number of projects
    discovered says nothing about the state of the portfolio.
  - The triage hint, the rank and the selection rows are computed from
    the PHASE 1 facts only. A hint you cannot derive from those facts is
    a bug, and an opinion about a project's code has no place in them.
  - Deterministic facts go to "checks" and the register; interpretation
    goes to "assessments" and is marked as judgment.
  - SIZE BUDGET. Keep result.json under 200 KB. Keep every project row
    under 4 KB, lens rows and child records included, and every
    discovery row under 2 KB: summaries and counts inline, full lens
    results and per-claim detail in evidence/. A 25
    PROJECT PORTFOLIO MUST STILL FIT, which those per-row budgets
    guarantee; if a row would exceed its budget, truncate it, note the
    truncation, and point at the evidence file. Set unknown envelope
    fields to null rather than inventing values.
agent_type: codex
agent_config:
  sandbox_type: exec
  enable_auto_lint: false
allowed_mcp_servers: []
# Three platform tools, none of them a write tool. ask_user is the question
# channel for the two batched portfolio questions (which projects to
# review, how deep and for how much, which follow ups to keep, and whether
# to open the portfolio README pull request): it routes a question through
# the approval workflow, which captures the deciding identity. run_flow
# starts one of the read-only lenses named on callable_flows below, one
# child per project per lens, and parks this run while they work.
# get_execution both reads back a child this run started when its
# completion record carried no result artifact, and is the read-only meter
# the run ceiling is measured with. The agent still files nothing, opens
# nothing and pushes nothing; the walk and git run in the sandbox against
# the checkout. Report publication is a platform step after the agent exits.
allowed_mcp_tools:
  - name: ask_user
  - name: run_flow
  - name: get_execution
# The delegation allowlist, and the whole vocabulary of PHASE 4: a lens
# that is not here cannot be started, and the platform refuses the call
# with flow_not_callable rather than skipping it quietly. max_children
# bounds one fan out per lens below the instance ceiling of 25 direct
# children; max_usd_per_child clamps what a child may ask for, so a single
# portfolio run cannot commit the tree ceiling on one project. Each entry
# names a preset slug, which resolves to the account's own flow of that
# preset (an account that has not enabled a lens simply cannot run it).
callable_flows:
  - flow: docs-currency-review
    max_children: 12
    max_usd_per_child: 2.0
  - flow: repo-code-health-review
    max_children: 12
    max_usd_per_child: 3.0
  - flow: release-security-audit
    max_children: 12
    max_usd_per_child: 3.0
# Clone one repository read only, then publish the report through the
# platform's own pull request path after the agent has exited (issue #648).
# The agent keeps no write tools: publication is a post-execution step of the
# flow, outside the agent's tool surface. Add the target repository (or
# trigger the flow from a project) to use it; leave
# report_publication.enabled false to keep the report purely as an artifact.
git_clone_config:
  enabled: true
  repositories: []
  git_user_name: Preloop
  git_user_email: hello@preloop.ai
  source_branch: null
  target_branch: null
  # Required by report publication: the document lands as a pull request a
  # human reviews and merges, never as a direct commit on the default branch.
  create_pull_request: true
  pull_request_title: Portfolio review report
  pull_request_description: |
    Refreshes the portfolio review report produced by the Portfolio Review
    flow. One file, generated by the flow, reviewed by you.

    The report is regenerated on every run and pushed to the same branch, so
    this pull request updates in place instead of a second one appearing.
  report_publication:
    enabled: true
    # Written in PHASE 7; the file on disk is what gets published.
    source_path: evidence/portfolio-report.md
    # One file at the repository root. The branch defaults to
    # preloop/report/portfolio, derived from this path and stable across runs.
    destination_path: PORTFOLIO.md
    commit_message: Update the portfolio review report
  # Issue #687: the third output of the run. The rows a human approved at the
  # PHASE 6 gate become tracker issues, one per row, filed by the platform
  # after the agent has exited and keyed on the stable follow up id, so a
  # re-run of the same portfolio does not file the same follow up twice. The
  # agent still has no write tool. The issues land in the project of the
  # repository this flow clones unless project_id names another one; a flow
  # with no project configured files nothing and records why.
  follow_up_filing:
    enabled: true
    project_id: null
    labels:
      - preloop
      - portfolio-review
      - follow-up
    max_issues: 25
trigger_config: null
# Discovery, the fan out and the aggregation. The children carry their own
# windows and the timeout budget pauses while this run is parked on them,
# so this is the orchestrator's own working time, not the portfolio's.
timeout_seconds: 7200
# Both questions ask a human where a review budget goes and which follow
# ups survive. That is a funding decision, not a chat prompt: three days is
# the window, and the execution is parked (no container, no runner, no
# budget spent) until the decision or the expiry resumes it.
approval_window_seconds: 259200
is_preset: true
