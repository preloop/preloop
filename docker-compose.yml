services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: preloop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:alpine
    restart: unless-stopped
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # Monitoring port
    command: [ "-js", "-m", "8222" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:8222/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/preloop/preloop:latest
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres/preloop
      SECRET_KEY: development_secret_key_do_not_use_in_production
      LOG_LEVEL: DEBUG
    volumes:
      - .:/app
    command: python scripts/init_db.py --force

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/preloop/preloop:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres/preloop
      NATS_URL: nats://nats:4222
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: 'true'
      SECRET_KEY: development_secret_key_do_not_use_in_production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LOG_LEVEL: DEBUG
      INIT_TEST_DATA: 'true'
      PRELOOP_SERVICE_ROLE: api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: python -m preloop.server --debug --init-test-data

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/preloop/preloop:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres/preloop
      NATS_URL: nats://nats:4222
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: 'true'
      SECRET_KEY: development_secret_key_do_not_use_in_production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LOG_LEVEL: DEBUG
      INIT_TEST_DATA: 'true'
      PRELOOP_SERVICE_ROLE: gateway
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    command: python -m preloop.server --debug --init-test-data

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/preloop/preloop:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres/preloop
      NATS_URL: nats://nats:4222
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: 'true'
      SECRET_KEY: development_secret_key_do_not_use_in_production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LOG_LEVEL: DEBUG
      INIT_TEST_DATA: 'true'
    volumes:
      - .:/app
    command: preloop-sync scheduler

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/preloop/preloop:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres/preloop
      NATS_URL: nats://nats:4222
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: 'true'
      SECRET_KEY: development_secret_key_do_not_use_in_production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LOG_LEVEL: DEBUG
      INIT_TEST_DATA: 'true'
    volumes:
      - .:/app
    command: preloop-sync worker

volumes:
  postgres-data:
