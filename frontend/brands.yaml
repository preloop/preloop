# Preloop - Open Source Edition
# Minimal brand configuration for self-hosted deployments.
#
# edition: Controls UI behavior, not feature set
#   - "saas": Full marketing landing page, pricing page, signup CTAs
#   - "selfhosted": Minimal UI, redirects to login, no pricing page
#
# For enterprise self-hosted deployments, use the enterprise Docker image
# but keep edition: "selfhosted" for the minimal UI experience.
#
# For SaaS deployment configuration, see preloop-ee/frontend/brands.yaml

brands:
  preloop:
    name: "Preloop"
    domain: "localhost"
    edition: "selfhosted"

    branding:
      logo_light: "/images/logos/preloop_logo_light.svg"
      logo_dark: "/images/logos/preloop_logo_dark.svg"
      favicon: "/assets/preloop-badge.png"
      primary_color: "#7c3aed"
      gradient_product: "linear-gradient(90deg, hsl(270, 70%, 55%), hsl(290, 75%, 50%))"
      gradient_ai: "linear-gradient(90deg, hsl(200, 80%, 55%), hsl(180, 85%, 50%))"

    landing:
      meta:
        title: "Preloop — The Open-Source AI Agent Control Plane"
        og_title: "Preloop: the open-source control plane for OpenClaw, Hermes, Claude Code, Codex CLI, Cursor, and any MCP agent"
        description: "Preloop is the open-source AI agent control plane. One command onboards OpenClaw, Hermes, Claude Code, Codex CLI, Cursor, Gemini CLI, and any MCP-compatible agent, then routes their tool calls through the Preloop MCP Firewall and their model traffic through the Preloop Gateway — with human approvals, budgets, runtime observability, and audit trails across your whole fleet."
        og_description: "Onboard existing agents with `preloop agents discover`. Govern tool access with the MCP Firewall, route model traffic with budgets and attribution, approve sensitive actions from mobile or Slack, and keep searchable runtime evidence. Open source. Self-hostable."
        extended_description: "Preloop is the open-source AI agent control plane. It combines an MCP firewall for tool access, an AI model gateway for cost and attribution, policy-as-code with CEL, human-in-the-loop approvals (mobile, watch, Slack, Mattermost), runtime session observability, and audit trails — in a single self-hostable platform. The `preloop agents discover` command imports compatible local agent configs and transparently rewrites Claude Code, Codex CLI, Cursor, Gemini CLI, Hermes, OpenClaw, and OpenCode to route through Preloop without SDK changes."
        keywords: "AI agent control plane, open source AI agent control plane, MCP firewall, MCP gateway, AI agent governance, AI agent security, AI model gateway, LLM gateway self-hosted, AI agent observability, AI agent guardrails, human in the loop AI, AI agent approval workflow, Claude Code governance, Codex CLI governance, Cursor agent security, Gemini CLI governance, Hermes Agent governance, OpenClaw governance, OpenCode governance, AI agent audit trail, Preloop, MCP, Model Context Protocol"

      hero:
        title: "The Open Source Control Plane for <span class=\"gradient-product\">AI Agents</span>"
        lead: "See them, govern them, cut their cost."
        cta_primary: "Sign In"
        cta_primary_url: "/login"
        image: "/assets/screenshots/quickstart/dark/agent_bubble.png"
        image_alt: "Preloop agents canvas with an active speech bubble showing runtime activity"
        og_image: "/assets/mcp-firewall.svg"

      get_started:
        title: "Onboard or connect your AI agent in minutes"
        link_text: "Read the docs"
        link_url: "https://docs.preloop.ai"

        mcp_setup_title: "Start with a simple CLI setup, or connect Preloop manually"
        cli_setup:
          - step: "1. Install and Set Up"
            command: "curl -fsSL https://preloop.ai/install/cli | sh"
