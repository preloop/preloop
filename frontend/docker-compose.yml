# Production setup with nginx
version: '3.8'

services:
  # Frontend (Production)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - API_URL=http://backend:8000
      - MOCK_API=false
      - HSTS_ENABLED=${HSTS_ENABLED:-true}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-31536000}
      - HSTS_INCLUDE_SUBDOMAINS=${HSTS_INCLUDE_SUBDOMAINS:-false}
      - HSTS_PRELOAD=${HSTS_PRELOAD:-false}
      - CSP_MODE=${CSP_MODE:-report-only}
      - CSP_EXTRA_SCRIPT_SRC=${CSP_EXTRA_SCRIPT_SRC:-}
      - CSP_EXTRA_CONNECT_SRC=${CSP_EXTRA_CONNECT_SRC:-}
    depends_on:
      - backend
    networks:
      - console-network

  # Real API Backend (placeholder - replace with actual backend)
  backend:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/mock-api.conf:/etc/nginx/conf.d/default.conf
    networks:
      - console-network

  # Mock API Server (for testing without real backend)
  mock-api:
    image: nginx:alpine
    ports:
      - "8001:80"
    volumes:
      - ./docker/mock-api:/usr/share/nginx/html
      - ./docker/mock-api.conf:/etc/nginx/conf.d/default.conf
    networks:
      - console-network

networks:
  console-network:
    driver: bridge
