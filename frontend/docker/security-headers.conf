# Security headers for every console response (#2278, #2279).
#
# nginx drops server-level add_header directives in any block that declares
# its own add_header, so this file is included at server level AND as the
# first line of every location/if block that sets headers. Keep it identical
# to the "preloop.nginxSecurityHeaders" template in helm/preloop/templates/
# _helpers.tpl (backend/tests/test_nginx_security_headers.py checks parity).
#
# $preloop_hsts comes from the map at the top of nginx.conf.template. It is
# empty for plain-HTTP requests and when HSTS_ENABLED=false, and nginx omits
# a header whose value is empty.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
add_header Strict-Transport-Security $preloop_hsts always;
