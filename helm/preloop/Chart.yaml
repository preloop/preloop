apiVersion: v2
name: preloop
description: The open-source AI agent control plane - MCP firewall, model gateway with budgets, human approvals, runtime observability, and audit trails

# A chart can be either an 'application' or a 'library' chart.
type: application

# Chart version
version: 0.13.1

# Application version
appVersion: "0.13.1"

# Keywords for the chart
keywords:
  - preloop
  - ai-agent-control-plane
  - mcp
  - mcp-firewall
  - mcp-gateway
  - ai-gateway
  - llm-gateway
  - ai-agent-governance
  - human-in-the-loop
  - guardrails
  - policy-as-code
  - observability
  - audit-trail
  - self-hosted

# Home URL for the project
home: https://preloop.ai

# Source repositories (surfaced by Artifact Hub and `helm show chart`)
sources:
  - https://github.com/preloop/preloop

# Chart maintainers
maintainers:
  - name: Spacecode AI Inc. Team
    email: hello@preloop.ai

# Icon for the chart (optional)
icon: https://preloop.ai/assets/favicon.png

# Dependencies
# CloudNativePG operator should be installed in the cluster
# https://cloudnative-pg.io/documentation/1.22/

dependencies:
  - name: nats
    repository: "https://nats-io.github.io/k8s/helm/charts"
    version: "1.3.9"
    alias: nats
    condition: nats.enabled
