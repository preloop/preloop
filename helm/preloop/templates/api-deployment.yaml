apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preloop.fullname" . }}-api
  labels:
    {{- include "preloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    app: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount | default .Values.replicaCount }}
  {{- end }}
  # Zero-downtime rollouts: never take a serving pod down before its
  # replacement is Ready (surge first, drain after).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "preloop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "preloop.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # Long-lived MCP sessions/long-polls and websockets must be allowed to
      # drain before kubelet SIGKILLs the pod; the k8s default of 30s cuts
      # them off ~20s after preStop. See api.terminationGracePeriodSeconds
      # in values.yaml.
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "preloop.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PRELOOP_URL
              value: {{ .Values.environment.preloopUrl | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: DEBUG
              value: {{ .Values.environment.debug | quote }}
            - name: MODEL_GATEWAY_CAPTURE_CONTENT
              value: {{ .Values.environment.modelGatewayCaptureContent | quote }}
            {{- include "preloop.databaseUrlEnv" . | nindent 12 }}
            - name: DATABASE_POOL_SIZE
              value: {{ .Values.database.pool.api.size | quote }}
            - name: DATABASE_MAX_OVERFLOW
              value: {{ .Values.database.pool.api.maxOverflow | quote }}
            - name: MALLOC_ARENA_MAX
              value: {{ .Values.environment.mallocArenaMax | quote }}
            - name: PRELOOP_API_SERVICE_HTTP_ENDPOINT
              value: "http://{{ include "preloop.fullname" . }}-api:80"
            - name: AGENT_EXECUTION_NAMESPACE
              value: {{ .Values.agentExecution.namespace.create | ternary .Values.agentExecution.namespace.name .Release.Namespace | quote }}
            - name: USE_KUBERNETES
              value: "true"
            {{- if .Values.environment.skipExecutionRecovery }}
            - name: SKIP_EXECUTION_RECOVERY
              value: "true"
            {{- end }}
            {{- if .Values.environment.hosted }}
            - name: PRELOOP_HOSTED
              value: "1"
            {{- end }}
            {{- if .Values.environment.releasesRepo }}
            - name: PRELOOP_RELEASES_REPO
              value: {{ .Values.environment.releasesRepo | quote }}
            {{- end }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: jwt-secret
            {{- if .Values.security.encryptionKey }}
            - name: SECURITY__ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: encryption-key
            {{- end }}
            - name: JWT_ALGORITHM
              value: {{ .Values.environment.jwtAlgorithm | quote }}
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: {{ .Values.environment.jwtExpireMinutes | quote }}
            {{- if hasKey .Values.environment "refreshTokenExpireDays" }}
            - name: REFRESH_TOKEN_EXPIRE_DAYS
              value: {{ .Values.environment.refreshTokenExpireDays | quote }}
            {{- end }}
            {{- if hasKey .Values.environment "maxSessionDays" }}
            - name: MAX_SESSION_DAYS
              value: {{ .Values.environment.maxSessionDays | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_FORMAT
              value: "json"
            {{- if .Values.config.openai.apiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: openai-api-key
            {{- end }}
            {{- if .Values.config.anthropic.apiKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: anthropic-api-key
            {{- end }}
            {{- if .Values.config.smtp.host }}
            - name: SMTP_HOST
              value: {{ .Values.config.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.config.smtp.port | quote }}
            - name: SMTP_USERNAME
              value: {{ .Values.config.smtp.username | quote }}
            - name: SMTP_PASSWORD
              value: {{ .Values.config.smtp.password | quote }}
            - name: SMTP_FROM
              value: {{ .Values.config.smtp.from | quote }}
            - name: SMTP_FROM_NAME
              value: {{ .Values.config.smtp.fromName | quote }}
            {{- end }}
            - name: NATS_URL
              value: {{ $.Values.nats.url | default (printf "nats://%s-nats:4222" $.Release.Name) }}
            - name: FLOW_EXECUTION_WORKER_ENABLED
              value: {{ .Values.flowExecution.workerEnabled | default false | quote }}
            - name: FLOW_EXECUTION_CLAIM_STALE_SECONDS
              value: {{ .Values.flowExecution.claimStaleSeconds | default 120 | quote }}
            - name: FLOW_COMPLETION_NUDGE_ENABLED
              value: {{ .Values.flowExecution.completionNudge.enabled | default true | quote }}
            - name: FLOW_COMPLETION_NUDGE_TIMEOUT_SECONDS
              value: {{ .Values.flowExecution.completionNudge.timeoutSeconds | default 300 | quote }}
            - name: AGENT_JOB_CREATE_MAX_ATTEMPTS
              value: {{ .Values.flowExecution.agentJobCreate.maxAttempts | default 3 | quote }}
            - name: AGENT_JOB_CREATE_RETRY_BASE_SECONDS
              value: {{ .Values.flowExecution.agentJobCreate.retryBaseSeconds | default 0.5 | quote }}
            {{- if $.Values.sentry.enabled }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" $ }}
                  key: sentry-dsn
            {{- end }}
            - name: PROFILING_ENABLED
              value: {{ .Values.profiling.enabled | quote }}
            {{- if .Values.geoip.enabled }}
            - name: PRELOOP_GEOIP_DB_PATH
              value: {{ .Values.geoip.dbPath | quote }}
            - name: PRELOOP_GEOIP_AUTO_DOWNLOAD
              value: {{ .Values.geoip.autoDownload | quote }}
            {{- else }}
            - name: PRELOOP_GEOIP_AUTO_DOWNLOAD
              value: "false"
            {{- end }}
            {{- if .Values.installerAudit.accountId }}
            - name: INSTALLER_AUDIT_ACCOUNT_ID
              value: {{ .Values.installerAudit.accountId | quote }}
            {{- end }}
            - name: STRIPE_SECRET_KEY
              value: {{ .Values.stripe.secretKey | quote }}
            - name: STRIPE_WEBHOOK_SECRET
              value: {{ .Values.stripe.webhookSecret | quote }}
            {{- if .Values.apns.enabled }}
            - name: APNS_TEAM_ID
              value: {{ .Values.apns.teamId | quote }}
            - name: APNS_KEY_ID
              value: {{ .Values.apns.keyId | quote }}
            - name: APNS_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: apns-auth-key
            - name: APNS_BUNDLE_ID
              value: {{ .Values.apns.bundleId | quote }}
            - name: APNS_USE_SANDBOX
              value: {{ .Values.apns.useSandbox | quote }}
            {{- end }}
            {{- if .Values.notifications.productTeamEmail }}
            - name: PRODUCT_TEAM_EMAIL
              value: {{ .Values.notifications.productTeamEmail | quote }}
            {{- end }}
            {{- if .Values.notifications.slackWebhookUrl }}
            - name: SLACK_WEBHOOK_URL
              value: {{ .Values.notifications.slackWebhookUrl | quote }}
            {{- end }}
            {{- if .Values.notifications.mattermostWebhookUrl }}
            - name: MATTERMOST_WEBHOOK_URL
              value: {{ .Values.notifications.mattermostWebhookUrl | quote }}
            {{- end }}
            {{- if .Values.computeBackend.provider }}
            - name: COMPUTE_PROVIDER
              value: {{ .Values.computeBackend.provider | quote }}
            {{- end }}
            {{- if .Values.computeBackend.kubevirt.kubeconfigPath }}
            - name: KUBEVIRT_KUBECONFIG_PATH
              value: {{ .Values.computeBackend.kubevirt.kubeconfigPath | quote }}
            {{- end }}
            {{- if .Values.computeBackend.kubevirt.namespace }}
            - name: KUBEVIRT_NAMESPACE
              value: {{ .Values.computeBackend.kubevirt.namespace | quote }}
            {{- end }}
            {{- if .Values.computeBackend.kubevirt.vmImage }}
            - name: KUBEVIRT_VM_IMAGE
              value: {{ .Values.computeBackend.kubevirt.vmImage | quote }}
            {{- end }}
            {{- if .Values.computeBackend.aws.accessKeyId }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.computeBackend.aws.accessKeyId | quote }}
            {{- end }}
            {{- if .Values.computeBackend.aws.secretAccessKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: aws-secret-access-key
            {{- end }}
            {{- if .Values.computeBackend.aws.defaultRegion }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.computeBackend.aws.defaultRegion | quote }}
            {{- end }}
            {{- if .Values.computeBackend.aws.amiId }}
            - name: AWS_AMI_ID
              value: {{ .Values.computeBackend.aws.amiId | quote }}
            {{- end }}
            {{- if .Values.computeBackend.aws.instanceType }}
            - name: AWS_INSTANCE_TYPE
              value: {{ .Values.computeBackend.aws.instanceType | quote }}
            {{- end }}
            {{- if .Values.computeBackend.gcp.projectId }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.computeBackend.gcp.projectId | quote }}
            {{- end }}
            {{- if .Values.computeBackend.gcp.credentialsJsonPath }}
            - name: GCP_CREDENTIALS_JSON_PATH
              value: {{ .Values.computeBackend.gcp.credentialsJsonPath | quote }}
            {{- end }}
            {{- if .Values.computeBackend.gcp.zone }}
            - name: GCP_ZONE
              value: {{ .Values.computeBackend.gcp.zone | quote }}
            {{- end }}
            {{- if .Values.computeBackend.gcp.machineType }}
            - name: GCP_MACHINE_TYPE
              value: {{ .Values.computeBackend.gcp.machineType | quote }}
            {{- end }}
            {{- if .Values.fcm.enabled }}
            - name: FCM_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: fcm-credentials-json
            {{- end }}
            {{- if .Values.githubApp.enabled }}
            - name: GITHUB_APP_ID
              value: {{ .Values.githubApp.appId | quote }}
            - name: GITHUB_APP_CLIENT_ID
              value: {{ .Values.githubApp.clientId | quote }}
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: github-app-client-secret
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: github-app-private-key
            - name: GITHUB_APP_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: github-app-webhook-secret
            - name: GITHUB_APP_SLUG
              value: {{ .Values.githubApp.slug | quote }}
            {{- end }}
            {{- if .Values.googleOauth.enabled }}
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: {{ .Values.googleOauth.clientId | quote }}
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: google-oauth-client-secret
            {{- end }}
            {{- if .Values.gitlabOauth.enabled }}
            - name: GITLAB_OAUTH_CLIENT_ID
              value: {{ .Values.gitlabOauth.clientId | quote }}
            - name: GITLAB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: gitlab-oauth-client-secret
            - name: GITLAB_OAUTH_BASE_URL
              value: {{ .Values.gitlabOauth.baseUrl | quote }}
            {{- end }}
            {{- include "preloop.extraEnv" . | nindent 12 }}
            {{- with include "preloop.otlpEnv" . }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            {{- if .Values.profiling.enabled }}
            - name: profiling-storage
              mountPath: /tmp/profiling
            {{- end }}
            {{- if .Values.geoip.enabled }}
            - name: geoip-storage
              mountPath: {{ dir .Values.geoip.dbPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # Delay SIGTERM so ingress/kube-proxy endpoint updates propagate
          # before the server stops accepting; avoids 502s during rollouts.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          livenessProbe:
            httpGet:
              path: /api/v1/ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
      volumes:
      {{- if .Values.profiling.enabled }}
        - name: profiling-storage
          persistentVolumeClaim:
            claimName: {{ include "preloop.fullname" . }}-profiling
      {{- end }}
      {{- if .Values.geoip.enabled }}
        - name: geoip-storage
          {{- if .Values.geoip.storage.pvc.create }}
          persistentVolumeClaim:
            claimName: {{ include "preloop.fullname" . }}-geoip
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
