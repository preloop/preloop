apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "preloop.fullname" . }}-nginx
  labels:
    {{- include "preloop.labels" . | nindent 4 }}
data:
  default.conf.template: |
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Root directory for static files
        root /usr/share/nginx/html;
        index index.html;
{{- if .Values.analytics.enabled }}

        # Web analytics: inject the tracking snippet into every HTML response
        # at serve time. Runtime-configurable per environment via values —
        # see the `analytics` block in values.yaml. The inline stub queues
        # custom events (window.plausible) fired before the script loads.
        {{- if .Values.analytics.customSnippet }}
        sub_filter '</head>' '{{ .Values.analytics.customSnippet }}</head>';
        {{- else }}
        sub_filter '</head>' '<script>window.plausible=window.plausible||function(){(window.plausible.q=window.plausible.q||[]).push(arguments)}</script><script defer data-domain="{{ .Values.analytics.domain }}" src="{{ .Values.analytics.scriptUrl }}"></script></head>';
        {{- end }}
        sub_filter_once on;
        sub_filter_types text/html;
{{- end }}

        # Blocking native-tool approval checks wait for a human decision.
        # Exact match must precede the generic /api/ block so the long timeout
        # applies only to this endpoint (default CLI wait is 1800s + headroom).
        location = /api/v1/agents/permission-check {
            set $api_backend "http://{{ include "preloop.fullname" . }}-api:80";

            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 1860s;
            proxy_read_timeout 1860s;
        }

        # API proxy configuration
        location /api/ {
            # Proxy to Preloop backend service
            set $api_backend "http://{{ include "preloop.fullname" . }}-api:80";

            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 10s;
            # LLM-powered analysis (cost optimization suggestions) and replay
            # verification legitimately run ~90s on slower models; 60s here 504s
            # the browser while the backend finishes. Durable fix is async jobs
            # + polling.
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # CORS headers for API requests
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Approval page proxy configuration (public approval without authentication)
        # Use prefix match with ^~ to stop searching and prevent SPA catch-all
        location ^~ /approval/ {
            # Proxy to Preloop backend service
            proxy_pass http://{{ include "preloop.fullname" . }}-api:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public installer endpoints
        location ^~ /install/ {
            proxy_pass http://{{ include "preloop.fullname" . }}-api:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Invitation accept page proxy configuration (public invitation accept)
        # Use prefix match with ^~ to stop searching and prevent SPA catch-all
        location ^~ /invitations/accept {
            # Proxy to Preloop backend service
            proxy_pass http://{{ include "preloop.fullname" . }}-api:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OAuth server endpoints (authorize, token, register, revoke)
        # Must be proxied to backend before the SPA catch-all
        location ^~ /oauth/ {
            proxy_pass http://{{ include "preloop.fullname" . }}-api:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OAuth / MCP well-known discovery endpoints
        location ^~ /.well-known/ {
            proxy_pass http://{{ include "preloop.fullname" . }}-api:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MCP server proxy configuration
        # Use prefix match with ^~ to stop searching and prevent SPA catch-all
        # /mcp → /mcp/v1 rewrite is handled by the backend's ASGI middleware
        location ^~ /mcp {
            # Proxy to Preloop backend service
            proxy_pass http://{{ include "preloop.fullname" . }}-api:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Model gateway endpoints (OpenAI-, Anthropic- and Gemini-compatible).
        #
        # These three carry streaming LLM traffic and are the route class that
        # most needs a long timeout, yet they were the only proxied routes
        # without one — so they silently inherited nginx's 60s default. On a
        # streaming completion the clock to the first byte is the model's
        # thinking time: a short prompt answers in seconds, while a large one
        # (a full diff, a repository's worth of context) can reason for minutes
        # before emitting a single token. At 60s that connection is killed and
        # the caller sees a 504 from the proxy — a failure the gateway never
        # observes and cannot report, and one that looks intermittent because
        # it depends entirely on prompt size.
        #
        # proxy_buffering must stay off: with buffering on nginx accumulates
        # the token stream rather than relaying it, which both defeats the
        # point of SSE for the client and pushes the observed first byte later,
        # making any ceiling easier to hit.
        location ^~ /openai/ {
            proxy_pass http://{{ include "preloop.fullname" . }}-gateway:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout {{ .Values.gateway.proxy.connectTimeout }}s;
            proxy_send_timeout {{ .Values.gateway.proxy.sendTimeout }}s;
            proxy_read_timeout {{ .Values.gateway.proxy.readTimeout }}s;
            proxy_buffering off;
            proxy_cache off;
            client_max_body_size {{ .Values.gateway.proxy.bodySize }};
        }

        location ^~ /anthropic/ {
            proxy_pass http://{{ include "preloop.fullname" . }}-gateway:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout {{ .Values.gateway.proxy.connectTimeout }}s;
            proxy_send_timeout {{ .Values.gateway.proxy.sendTimeout }}s;
            proxy_read_timeout {{ .Values.gateway.proxy.readTimeout }}s;
            proxy_buffering off;
            proxy_cache off;
            client_max_body_size {{ .Values.gateway.proxy.bodySize }};
        }

        location ^~ /gemini/ {
            proxy_pass http://{{ include "preloop.fullname" . }}-gateway:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout {{ .Values.gateway.proxy.connectTimeout }}s;
            proxy_send_timeout {{ .Values.gateway.proxy.sendTimeout }}s;
            proxy_read_timeout {{ .Values.gateway.proxy.readTimeout }}s;
            proxy_buffering off;
            proxy_cache off;
            client_max_body_size {{ .Values.gateway.proxy.bodySize }};
        }

        # Static files with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Competitor comparison pages (/vs/<slug>): serve the build-time
        # prerendered HTML so crawlers and direct loads get the real page
        # (correct <title>, canonical, data-ssr-route) instead of the home
        # index.html. Falls back to the SPA for unregistered slugs. Without
        # this, /vs/<slug> hit the SPA catch-all and rendered the landing
        # page nested inside static-view.
        location ~ ^/vs/([a-z0-9][a-z0-9-]*)/?$ {
            try_files /vs/$1.html /index.html;
        }

        # Long-form resource pages (/resources/<slug>): same prerender-first serving.
        location ~ ^/resources/([a-z0-9][a-z0-9-]*)/?$ {
            try_files /resources/$1.html /index.html;
        }

        # Blog index (/blog): prerender-first, same as /vs and /resources.
        # Exact match, because the generic catch-all below would otherwise
        # `try_files $uri $uri/` -> see the /blog DIRECTORY -> emit a 301 to
        # /blog/ instead of serving blog/index.html. Only SaaS builds emit
        # blog/index.html; self-hosted builds fall through to the SPA, whose
        # /blog route redirects home.
        location = /blog {
            try_files /blog/index.html /index.html;
        }

        # RSS feed. Exact match so it wins over the /blog/<slug> regex below,
        # which would otherwise not match "feed.xml" anyway (the dot) but would
        # leave the feed to the catch-all with the wrong content type.
        location = /blog/feed.xml {
            # `types { }` empties the MIME map for this location. Without it
            # mime.types already maps .xml -> text/xml, that match wins, and
            # default_type (which only applies when nothing matched) is dead
            # code. Verified in nginx:alpine: without the empty types block
            # the feed is served as text/xml.
            types { }
            default_type application/rss+xml;
            try_files /blog/feed.xml =404;
        }

        # Blog posts (/blog/<slug>): prerender-first, SPA fallback.
        location ~ ^/blog/([a-z0-9][a-z0-9-]*)/?$ {
            try_files /blog/$1.html /index.html;
        }

        # Top-level marketing pages: same prerender-first serving as /vs and
        # /resources above. Without these they fell through to the SPA
        # catch-all, so every one of them returned byte-identical home
        # index.html — including its canonical pointing at "/", which told
        # crawlers these pages *are* the homepage. Browsers were fine (the
        # router renders client-side); crawlers and answer engines, which
        # mostly do not execute JS, saw only the landing page.
        #
        # The equivalent rules already existed in the OSS docker nginx
        # template; this config had drifted from it.
        #
        # Falls back to /index.html rather than 404 because these pages are
        # brand-conditional: a self-hosted build does not prerender them, and
        # the SPA can still route them.
        location ~ ^/(about|pricing|privacy|terms|whatis-mcp|ai-act-readiness)/?$ {
            try_files /$1.html /index.html;
        }

        # SPA routing - serve index.html for all non-API routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Disable caching for index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Health check endpoint. `default_type` (not `add_header Content-Type`,
        # which is dead code after `return`) sets the response MIME type.
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
