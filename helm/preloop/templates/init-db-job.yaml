apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "preloop.fullname" . }}-init-db-job
  labels:
    {{- include "preloop.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "preloop.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: init-db-runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              cd /app && \
              python scripts/init_db.py --force
          env:
            {{- include "preloop.databaseUrlEnv" . | nindent 12 }}
            - name: OPENAI_API_KEY
              value: {{ .Values.config.openai.apiKey }}
            - name: PRELOOP_URL
              value: {{ .Values.environment.preloopUrl | quote }}
            {{- include "preloop.extraEnv" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
