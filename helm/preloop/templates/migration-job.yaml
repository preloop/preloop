apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "preloop.fullname" . }}-migration-job
  labels:
    {{- include "preloop.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # The container retries lock contention itself; this only covers a pod that
  # dies outright.
  backoffLimit: {{ .Values.migrationJob.backoffLimit | default 2 }}
  template:
    metadata:
      labels:
        {{- include "preloop.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migration-runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          command: ["/bin/sh", "-c"]
          # Not bare `alembic upgrade head`: this wrapper commits one
          # transaction per revision, holds a short lock_timeout, and retries
          # a revision that lost a lock race against the pods still serving.
          args: ["cd /app/backend/preloop/models && python -m preloop.models.migrate"]
          env:
            - name: PRELOOP_MIGRATION_LOCK_TIMEOUT
              value: {{ .Values.migrationJob.lockTimeout | quote }}
            - name: PRELOOP_MIGRATION_CONCURRENT_LOCK_TIMEOUT_SECONDS
              value: {{ .Values.migrationJob.concurrentLockTimeoutSeconds | default 60 | quote }}
            - name: PRELOOP_MIGRATION_CONCURRENT_STATEMENT_TIMEOUT_SECONDS
              value: {{ .Values.migrationJob.concurrentStatementTimeoutSeconds | default 120 | quote }}
            - name: PRELOOP_MIGRATION_MAX_ATTEMPTS
              value: {{ .Values.migrationJob.maxAttempts | quote }}
            - name: PRELOOP_MIGRATION_RETRY_MIN_SECONDS
              value: {{ .Values.migrationJob.retryMinSeconds | quote }}
            - name: PRELOOP_MIGRATION_RETRY_MAX_SECONDS
              value: {{ .Values.migrationJob.retryMaxSeconds | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: jwt-secret
            {{- if .Values.security.encryptionKey }}
            - name: SECURITY__ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" . }}
                  key: encryption-key
            {{- end }}
            {{- include "preloop.databaseUrlEnv" . | nindent 12 }}
            {{- include "preloop.extraEnv" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
