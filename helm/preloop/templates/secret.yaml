{{- if not .Values.existingSecret }}
{{- /*
Fail closed on a missing or published-placeholder JWT signing key. Any
install that keeps a placeholder signs access tokens with a key anyone can
read on GitHub, so refusing to render is safer than a NOTES.txt warning.
The backend enforces the same rule at startup (rejects placeholders when
ENVIRONMENT=production, logs a CRITICAL banner otherwise).
*/}}
{{- $jwt := .Values.environment.jwtSecret | default "" }}
{{- $normalized := lower $jwt }}
{{- if or (eq $jwt "")
          (contains "change-this" $normalized)
          (contains "change_this" $normalized)
          (contains "changeme" $normalized)
          (contains "do-not-use-in-production" $normalized)
          (contains "do_not_use_in_production" $normalized) }}
{{- fail "environment.jwtSecret is unset or a published placeholder; the chart refuses to install with it because anyone who can read this repository could forge access tokens. Generate a key with `openssl rand -hex 32` and pass it via --set environment.jwtSecret=<value> (or a values file), or set existingSecret to a Secret that carries a `jwt-secret` key." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "preloop.fullname" . }}
  labels:
    {{- include "preloop.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ .Values.environment.jwtSecret | b64enc | quote }}
  {{- if .Values.security.encryptionKey }}
  encryption-key: {{ .Values.security.encryptionKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.openai.apiKey }}
  openai-api-key: {{ .Values.config.openai.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.anthropic.apiKey }}
  anthropic-api-key: {{ .Values.config.anthropic.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.sentry.enabled }}
  sentry-dsn: {{ .Values.sentry.dsn | b64enc | quote }}
  {{- end }}
  {{- if and .Values.apns.enabled .Values.apns.authKey }}
  apns-auth-key: {{ .Values.apns.authKey | b64enc | quote }}
  {{- end }}
  {{- if and .Values.fcm.enabled .Values.fcm.credentialsJson }}
  fcm-credentials-json: {{ .Values.fcm.credentialsJson | b64enc | quote }}
  {{- end }}
  {{- if .Values.githubApp.enabled }}
  github-app-client-secret: {{ .Values.githubApp.clientSecret | default "" | b64enc | quote }}
  github-app-private-key: {{ .Values.githubApp.privateKey | default "" | b64enc | quote }}
  github-app-webhook-secret: {{ .Values.githubApp.webhookSecret | default "" | b64enc | quote }}
  {{- end }}
  {{- if .Values.googleOauth.enabled }}
  google-oauth-client-secret: {{ .Values.googleOauth.clientSecret | default "" | b64enc | quote }}
  {{- end }}
  {{- if .Values.gitlabOauth.enabled }}
  gitlab-oauth-client-secret: {{ .Values.gitlabOauth.clientSecret | default "" | b64enc | quote }}
  {{- end }}
  {{- if and .Values.otlp.enabled .Values.otlp.headers (not .Values.otlp.headersSecret.name) }}
  otlp-headers: {{ .Values.otlp.headers | b64enc | quote }}
  {{- end }}
  {{- if .Values.computeBackend.aws.secretAccessKey }}
  aws-secret-access-key: {{ .Values.computeBackend.aws.secretAccessKey | b64enc | quote }}
  {{- end }}
{{- end }}
