apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preloop.fullname" . }}-preloop-sync-scheduler
  labels:
    {{- include "preloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: preloop-sync-scheduler
    app: preloop-sync-scheduler
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "preloop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: preloop-sync-scheduler
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "preloop.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: preloop-sync-scheduler
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "preloop.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: preloop-sync-scheduler
          command:
            - preloop-sync
            - scheduler
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PRELOOP_URL
              value: {{ $.Values.environment.preloopUrl | quote }}
            - name: HOST
              value: {{ .Values.environment.host | quote }}
            - name: PORT
              value: {{ .Values.environment.port | quote }}
            - name: DEBUG
              value: {{ .Values.environment.debug | quote }}
            - name: DATABASE_URL
              value: {{ include "preloop.databaseUrl" . }}
            - name: DATABASE_POOL_SIZE
              value: {{ .Values.database.pool.worker.size | quote }}
            - name: DATABASE_MAX_OVERFLOW
              value: {{ .Values.database.pool.worker.maxOverflow | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.fullname" . }}
                  key: jwt-secret
            - name: JWT_ALGORITHM
              value: {{ .Values.environment.jwtAlgorithm | quote }}
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: {{ .Values.environment.jwtExpireMinutes | quote }}
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_FORMAT
              value: "json"
            {{- if .Values.config.openai.apiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.fullname" . }}
                  key: openai-api-key
            {{- end }}
            {{- if .Values.config.anthropic.apiKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.fullname" . }}
                  key: anthropic-api-key
            {{- end }}
            {{- if .Values.config.smtp.host }}
            - name: SMTP_HOST
              value: {{ .Values.config.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.config.smtp.port | quote }}
            - name: SMTP_USERNAME
              value: {{ .Values.config.smtp.username | quote }}
            - name: SMTP_PASSWORD
              value: {{ .Values.config.smtp.password | quote }}
            - name: SMTP_FROM
              value: {{ .Values.config.smtp.from | quote }}
            - name: SMTP_FROM_NAME
              value: {{ .Values.config.smtp.fromName | quote }}
            {{- end }}
            - name: NATS_URL
              value: {{ $.Values.nats.url | default (printf "nats://%s-nats:4222" $.Release.Name) }}
            {{- if $.Values.sentry.enabled }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.fullname" $ }}
                  key: sentry-dsn
            {{- end }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
