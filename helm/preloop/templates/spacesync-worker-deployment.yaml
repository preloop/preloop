{{- range .Values.worker.pools }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preloop.fullname" $ }}-preloop-sync-worker-{{ .name }}
  labels:
    {{- include "preloop.labels" $ | nindent 4 }}
    app.kubernetes.io/component: preloop-sync-worker-{{ .name }}
    app: preloop-sync-worker-{{ .name }}
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      {{- include "preloop.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: preloop-sync-worker-{{ .name }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "preloop.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: preloop-sync-worker-{{ .name }}
        app: preloop-sync-worker-{{ .name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "preloop.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- if and (eq .name "flow-execution") $.Values.flowExecution.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $.Values.flowExecution.terminationGracePeriodSeconds }}
      {{- end }}
      containers:
        - name: preloop-sync-worker-{{ .name }}
          command:
            - preloop-sync
            - worker
            {{- if .tasks }}
            - "--tasks"
            - {{ if kindIs "slice" .tasks }}{{ join "," .tasks | quote }}{{ else }}{{ .tasks | quote }}{{ end }}
            {{- else if .excludeTasks }}
            {{- /* The tasks stream uses WORKQUEUE retention: consumer subject
                   filters must not overlap. A pool with no allowlist must
                   therefore EXCLUDE whatever a dedicated pool filters, instead
                   of subscribing to the preloop.sync.tasks.* wildcard. */}}
            - "--exclude-tasks"
            - {{ if kindIs "slice" .excludeTasks }}{{ join "," .excludeTasks | quote }}{{ else }}{{ .excludeTasks | quote }}{{ end }}
            {{- end }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: PRELOOP_URL
              value: {{ $.Values.environment.preloopUrl | quote }}
            - name: HOST
              value: {{ $.Values.environment.host | quote }}
            - name: PORT
              value: {{ $.Values.environment.port | quote }}
            - name: DEBUG
              value: {{ $.Values.environment.debug | quote }}
            {{- include "preloop.databaseUrlEnv" $ | nindent 12 }}
            - name: DATABASE_POOL_SIZE
              value: {{ $.Values.database.pool.worker.size | quote }}
            - name: DATABASE_MAX_OVERFLOW
              value: {{ $.Values.database.pool.worker.maxOverflow | quote }}
            - name: PRELOOP_API_SERVICE_HTTP_ENDPOINT
              value: "http://{{ include "preloop.fullname" $ }}-api:80"
            - name: AGENT_EXECUTION_NAMESPACE
              value: {{ $.Values.agentExecution.namespace.create | ternary $.Values.agentExecution.namespace.name $.Release.Namespace | quote }}
            - name: USE_KUBERNETES
              value: "true"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" $ }}
                  key: jwt-secret
            {{- if $.Values.security.encryptionKey }}
            - name: SECURITY__ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" $ }}
                  key: encryption-key
            {{- end }}
            - name: JWT_ALGORITHM
              value: {{ $.Values.environment.jwtAlgorithm | quote }}
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: {{ $.Values.environment.jwtExpireMinutes | quote }}
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_FORMAT
              value: "json"
            {{- if $.Values.config.openai.apiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" $ }}
                  key: openai-api-key
            {{- end }}
            {{- if $.Values.config.anthropic.apiKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" $ }}
                  key: anthropic-api-key
            {{- end }}
            {{- if $.Values.config.smtp.host }}
            - name: SMTP_HOST
              value: {{ $.Values.config.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ $.Values.config.smtp.port | quote }}
            - name: SMTP_USERNAME
              value: {{ $.Values.config.smtp.username | quote }}
            - name: SMTP_PASSWORD
              value: {{ $.Values.config.smtp.password | quote }}
            - name: SMTP_FROM
              value: {{ $.Values.config.smtp.from | quote }}
            - name: SMTP_FROM_NAME
              value: {{ $.Values.config.smtp.fromName | quote }}
            {{- end }}
            - name: NATS_URL
              value: {{ $.Values.nats.url | default (printf "nats://%s-nats:4222" $.Release.Name) }}
            - name: MODEL_CATALOG_SYNC_SCHEDULED_ENABLED
              value: {{ $.Values.config.modelCatalogSync.scheduledEnabled | default false | quote }}
            - name: FLOW_EXECUTION_WORKER_ENABLED
              value: {{ $.Values.flowExecution.workerEnabled | default false | quote }}
            - name: FLOW_EXECUTION_CLAIM_STALE_SECONDS
              value: {{ $.Values.flowExecution.claimStaleSeconds | default 120 | quote }}
            - name: FLOW_EXECUTION_RECLAIM_INTERVAL_SECONDS
              value: {{ $.Values.flowExecution.reclaimIntervalSeconds | default 30 | quote }}
            - name: FLOW_EXECUTION_MAX_WAIT_SECONDS
              value: {{ $.Values.flowExecution.maxWaitSeconds | default 3600 | quote }}
            - name: FLOW_COMPLETION_NUDGE_ENABLED
              value: {{ $.Values.flowExecution.completionNudge.enabled | default true | quote }}
            - name: FLOW_COMPLETION_NUDGE_TIMEOUT_SECONDS
              value: {{ $.Values.flowExecution.completionNudge.timeoutSeconds | default 300 | quote }}
            - name: AGENT_JOB_CREATE_MAX_ATTEMPTS
              value: {{ $.Values.flowExecution.agentJobCreate.maxAttempts | default 3 | quote }}
            - name: AGENT_JOB_CREATE_RETRY_BASE_SECONDS
              value: {{ $.Values.flowExecution.agentJobCreate.retryBaseSeconds | default 0.5 | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if $.Values.sentry.enabled }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" $ }}
                  key: sentry-dsn
            {{- end }}
            {{- if $.Values.notifications.productTeamEmail }}
            - name: PRODUCT_TEAM_EMAIL
              value: {{ $.Values.notifications.productTeamEmail | quote }}
            {{- end }}
            {{- if $.Values.notifications.slackWebhookUrl }}
            - name: SLACK_WEBHOOK_URL
              value: {{ $.Values.notifications.slackWebhookUrl | quote }}
            {{- end }}
            {{- if $.Values.notifications.mattermostWebhookUrl }}
            - name: MATTERMOST_WEBHOOK_URL
              value: {{ $.Values.notifications.mattermostWebhookUrl | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.provider }}
            - name: COMPUTE_PROVIDER
              value: {{ $.Values.computeBackend.provider | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.kubevirt.kubeconfigPath }}
            - name: KUBEVIRT_KUBECONFIG_PATH
              value: {{ $.Values.computeBackend.kubevirt.kubeconfigPath | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.kubevirt.namespace }}
            - name: KUBEVIRT_NAMESPACE
              value: {{ $.Values.computeBackend.kubevirt.namespace | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.kubevirt.vmImage }}
            - name: KUBEVIRT_VM_IMAGE
              value: {{ $.Values.computeBackend.kubevirt.vmImage | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.aws.accessKeyId }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ $.Values.computeBackend.aws.accessKeyId | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.aws.secretAccessKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" $ }}
                  key: aws-secret-access-key
            {{- end }}
            {{- if $.Values.computeBackend.aws.defaultRegion }}
            - name: AWS_DEFAULT_REGION
              value: {{ $.Values.computeBackend.aws.defaultRegion | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.aws.amiId }}
            - name: AWS_AMI_ID
              value: {{ $.Values.computeBackend.aws.amiId | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.aws.instanceType }}
            - name: AWS_INSTANCE_TYPE
              value: {{ $.Values.computeBackend.aws.instanceType | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.gcp.projectId }}
            - name: GCP_PROJECT_ID
              value: {{ $.Values.computeBackend.gcp.projectId | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.gcp.credentialsJsonPath }}
            - name: GCP_CREDENTIALS_JSON_PATH
              value: {{ $.Values.computeBackend.gcp.credentialsJsonPath | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.gcp.zone }}
            - name: GCP_ZONE
              value: {{ $.Values.computeBackend.gcp.zone | quote }}
            {{- end }}
            {{- if $.Values.computeBackend.gcp.machineType }}
            - name: GCP_MACHINE_TYPE
              value: {{ $.Values.computeBackend.gcp.machineType | quote }}
            {{- end }}
            {{- if $.Values.githubApp.enabled }}
            - name: GITHUB_APP_ID
              value: {{ $.Values.githubApp.appId | quote }}
            - name: GITHUB_APP_CLIENT_ID
              value: {{ $.Values.githubApp.clientId | quote }}
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" $ }}
                  key: github-app-client-secret
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" $ }}
                  key: github-app-private-key
            - name: GITHUB_APP_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "preloop.secretName" $ }}
                  key: github-app-webhook-secret
            - name: GITHUB_APP_SLUG
              value: {{ $.Values.githubApp.slug | quote }}
            {{- end }}
            {{- include "preloop.extraEnv" $ | nindent 12 }}
          {{- with $.Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $.Values.worker.resources | nindent 12 }}
      {{- with $.Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
