# Optional example native-conversation and workspace checkpoint overlay.
# Size a representative archive before use; 64 MiB will not fit every repository.
# Deploy the transaction-resilience backend and EE companion first.
# Review docs/guide/flows/durable-implementation-feedback.md before enabling.
#
# Helm replaces lists: merge these entries into any existing extraEnv list.
# This file does not set, rotate or change the source of either encryption
# or signing keys. Ingress/console body-size limits are raised together.
extraEnv:
  - name: FLOW_ARTIFACT_DIRECT_UPLOAD
    value: "true"
  # Direct upload is on, so refuse the pod-log plaintext channel. A job
  # that does not receive an upload token fails closed instead of emitting
  # base64. Chart defaults leave FLOW_EVIDENCE_LOG_PLAINTEXT unset (true).
  - name: FLOW_EVIDENCE_LOG_PLAINTEXT
    value: "false"
  # Both workspace and native archive uploads use this compressed-byte cap.
  # 64 MiB stays below the accompanying ingress/console limit of 80 MiB.
  - name: WORKSPACE_SNAPSHOT_MAX_BYTES
    value: "67108864"
  - name: FLOW_NATIVE_SESSION_RETENTION_HOURS
    value: "168"
  - name: WORKSPACE_SNAPSHOT_TTL_HOURS
    value: "168"

# Keep ingress and console proxy limits above the compressed checkpoint cap.
gateway:
  proxy:
    bodySize: "80m"
