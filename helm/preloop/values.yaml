# Default values for the Preloop Helm chart

# Replica count for the deployment
replicaCount: 1

# Image configuration
image:
  repository: ghcr.io/preloop/preloop
  pullPolicy: Always
  tag: "latest"  # Overrides the image tag

worker:
  # -- Defines a list of worker pools to be deployed.
  # Each pool can have its own replica count and a list of allowed tasks.
  pools:
    # -- The default worker pool. It runs every task EXCEPT the ones a
    # dedicated pool filters: the `tasks` JetStream stream uses workqueue
    # retention, where consumer subject filters may not overlap, so this pool
    # must not use the `preloop.sync.tasks.*` wildcard while the
    # flow-execution pool below filters execute_flow / resume_flow_execution.
    - name: default
      replicaCount: 1
      tasks: "" # Empty string means "all tasks not excluded below"
      excludeTasks: "execute_flow,resume_flow_execution"
    # -- Dedicated pool for long-running flow orchestration (claim + heartbeat).
    # Prefer this over the default pool when FLOW_EXECUTION_WORKER_ENABLED=true.
    - name: flow-execution
      replicaCount: 1
      tasks: "execute_flow,resume_flow_execution"
    # -- An example of a specialized worker pool for polling tasks.
    # - name: polling
    #   replicaCount: 2
    #   tasks: "poll_tracker"
  # Worker resources (background tasks)
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

# Flow orchestration: when true, API/webhook create PENDING rows and publish
# execute_flow / resume_flow_execution to JetStream instead of asyncio.create_task.
flowExecution:
  workerEnabled: false
  claimStaleSeconds: 120
  # Periodic re-dispatch of stale/unclaimed actives (deploy handoff).
  reclaimIntervalSeconds: 30
  # Long enough to stop fetches, cancel in-flight monitors, and re-dispatch
  # owned claims — not to wait for agent Jobs to finish.
  terminationGracePeriodSeconds: 90

console:
  repository: ghcr.io/preloop/console
  tag: "latest"
  pullPolicy: Always
  # Preloop Console frontend resources (nginx - lightweight)
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# Privacy-friendly web analytics (e.g. Plausible, Umami). When enabled, the
# console nginx injects the tracking snippet into every HTML page at serve
# time (sub_filter), so analytics stay runtime-configurable per environment —
# no frontend image rebuild needed. Custom conversion events fired by the
# frontend (window.plausible) are queued by the injected stub until the
# script loads, and are silent no-ops when analytics is disabled.
analytics:
  enabled: false
  # Site identifier registered in the analytics platform (Plausible data-domain).
  domain: ""
  # Tracker script URL, e.g. https://traffic.example.com/js/script.js
  scriptUrl: ""
  # Escape hatch for platforms that need a different snippet (e.g. Matomo):
  # raw HTML injected before </head> instead of the Plausible-style script tag.
  # Must not contain single quotes (nginx sub_filter delimiter).
  customSnippet: ""

# Image pull secrets
imagePullSecrets: []

# Service account configuration
serviceAccount:
  # Set to true to create a ServiceAccount for agent execution RBAC
  create: true
  annotations: {}
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext: {}

# Security context
securityContext: {}

# Service configuration
service:
  type: ClusterIP
  port: 8000

# Ingress configuration (disabled by default to avoid conflicts)
# Enable and set your hostname for production. See helm/preloop/README.md.
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: preloop.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: preloop-tls
      hosts:
        - preloop.example.com

# API server resources
api:
  # When unset, falls back to top-level replicaCount.
  # Staging/prod set this to 2 independently of gateway/console.
  replicaCount: null
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

# Scheduler resources
scheduler:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Monitor resources
monitor:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# In-cluster API/database health monitor (replaces external GlitchTip DB checks)
healthMonitor:
  enabled: true
  image: curlimages/curl:8.5.0
  pullPolicy: IfNotPresent
  # Defaults to the internal API service health endpoint with DB check
  url: ""
  intervalSeconds: 60
  timeoutSeconds: 10
  failuresBeforeAlert: 3
  resources:
    requests:
      cpu: "10m"
      memory: "16Mi"
    limits:
      cpu: "50m"
      memory: "64Mi"

# Gateway resources
gateway:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

# Autoscaling configuration (API)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity settings
affinity: {}

# Environment configuration
environment:
  preloopUrl: "https://preloop.ai"
  debug: false
  modelGatewayCaptureContent: true
  # Set true ONLY on the hosted preloop.ai deployment: it is the version-check
  # tracker itself, so it must never persist update state or show the console
  # "update available" banner (rendered as PRELOOP_HOSTED=1 on the API).
  hosted: false
  # GitHub repo ("owner/name") whose latest release the hosted version-check
  # endpoint reports to self-hosted instances (PRELOOP_RELEASES_REPO). Leave
  # empty on self-hosted installs.
  releasesRepo: ""
  # Cap glibc malloc arenas for the Python services (api/gateway). Without a
  # cap, glibc creates up to 8 arenas per core; on many-core nodes with
  # transparent huge pages set to [always] this inflates RSS by hundreds of
  # MB under bursty websocket/request concurrency (observed ~1GB of
  # AnonHugePages on staging api before OOMKill at the 2Gi limit).
  mallocArenaMax: "2"
  # Skip execution recovery on startup (useful for debugging startup issues)
  skipExecutionRecovery: false
  # Database settings
  databaseUrl: ""
  # JWT settings
  jwtSecret: "b6fe6fa9-cf7c-4798-8328-f778712062df"
  jwtAlgorithm: "HS256"
  jwtExpireMinutes: 60

# Configuration for external APIs
config:
  openai:
    apiKey: ""
  anthropic:
    apiKey: ""
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    from: ""
    fromName: "Preloop"

# Database configuration
database:
  # SQLAlchemy connection pool sizing per component, injected as
  # DATABASE_POOL_SIZE / DATABASE_MAX_OVERFLOW. Peak connections per pod =
  # size + maxOverflow. The application defaults (20 + 40 per pod) are NOT
  # safe once the gateway autoscales: 11 pods x 60 = 660 potential
  # connections against max_connections=200. Budget with these values:
  #   api        (1 pod):   10 + 20 = 30
  #   gateway (<=5 pods):    3 +  7 = 10 each -> 50
  #   sync workers/monitor/scheduler (5 pods): 2 + 3 = 5 each -> 25
  # Peak ~105 against max_connections=200 (see cnpg.parameters below),
  # leaving headroom for jobs, replication, and superuser connections.
  pool:
    api:
      size: 10
      maxOverflow: 20
    gateway:
      size: 3
      maxOverflow: 7
    worker:
      size: 2
      maxOverflow: 3
  # If true, deploys a PostgreSQL instance using CloudNativePG
  enabled: true
  # If external is true, uses an external PostgreSQL instance
  external: false
  # External database configuration (if external is true)
  externalDatabase:
    host: ""
    port: 5432
    user: ""
    password: ""
    database: ""
  # CloudNativePG configuration (if enabled is true and external is false)
  cnpg:
    name: ""
    instances: 1  # Set to 2+ for HA (primary + replicas). Requires adequate storage and nodes.
    imageName: registry.spacecode.ai/spacecode/pgvector:16
    auth:
      username: postgres
      password: postgres
      database: preloop
    bootstrap:
      initdb:
        database: preloop
        owner: postgres
        postInitApplicationSQL:
          - CREATE EXTENSION vector;
    storage:
      size: 1Gi
      storageClass: ""
    resources:
      limits:
        cpu: 1500m
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 1Gi
    # PGVector extension for vector search
    pgvector:
      enabled: true
    # PostgreSQL parameters
    # Note: For optimal performance, scale these with memory:
    # - shared_buffers: ~25% of RAM
    # - effective_cache_size: ~75% of RAM
    # - maintenance_work_mem: ~5-10% of RAM
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"       # 25% of 2Gi default; use 1GB for 4Gi
      effective_cache_size: "1536MB" # 75% of 2Gi default; use 3GB for 4Gi
      work_mem: "16MB"               # Per-operation; increase for complex queries
      maintenance_work_mem: "256MB"  # For VACUUM, CREATE INDEX
      random_page_cost: "1.1"        # SSD storage (default 4.0 is for HDD)
      effective_io_concurrency: "200" # SSD
    # Query analysis - enables pg_stat_statements via shared_preload_libraries
    queryAnalysis:
      enabled: false  # Set to true in production for query performance insights
    # Monitoring - expose PostgreSQL metrics to Prometheus via PodMonitor
    monitoring:
      enablePodMonitor: false  # Set to true if Prometheus is deployed
    # Continuous backup to object storage (WAL archiving + base backups)
    backup:
      enabled: false  # Set to true in production
      destinationPath: ""  # e.g. s3://bucket/cnpg/preloop-prod
      retentionPolicy: "30d"
      walCompression: "gzip"
      s3Credentials:
        secretName: ""  # K8s secret containing ACCESS_KEY_ID and SECRET_ACCESS_KEY
        accessKeyIdKey: "ACCESS_KEY_ID"
        secretAccessKeyKey: "SECRET_ACCESS_KEY"
    # Slow query logging - enable to monitor query performance
    logging:
      enabled: false  # Set to true to enable slow query logging
      # Log queries that run longer than this (milliseconds)
      log_min_duration_statement: "1000"  # 1 second
      # Logging settings
      log_statement: "none"  # none, ddl, mod, all
      log_line_prefix: "%t [%p]: [%l-1] user=%u,db=%d "
    # Resilience settings - enable for production to prevent stuck queries/connections
    # These settings add timeouts to prevent cascading failures
    resilience:
      enabled: false  # Set to true in production
      # Kill queries that run longer than this (milliseconds) - 5 min to allow migrations
      statement_timeout: "300000"  # 5 minutes
      # Kill connections that are idle in a transaction longer than this (milliseconds)
      idle_in_transaction_session_timeout: "300000"  # 5 minutes
      # Maximum time to wait for a lock (milliseconds)
      lock_timeout: "60000"  # 60 seconds
      # WAL settings to reduce checkpoint frequency issues
      max_wal_size: "2GB"
      min_wal_size: "1GB"
      checkpoint_completion_target: "0.9"
    # CNPG rolling-update / shutdown behaviour. Tune per environment via --set.
    lifecycle:
      primaryUpdateStrategy: unsupervised
      # Use switchover for HA (instances > 1); restart is fine for single-instance.
      primaryUpdateMethod: restart
      stopDelay: 1800
      smartShutdownTimeout: 180
      switchoverDelay: 3600
      startDelay: 3600
      failoverDelay: 0
      enablePDB: true
      # Align kube grace period with stopDelay (+60s buffer for CNPG shutdown hooks).
      terminationGracePeriodSeconds: 1860

# Sentry configuration for error tracking
sentry:
  enabled: false
  # The DSN for your Sentry project
  dsn: ""

# Performance profiling configuration
profiling:
  enabled: false
  # Configuration for the PersistentVolumeClaim for storing profiling reports
  storage:
    pvc:
      # If true, a PVC will be created
      create: true
      # If undefined or null, the default StorageClass will be used.
      # Set to "-" to disable dynamic provisioning.
      storageClassName: ""
      # Size of the PVC
      size: 1Gi

# Local GeoIP database for analytics enrichment (EE growth plugin).
# When enabled, a PVC is mounted on the API pods and the plugin downloads /
# refreshes the freely licensed DB-IP City Lite database (CC BY 4.0,
# MaxMind-format) on startup. IP lookups happen locally — client IPs never
# leave the server. Operators may pre-place a GeoLite2 database at dbPath.
geoip:
  enabled: false
  autoDownload: true
  dbPath: /var/lib/preloop/geoip/dbip-city-lite.mmdb
  storage:
    pvc:
      create: true
      storageClassName: ""
      size: 1Gi

# NATS configuration
nats:
  enabled: true
  url: ""
  config:
    jetstream:
      enabled: true
  nats:
    jetstream:
      enabled: true

# Stripe configuration
stripe:
  secretKey: ""
  webhookSecret: ""

# Security settings
security:
  # Encryption key for sensitive data (OAuth tokens, etc.)
  # If not set, derived from JWT secret. Recommended to set a dedicated key.
  encryptionKey: ""

# GitHub App OAuth configuration (Enterprise Edition only)
# Required for "Connect with GitHub" flow in tracker creation
githubApp:
  enabled: false
  # GitHub App ID from app settings
  appId: ""
  # GitHub App Client ID for OAuth
  clientId: ""
  # GitHub App Client Secret for OAuth
  clientSecret: ""
  # GitHub App Private Key (PEM format, base64 encoded)
  privateKey: ""
  # GitHub App Webhook Secret for signature verification
  webhookSecret: ""
  # GitHub App slug (e.g., "preloop" or "preloop-staging")
  slug: ""

# Google OAuth configuration (Enterprise Edition only)
# Enables "Sign in with Google" on login/register pages
googleOauth:
  enabled: false
  # Google OAuth Client ID (from Google Cloud Console)
  clientId: ""
  # Google OAuth Client Secret
  clientSecret: ""

# GitLab OAuth configuration (Enterprise Edition only)
# Enables "Sign in with GitLab" on login/register pages
# Supports GitLab.com (default) and self-hosted GitLab instances
gitlabOauth:
  enabled: false
  # GitLab OAuth Application ID
  clientId: ""
  # GitLab OAuth Application Secret
  clientSecret: ""
  # GitLab instance URL (for self-hosted; defaults to https://gitlab.com)
  baseUrl: "https://gitlab.com"

# Apple Push Notification Service (APNS) configuration
apns:
  enabled: false
  # Team ID from Apple Developer account
  teamId: ""
  # Key ID from Apple Developer portal
  keyId: ""
  # Base64-encoded APNS auth key (.p8 file contents)
  authKey: ""
  # App bundle identifier
  bundleId: ""
  # Use APNS sandbox environment (true for development, false for production)
  useSandbox: false

# Firebase Cloud Messaging (FCM) configuration for Android push notifications
fcm:
  enabled: false
  # Firebase service account credentials JSON (base64-encoded or raw JSON string)
  # Get this from Firebase Console > Project Settings > Service Accounts > Generate new private key
  credentialsJson: ""

# Test user seeding configuration
seed:
  enabled: false
  username: "test"
  email: "test@example.com"
  password: ""
  apiKey: ""

# Admin notification configuration
notifications:
  # Email for admin notifications (account deletions, errors, etc.)
  productTeamEmail: ""

  # Slack webhook URL for admin notifications (optional)
  # Get this from Slack: https://api.slack.com/messaging/webhooks
  slackWebhookUrl: ""

  # Mattermost webhook URL for admin notifications (optional)
  # Get this from Mattermost: Settings > Integrations > Incoming Webhooks
  mattermostWebhookUrl: ""

cleanup:
  enabled: false

# Agent execution configuration
agentExecution:
  # Namespace for running agent containers
  namespace:
    # If true, creates a separate namespace for agent execution (recommended for production)
    # If false, agents run in the same namespace as Preloop (easier for testing/PoC)
    create: false
    # Name of the namespace for agent execution (only used if create: true)
    # If create is false, agents run in the same namespace as Preloop
    name: "agent-executions"

  # RBAC configuration for agent execution
  rbac:
    # If true, creates Role and RoleBinding for agent management
    create: true

  # NetworkPolicy configuration for agent isolation
  networkPolicy:
    # If true, creates NetworkPolicy for agent namespace
    enabled: true
    # Allow agent pods to call Preloop API for MCP tools
    allowPreloopAPI: true
    # Allow agent pods to call external LLM APIs (Anthropic, OpenAI)
    allowExternalLLMAPIs: true
    # CIDR ranges to exclude from external egress (internal cluster networks)
    # Adjust these based on your cluster's network configuration
    excludeCIDRs:
      - "10.0.0.0/8"      # Private network (adjust if your cluster uses this)
      - "172.16.0.0/12"   # Private network (adjust if your cluster uses this)
      - "192.168.0.0/16"  # Private network (adjust if your cluster uses this)
    # Additional egress rules (optional)
    additionalEgressRules: []

  # ResourceQuota for agent execution namespace
  resourceQuota:
    # Maximum number of concurrent Jobs
    maxJobs: "50"
    # Maximum number of concurrent Pods
    maxPods: "100"
    # Total CPU requests allowed across all pods
    requestsCpu: "50"
    # Total memory requests allowed across all pods
    requestsMemory: "100Gi"
    # Total CPU limits allowed across all pods
    limitsCpu: "100"
    # Total memory limits allowed across all pods
    limitsMemory: "200Gi"

  # LimitRange for individual agent containers
  limitRange:
    container:
      # Maximum resources per container
      maxCpu: "2"
      maxMemory: "4Gi"
      # Minimum resources per container
      minCpu: "100m"
      minMemory: "128Mi"
      # Default limits if not specified
      defaultCpu: "1"
      defaultMemory: "2Gi"
      # Default requests if not specified
      defaultRequestCpu: "250m"
      defaultRequestMemory: "512Mi"
    pod:
      # Maximum resources per pod
      maxCpu: "4"
      maxMemory: "8Gi"

  # Container images for agent execution
  images:
    # Simple LLM agent (recommended for production)
    simpleLLM:
      repository: "registry.spacecode.ai/spacecode/simple-llm-agent"
      tag: "latest"
      pullPolicy: "Always"
    # OpenHands agent (experimental, requires more resources)
    openHands:
      repository: "ghcr.io/all-hands-ai/openhands"
      tag: "latest"
      pullPolicy: "Always"

  # Agent execution timeout (seconds)
  defaultTimeout: 3600

  # Job cleanup configuration
  jobCleanup:
    # TTL for completed Jobs (seconds)
    ttlSecondsAfterFinished: 3600
    # TTL for failed Jobs (seconds)
    ttlSecondsAfterFailed: 7200

# Compute Backend configuration for AWS, Google Cloud (GCP), or KubeVirt
computeBackend:
  provider: "" # Set to "kubevirt", "aws", or "gcp"
  kubevirt:
    kubeconfigPath: ""
    namespace: ""
    vmImage: ""
  aws:
    accessKeyId: ""
    secretAccessKey: ""
    defaultRegion: ""
    amiId: ""
    instanceType: ""
  gcp:
    projectId: ""
    credentialsJsonPath: ""
    zone: ""
    machineType: ""
