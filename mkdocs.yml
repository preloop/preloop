# Documentation site for docs.preloop.ai. Build: mkdocs build --strict
site_name: Preloop Documentation
site_url: https://docs.preloop.ai/
repo_url: https://github.com/preloop/preloop
repo_name: preloop/preloop
edit_uri: edit/main/docs/
docs_dir: docs
# Tooling that lives next to the docs, not pages.
exclude_docs: |
  scripts/

theme:
  name: material
  logo: assets/preloop-badge.svg
  favicon: assets/favicon.png
  features:
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  # Dark only: docs/stylesheets/extra.css and the Redoc theme in
  # docs/guide/api.md hardcode dark colours.
  palette:
    scheme: slate
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: Fira Code

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # GitHub-compatible heading ids, so #anchors work on github.com and on the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search
  - mermaid2
  # Old docs.preloop.ai URLs (site pages lived at the docs root before the move).
  - redirects:
      redirect_maps:
        api.md: guide/api.md
        approvals/ai-approvals.md: guide/approvals/ai-approvals.md
