              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/permission-check:
    post:
      tags:
      - Agent Permissions
      - Agent Permissions
      summary: Agent Permission Check
      description: Decide whether an onboarded agent's native tool call may proceed.
      operationId: agent_permission_check_api_v1_agents_permission_check_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPermissionCheckRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPermissionCheckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /api/v1/roles:
    get:
      tags:
      - Roles
      summary: List Roles
      description: "List all available roles.\n\nArgs:\n    current_user: Current\
        \ authenticated user\n    db: Database session\n\nReturns:\n    dict: List\
        \ of roles with their permissions"
      operationId: list_roles_api_v1_roles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - bearerAuth: []
components:
  schemas:
    AIModelCatalogSyncProviderResult:
      properties:
        provider:
          type: string
          title: Provider
          description: Provider name, e.g. 'anthropic'
        source:
          type: string
          enum:
          - live
          - fallback
          title: Source
          description: '''live'' when the provider''s listing endpoint answered; ''fallback''
            when discovery failed or was impossible'
          default: fallback
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Short safe reason when nothing could be discovered (fixed vocabulary;
            never raw provider error text)
        discovered:
          type: integer
          title: Discovered
          description: Total model identifiers the provider listed
          default: 0
        added:
          items:
            type: string
          type: array
          title: Added
          description: Gateway aliases of newly added catalog models
        skipped_existing:
          type: integer
          title: Skipped Existing
          description: Discovered identifiers already present in the catalog
          default: 0
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: Human-readable context for skips and errors
      type: object
      required:
      - provider
      title: AIModelCatalogSyncProviderResult
      description: Sync outcome for one provider.
    AIModelCatalogSyncRequest:
      properties:
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
          description: Optional provider filter, e.g. 'anthropic'. When omitted, every
            provider the account has credentialed models for is synced.
        dry_run:
          type: boolean
          title: Dry Run
          description: Report what would be added without creating any models
          default: false
      type: object
      title: AIModelCatalogSyncRequest
      description: Request body for the account model-catalog sync.
    AIModelCatalogSyncResponse:
      properties:
        providers:
          items:
            $ref: '#/components/schemas/AIModelCatalogSyncProviderResult'
          type: array
          title: Providers
        dry_run:
          type: boolean
          title: Dry Run
          default: false
      type: object
      title: AIModelCatalogSyncResponse
      description: Per-provider results of one model-catalog sync run.
    AIModelCreate:
      properties:
        name:
          type: string
          title: Name
          description: User-defined name for this model configuration
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Optional description
        provider_name:
          type: string
          title: Provider Name
          description: e.g., 'openai', 'anthropic'
        model_identifier:
          type: string
          title: Model Identifier
          description: Standardized identifier, e.g., 'gpt-5.4-turbo'
        model_kind:
          type: string
          enum:
          - llm
          - stt
          - tts
          title: Model Kind
          description: 'Service kind for this model configuration: inference, STT,
            or TTS'
          default: llm
        api_endpoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Endpoint
          description: URL for the model's API, if not standard
        api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
          description: API key for the model provider
        credential_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Type
          description: Optional inline credential envelope type, e.g. 'oauth_openai_codex'
        credential_payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Credential Payload
          description: Optional inline credential payload for non-API-key auth, stored
            encrypted when provided
        credentials_backend_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Credentials Backend Type
          description: Optional external credential backend type, e.g. 'vault_kv_v2'
        credentials_external_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Credentials External Ref
          description: Optional external secret reference for provider credentials
        credentials_meta_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Credentials Meta Data
          description: Optional metadata for external secret backends, e.g. field/version
        is_default:
          type: boolean
          title: Is Default
          description: Indicates if this is the default model for the account
          default: false
        model_parameters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Model Parameters
          description: Optional, for model-specific parameters like temperature, max_tokens
        meta_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta Data
          description: Optional, for custom fields, labels, etc.
        credentials_secret_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Credentials Secret Id
          description: Reuse an existing SecretReference instead of minting a new
            one. Used to create several models that share a single provider key. The
            secret must already belong to the caller's account.
      type: object
      required:
      - name
      - provider_name
      - model_identifier
      title: AIModelCreate
      description: Schema for creating a new AIModel entry.
    AIModelCredentialExportResponse:
      properties:
        credential_type:
          type: string
          title: Credential Type
        access:
          type: string
          title: Access
        refresh:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh
        expires:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires
        account_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Account Id
      type: object
      required:
      - credential_type
      - access
      title: AIModelCredentialExportResponse
      description: 'Live subscription-OAuth bundle exported to the owning operator.


        Returned once over the authenticated API so the CLI can restore an

        agent''s local login at offboard time (subscription refresh tokens are

        single-use, so the Preloop-held copy is the only live lineage after a

        server-side refresh). Token material must never be logged.'
    AIModelGatewayUsageSummaryResponse:
      properties:
        ai_model_id:
          type: string
          title: Ai Model Id
        model_name:
          type: string
          title: Model Name
        provider_name:
          type: string
          title: Provider Name
        model_identifier:
          type: string
          title: Model Identifier
        period_start:
          type: string
          format: date-time
          title: Period Start
        period_end:
          type: string
          format: date-time
          title: Period End
        total_requests:
          type: integer
          title: Total Requests
          default: 0
        successful_requests:
          type: integer
          title: Successful Requests
          default: 0
        failed_requests:
          type: integer
          title: Failed Requests
          default: 0
        token_usage:
          $ref: '#/components/schemas/GatewayTokenUsage'
        estimated_cost:
          type: number
          title: Estimated Cost
          default: 0.0
        requests_by_day:
          items:
            $ref: '#/components/schemas/GatewayUsageByDay'
          type: array
          title: Requests By Day
        usage_by_session:
          items:
            $ref: '#/components/schemas/GatewayUsageBySession'
          type: array
          title: Usage By Session
      type: object
      required:
      - ai_model_id
      - model_name
      - provider_name
      - model_identifier
      - period_start
      - period_end
      - token_usage
      title: AIModelGatewayUsageSummaryResponse
      description: Gateway usage summary for one durable AI model.
    AIModelOverviewItem:
      properties:
        ai_model_id:
          type: string
          title: Ai Model Id
        model_name:
          type: string
          title: Model Name
        provider_name:
          type: string
          title: Provider Name
        model_identifier:
          type: string
          title: Model Identifier
        model_alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Alias
          description: Gateway alias clients call this model by, if configured
        is_default:
          type: boolean
          title: Is Default
          default: false
        total_requests:
          type: integer
          title: Total Requests
          default: 0
        successful_requests:
          type: integer
          title: Successful Requests
          default: 0
        failed_requests:
          type: integer
          title: Failed Requests
          default: 0
        token_usage:
          $ref: '#/components/schemas/GatewayTokenUsage'
        estimated_cost:
          type: number
          title: Estimated Cost
          default: 0.0
        unpriced_request_count:
          type: integer
          title: Unpriced Request Count
          description: Requests with tokens but no price to apply
          default: 0
        active_session_count:
          type: integer
          title: Active Session Count
          description: Runtime sessions still open that used this model
          default: 0
        last_request_at:
          anyOf:
