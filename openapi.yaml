  /api/v1/attention/dismissals:
    get:
      tags:
      - Account
      summary: List Attention Dismissals
      description: 'List the console attention items this account has silenced.


        Reading is open to any member of the account: the console needs this list

        to render the inbox at all, and a member who cannot see it would be shown

        items their colleagues have already dealt with.


        Expired snoozes are excluded and garbage-collected here, so "hidden until"

        never quietly becomes "hidden forever".'
      operationId: list_attention_dismissals_api_v1_attention_dismissals_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionDismissalListResponse'
      security:
      - bearerAuth: []
  /api/v1/attention/dismissals/{item_id}:
    put:
      tags:
      - Account
      summary: Upsert Attention Dismissal
      description: 'Silence one attention item until its fingerprint changes.


        ``item_id`` is the console''s stable id for the item (``<kind>:<entity

        id>``), and the body''s ``fingerprint`` is why it was showing. Dismissing

        an item that has already been dismissed replaces the row, which is how an

        item that came back with a new fingerprint gets silenced again.


        Writing takes ``manage_agents``: an operator who may reconfigure the fleet

        may also declare that one of its states is expected.'
      operationId: upsert_attention_dismissal_api_v1_attention_dismissals__item_id__put
      security:
      - bearerAuth: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttentionDismissalUpsertRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionDismissalResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Account
      summary: Delete Attention Dismissal
      description: Restore a silenced item so it shows in the inbox again.
      operationId: delete_attention_dismissal_api_v1_attention_dismissals__item_id__delete
      security:
      - bearerAuth: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          title: Item Id
      responses:
        '204':
          description: Successful Response
        '422':
