          - tool
          - tool_use
          title: Role
        text:
          type: string
          maxLength: 4000
          minLength: 1
          title: Text
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
      type: object
      required:
