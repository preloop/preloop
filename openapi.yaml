          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ai Model Id
          description: Existing AI model id. When no typed api_key is sent, the server
            decrypts the stored credentials via CRUD and lists live. The plaintext
            key is never returned in the response.
        api_endpoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Endpoint
          description: Base URL of an OpenAI-compatible endpoint, e.g. https://openrouter.ai/api/v1.
            Required for the 'openai-compatible' and 'custom' providers, which have
            no fixed model catalog.
        model_kind:
