openapi: 3.1.0
info:
  title: Preloop API
  description: REST API for Preloop issue tracking management
  version: 0.12.2
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Register
      description: "Register a new user.\n\nArgs:\n    user_data: User creation data.\n\
        \    background_tasks: Background tasks for sending emails.\n    request:\
        \ The incoming request object.\n\nReturns:\n    The created user.\n\nRaises:\n\
        \    HTTPException: If the username or email is already taken, or if registration\
        \ is disabled."
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/verify-email:
    post:
      tags:
      - Auth
      summary: Verify Email
      description: "Verify a user's email address.\n\nArgs:\n    verification_data:\
        \ Email verification data with token.\n\nReturns:\n    Success message.\n\n\
        Raises:\n    HTTPException: If the token is invalid or the user does not exist."
      operationId: verify_email_api_v1_auth_verify_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Verify Email Api V1 Auth Verify Email Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Forgot Password
      description: "Send a password reset email.\n\nArgs:\n    reset_data: Password\
        \ reset request with email.\n    background_tasks: Background tasks for sending\
        \ emails.\n\nReturns:\n    Success message."
      operationId: forgot_password_api_v1_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Forgot Password Api V1 Auth Forgot Password Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/reset-password:
    post:
      tags:
      - Auth
      summary: Reset Password
      description: "Reset a user's password.\n\nArgs:\n    reset_data: Password reset\
        \ confirmation with token and new password.\n\nReturns:\n    Success message.\n\
        \nRaises:\n    HTTPException: If the token is invalid or the user does not\
        \ exist."
      operationId: reset_password_api_v1_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Reset Password Api V1 Auth Reset Password Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/token:
    post:
      tags:
      - Auth
      summary: Login Form
      description: "Login to get an access token using form data (required for OAuth2\
        \ flow).\n\nArgs:\n    request: The incoming request object.\n    form_data:\
        \ OAuth2 password request form.\n\nReturns:\n    Access token.\n\nRaises:\n\
        \    HTTPException: If the username or password is incorrect."
      operationId: login_form_api_v1_auth_token_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_form_api_v1_auth_token_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/token/json:
    post:
      tags:
      - Auth
      summary: Login Json
      description: "Login to get an access token using JSON data.\n\nArgs:\n    http_request:\
        \ The incoming HTTP request object.\n    request: Login request with username\
        \ and password.\n\nReturns:\n    Access token.\n\nRaises:\n    HTTPException:\
        \ If the username or password is incorrect."
      operationId: login_json_api_v1_auth_token_json_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh Token
      description: "Refresh an access token using a refresh token.\n\nArgs:\n    request:\
        \ Refresh token request.\n\nReturns:\n    New access token.\n\nRaises:\n \
        \   HTTPException: If the refresh token is invalid or expired."
      operationId: refresh_token_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/users/me:
    get:
      tags:
      - Auth
      summary: Read Users Me
      description: "Get the current user.\n\nArgs:\n    current_user: The current\
        \ user.\n\nReturns:\n    The current user."
      operationId: read_users_me_api_v1_auth_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
      security:
      - OAuth2PasswordBearer: []
    put:
      tags:
      - Auth
      summary: Update User Me
      description: Update own user.
      operationId: update_user_me_api_v1_auth_users_me_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUserUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/users/me/password:
    put:
      tags:
      - Auth
      summary: Change Current User Password
      description: Change current user's password.
      operationId: change_current_user_password_api_v1_auth_users_me_password_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/api-keys:
    get:
      tags:
      - Auth
      summary: List Api Keys
      description: "List all API keys for the current user.\n\nArgs:\n    current_user:\
        \ The current authenticated user.\n\nReturns:\n    List of API keys."
      operationId: list_api_keys_api_v1_auth_api_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiKeySummary'
                type: array
                title: Response List Api Keys Api V1 Auth Api Keys Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - Auth
      summary: Create Api Key
      description: "Create a new API key.\n\nArgs:\n    key_data: The key creation\
        \ data.\n    current_user: The current authenticated user.\n\nReturns:\n \
        \   The created API key details."
      operationId: create_api_key_api_v1_auth_api_keys_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/runtime-sessions/token:
    post:
      tags:
      - Auth
      summary: Create Runtime Session Token
      description: Create a short-lived runtime token bound to a shared runtime session.
      operationId: create_runtime_session_token_api_v1_auth_runtime_sessions_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeSessionTokenCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSessionTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/api-keys/{key_id}:
    get:
      tags:
      - Auth
      summary: Get Api Key
      description: "Get a specific API key for the current user.\n\nArgs:\n    key_id:\
        \ The API key ID.\n    current_user: The current authenticated user.\n   \
        \ db: The database session.\n\nReturns:\n    The API key summary."
      operationId: get_api_key_api_v1_auth_api_keys__key_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeySummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Auth
      summary: Delete Api Key
      description: "Delete an API key.\n\nArgs:\n    key_id: The ID of the key to\
        \ delete.\n    current_user: The current authenticated user.\n\nRaises:\n\
        \    HTTPException: If the key doesn't exist or doesn't belong to the user."
      operationId: delete_api_key_api_v1_auth_api_keys__key_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/api-keys/{key_id}/activity:
    get:
      tags:
      - Auth
      summary: Get Api Key Activity
      description: "Get recent activity for an API key.\n\nArgs:\n    key_id: The\
        \ API key ID.\n    current_user: The current authenticated user.\n    db:\
        \ The database session.\n\nReturns:\n    A list of recent API usage logs."
      operationId: get_api_key_activity_api_v1_auth_api_keys__key_id__activity_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Get Api Key Activity Api V1 Auth Api Keys  Key Id  Activity
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/api-keys/{key_id}/gateway-usage/summary:
    get:
      tags:
      - Auth
      summary: Get Api Key Gateway Usage Summary
      description: Get gateway usage summary for an API key.
      operationId: get_api_key_gateway_usage_summary_api_v1_auth_api_keys__key_id__gateway_usage_summary_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Api Key Gateway Usage Summary Api V1 Auth Api
                  Keys  Key Id  Gateway Usage Summary Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/api-keys/{key_id}/governance:
    get:
      tags:
      - Auth
      summary: Get Api Key Governance
      operationId: get_api_key_governance_api_v1_auth_api_keys__key_id__governance_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectGovernanceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Auth
      summary: Update Api Key Governance
      operationId: update_api_key_governance_api_v1_auth_api_keys__key_id__governance_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectGovernanceConfig'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectGovernanceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/api-usage:
    get:
      tags:
      - Auth
      summary: Get Api Usage
      description: "Get API usage statistics for the current user.\n\nAggregates in\
        \ SQL (not in Python). When neither date is provided, the\nwindow defaults\
        \ to the last 30 days. Endpoint breakdown is capped to\nthe top 50 endpoints\
        \ by request count.\n\nArgs:\n    start_date: Optional start date for filtering.\n\
        \    end_date: Optional end date for filtering.\n    current_user: The current\
        \ authenticated user.\n\nReturns:\n    API usage statistics."
      operationId: get_api_usage_api_v1_auth_api_usage_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUsageStatistics'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/complete-onboarding:
    post:
      tags:
      - Auth
      summary: Complete Onboarding
      description: 'Completes the onboarding for a new user created via Stripe checkout.

        Sets the password and updates the username.'
      operationId: complete_onboarding_api_v1_auth_complete_onboarding_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/account/details:
    get:
      tags:
      - Account
      summary: Get Account Details
      description: "Get current account details.\n\nReturns:\n    Account details\
        \ including organization name"
      operationId: get_account_details_api_v1_account_details_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailsResponse'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Account
      summary: Update Account Details
      description: "Update current account details.\n\nArgs:\n    update_data: Account\
        \ update data\n    account: Current user's account\n    db: Database session\n\
        \nReturns:\n    Updated account details"
      operationId: update_account_details_api_v1_account_details_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDetailsUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /api/v1/account/gateway-usage/summary:
    get:
      tags:
      - Account
      summary: Get Account Gateway Usage Summary
      description: Get account-scoped model gateway usage summary.
      operationId: get_account_gateway_usage_summary_api_v1_account_gateway_usage_summary_get
      security:
      - bearerAuth: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Date
      - name: runtime_principal_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Runtime Principal Id
      - name: include_breakdown
        in: query
        required: false
        schema:
          type: boolean
          description: When true, include per-model/flow/session/tool/day breakdowns.
            Default true preserves the historical response shape for API clients;
            lightweight card callers (Overview/Agents) should pass false. Prefer /cost/summary
            for full cost analytics.
          default: true
          title: Include Breakdown
        description: When true, include per-model/flow/session/tool/day breakdowns.
          Default true preserves the historical response shape for API clients; lightweight
          card callers (Overview/Agents) should pass false. Prefer /cost/summary for
          full cost analytics.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGatewayUsageSummaryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/account/gateway-usage/search:
    get:
      tags:
      - Account
      summary: Search Account Gateway Usage
      description: Search or list indexed gateway interactions for the current account.
      operationId: search_account_gateway_usage_api_v1_account_gateway_usage_search_get
      security:
      - bearerAuth: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Query
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Date
      - name: provider_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Name
      - name: model_alias
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Alias
      - name: flow_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Flow Id
      - name: runtime_session_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Runtime Session Id
      - name: runtime_principal_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Runtime Principal Id
      - name: api_key_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key Id
      - name: session_source_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Source Type
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGatewayUsageSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents:
    get:
      tags:
      - Account
      summary: List Account Managed Agents
      description: List enrolled external agents for the current account.
      operationId: list_account_managed_agents_api_v1_agents_get
      security:
      - bearerAuth: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Query
      - name: agent_kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Kind
      - name: last_seen_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen After
      - name: status
        in: query
        required: false
        schema:
          type: string
