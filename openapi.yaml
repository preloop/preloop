    UsageIngestRecord:
      properties:
        external_id:
          type: string
          maxLength: 255
          minLength: 1
          title: External Id
          description: Source-side record/turn id; dedupe key with `source`.
        conversation_id:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Conversation Id
        parent_conversation_id:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Parent Conversation Id
          description: Conversation this record's conversation was spawned from (e.g.
            a subagent worker's parent thread), for cost rollup.
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        event_type:
          type: string
          enum:
          - session_start
          - session_end
          - subagent_start
          - subagent_stop
          - response
          - compaction
          - usage
          title: Event Type
          description: Hook-shaped lifecycle marker. 'usage' (default) requires a
            model and at least one measurement; lifecycle events (session/subagent
            start/stop, response, compaction) may carry zero token/cost data and no
            model.
          default: usage
        model:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Model
          description: Source-reported model name. Required for event_type='usage'.
        charged_cost:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Charged Cost
          description: Amount the source vendor charged, in USD. The billing truth;
            never derived from tokens. Stored as a float on the ledger (estimated_cost
            is a Float column), matching the CSV import path.
        cost_basis:
          type: string
          enum:
          - estimated
          - reconciled
          title: Cost Basis
          description: '''estimated'' (hook/transcript-derived) or ''reconciled''
            (billing export). Reconciled records supersede estimated records with
            the same (source, conversation_id) in cost summaries; the two are never
            summed together.'
          default: estimated
        input_tokens:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Input Tokens
        output_tokens:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Output Tokens
        cache_read_tokens:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Cache Read Tokens
          description: Cache-read tokens, reported distinctly; never summed into charged
            spend or total tokens.
        message_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Message Count
          description: Messages in the conversation so far (growth tripwire).
        tool_call_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Tool Call Count
          description: Tool calls in the conversation so far (growth tripwire).
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: 'Small JSON object. Recognized session keys: `session_title`
            (sets the runtime session title), `session_title_default` (fills the title
            only while it is empty) and `session_summary` (replaces the runtime session
            summary).'
        transcript:
          anyOf:
          - items:
              $ref: '#/components/schemas/UsageIngestTranscriptMessage'
            type: array
            maxItems: 50
          - type: 'null'
          title: Transcript
          description: Opt-in transcript text for this record's conversation, stored
            as runtime session activities. Shippers send it only when the operator
            enabled transcript storage; by default only counts, titles and short summaries
            leave the machine.
      type: object
      required:
      - external_id
      - timestamp
      title: UsageIngestRecord
      description: 'One usage record pushed continuously by an external harness.


        Unlike ``UsageImportEvent`` (batch CSV/JSON import, content-hash

        dedupe), a pushed record carries a caller-supplied ``external_id`` so

        replays after network timeouts are idempotent, plus conversation ids so

        subagent workers billed on separate conversations can be rolled up

        under their parent thread in Cost analytics.'
    UsageIngestRecordResult:
      properties:
        external_id:
          type: string
          title: External Id
        deduplicated:
          type: boolean
          title: Deduplicated
          default: false
        conflict:
          type: boolean
          title: Conflict
          description: True when a deduplicated replay carried a DIFFERENT payload
            than the stored record (first write wins; the batch still returns 200
            so shippers can retry blindly).
          default: false
      type: object
      required:
      - external_id
      title: UsageIngestRecordResult
      description: Per-record outcome of a push-ingest request.
    UsageIngestRequest:
      properties:
        records:
          items:
            $ref: '#/components/schemas/UsageIngestRecord'
          type: array
          maxItems: 1000
          minItems: 1
          title: Records
        agent_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Agent Id
          description: Managed agent to attribute the records to. When omitted, the
            account's single managed agent whose kind matches `source` is used if
            exactly resolvable.
        source:
          type: string
          maxLength: 64
          minLength: 1
          title: Source
          description: Origin label stored on each row (e.g. 'cursor').
      type: object
      required:
      - records
      - source
      title: UsageIngestRequest
      description: Batch of pushed usage records to ingest.
    UsageIngestResponse:
      properties:
        source:
          type: string
          title: Source
        agent_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Agent Id
        agent_display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Display Name
        accepted:
          type: integer
          title: Accepted
          default: 0
        deduplicated:
          type: integer
          title: Deduplicated
          default: 0
        conflicts:
          type: integer
          title: Conflicts
          default: 0
        results:
          items:
            $ref: '#/components/schemas/UsageIngestRecordResult'
          type: array
          title: Results
      type: object
      required:
      - source
      title: UsageIngestResponse
      description: 'Result of a push-ingest request.


        Replays return 200 with the replayed records flagged

        ``deduplicated`` — spend is never double-counted. Replays whose

        payload differs from the stored record are additionally flagged

        ``conflict`` (first write wins; never a 409).'
    UsageIngestTranscriptMessage:
      properties:
        role:
          type: string
          enum:
          - user
