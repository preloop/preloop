  /api/v1/mcp-servers/{server_id}/oauth/authorize-token:
    post:
      tags:
      - MCP Servers
      summary: Create Mcp Oauth Authorize Token
      description: 'Mint a short-lived, single-purpose token for the browser OAuth
        redirect.


        The browser navigates to the authorize endpoint via a full-page redirect

        and cannot attach an Authorization header, so the token must ride in the

        URL. Rather than exposing the reusable access token there (where it would

        land in browser history, server access logs, and the Referer sent onward

        to the external OAuth provider), this endpoint — authenticated normally via

        the Authorization header — returns a token scoped to this one server and

        purpose and expiring in ~2 minutes.'
      operationId: create_mcp_oauth_authorize_token_api_v1_mcp_servers__server_id__oauth_authorize_token_post
      security:
      - bearerAuth: []
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Mcp Oauth Authorize Token Api V1 Mcp Servers  Server
                  Id  Oauth Authorize Token Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/mcp-servers/{server_id}/oauth/authorize:
    get:
      tags:
      - MCP Servers OAuth
      summary: Mcp Server Oauth Authorize
      description: 'Initiate the MCP OAuth client flow for an external MCP server.


        This endpoint is on the public router because the browser navigates

        to it directly (302 redirect flow). Auth is via the short-lived,

        server-scoped ``code`` minted by ``POST .../oauth/authorize-token`` —

        never the reusable access token.


        1. Fetches the server''s /.well-known/oauth-authorization-server metadata.

        2. Dynamically registers as an OAuth client (RFC 7591) if needed.

        3. Generates PKCE code_challenge / code_verifier.

        4. Redirects the user to the external server''s authorization endpoint.'
      operationId: mcp_server_oauth_authorize_api_v1_mcp_servers__server_id__oauth_authorize_get
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      - name: code
        in: query
        required: true
        schema:
          type: string
          description: Short-lived authorize token from /oauth/authorize-token
          title: Code
        description: Short-lived authorize token from /oauth/authorize-token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /api/v1/mcp-servers/oauth/callback:
    get:
      tags:
      - MCP Servers OAuth
      summary: Mcp Server Oauth Callback
      description: 'Handle the OAuth callback from an external MCP server.


        Exchanges the authorization code for access/refresh tokens using PKCE,

        saves them in the MCP server''s auth_config, and redirects to the frontend.'
      operationId: mcp_server_oauth_callback_api_v1_mcp_servers_oauth_callback_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
