      - ai_model_id
      - model_name
      - provider_name
      - model_identifier
      title: AIModelOverviewItem
      description: 'One row of the Models page: what this model did in the window.'
    AIModelPrice:
      properties:
        input_per_1m:
          anyOf:
          - type: number
          - type: 'null'
          title: Input Per 1M
          description: Price of a million input tokens, in USD.
        output_per_1m:
          anyOf:
          - type: number
          - type: 'null'
          title: Output Per 1M
          description: Price of a million output tokens, in USD.
        cached_input_per_1m:
          anyOf:
          - type: number
          - type: 'null'
          title: Cached Input Per 1M
          description: Price of a million cached input tokens, in USD. Absent when
            the source says nothing about caching, which is not the same as free.
        blended_per_1m:
          anyOf:
          - type: number
          - type: 'null'
          title: Blended Per 1M
          description: Single price applied to every token, in USD per million. Set
