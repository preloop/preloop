[build-system]
# setuptools>=77 is required for the PEP 639 SPDX `license = "Apache-2.0"`
# string form below; older versions fail to parse it.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preloop"
version = "0.15.0"
description = "Preloop - Control plane & safety layer for your agentic AI workforce"
readme = "README.md"
authors = [{name = "Dimitris Moraitis", email = "dimitris@preloop.ai"}, {name = "Yannis Chatzikonstantinou", email = "yannis@preloop.ai"}]
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
    "ai-agent-control-plane",
    "mcp",
    "mcp-firewall",
    "mcp-gateway",
    "ai-gateway",
    "llm-gateway",
    "ai-agent-governance",
    "human-in-the-loop",
    "guardrails",
    "policy-as-code",
    "observability",
    "audit-trail",
    "self-hosted",
    "agentops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Topic :: Security",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.72.0",
    "uvicorn[standard]>=0.36.0",
    "fastapi>=0.129.2",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",  # Required for SQLAlchemy async operations
    "psycopg[binary]>=3.1.12",
    "psycopg2-binary>=2.9.0",  # Required for SQLAlchemy sync engine
    "pgvector>=0.2.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.4.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1.0",
    "python-multipart>=0.0.6",
    "httpx[http2]>=0.24.1",  # http2 extra required for APNs push notifications
    "tenacity>=8.2.3",
    "python-json-logger>=2.0.0",
    "jinja2>=3.1.2",
    "aiosmtplib>=2.0.2",
    "loguru>=0.7.3",
    "aiohttp>=3.9.0", # Added for Jira client
    "sentry-sdk[fastapi]>=2.9.0",
    "pyinstrument>=4.6.2",
    "nats-py>=2.6.0", # Added for NATS integration
    "stripe>=12.4.0",
    "maxminddb>=2.6.0",  # Local GeoIP lookups (EE growth plugin; no IPs leave the server)
    "user-agents>=2.2.0",  # User-agent parsing for analytics enrichment (EE growth plugin)
    "fastmcp>=3.2.0,<4.0.0",  # upgraded for dynamic tools and context processing
    "aiodocker>=0.21.0", # Added for agent container execution
    "kubernetes_asyncio>=30.5.0", # Added for Kubernetes agent execution
    "cel-python>=0.1.0", # Added for CEL expression evaluation in approval rules
    "python-dotenv>=1.2.1",
    # Dependencies from preloop-models
    "alembic>=1.10.0",
    "numpy>=1.24.0",
    "openai>=1.75.0",
    "asyncpg>=0.29.0",
    # Dependencies from preloop-sync
    "click>=8.0.0",
    "python-gitlab>=4.0.0",
    "APScheduler>=3.0.0",
    "pytz>=2025.2",
    "jira>=3.8.0",
    "cryptography>=42.0.0",  # For Fernet encryption of sensitive data
    "firebase-admin>=6.0.0",  # For Android FCM push notifications
    # Gateway upstream + cost engine. The floor matches the streaming-usage and
    # register_model semantics the gateway accounting relies on (verified on
    # 1.81.x); the ceiling guards those internals — bump deliberately with the
    # gateway streaming tests.
    "litellm>=1.81.13,<1.90",
    "boto3>=1.34.0",  # For AWS Bedrock support through litellm
    "webauthn>=2.0.0",  # WebAuthn passkey registration/authentication ceremonies
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
]

[project.urls]
Homepage = "https://preloop.ai"
Documentation = "https://docs.preloop.ai"
Repository = "https://github.com/preloop/preloop"
Changelog = "https://github.com/preloop/preloop/blob/main/CHANGELOG.md"
Issues = "https://github.com/preloop/preloop/issues"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["preloop", "preloop.*"]

[project.scripts]
preloop-sync = "preloop.sync.cli.commands:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.12.0",
    "pytest-split>=0.10.0",
    "python-dotenv>=0.21.0", # Added python-dotenv
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.1",
    "pymdown-extensions>=10.0",
    "pre-commit>=4.2.0",
    "ruff>=0.11.3",
    "httpx>=0.24.1",
    "playwright>=1.30.0",
    "pytest-playwright>=0.4.0",
    "mcp>=1.0.0,<2",  # MCP client for integration tests; v2 dropped streamablehttp_client
    "PyYAML>=6.0",  # test_nginx_route_parity imports yaml
    "jsonschema>=4.0",  # test_cra_result_json_contract validates fixtures
]
ai-providers = [
    "anthropic>=0.39.0",  # For Anthropic Claude API key validation
    "google-generativeai>=0.8.0",  # For Google Gemini API key validation
]
push-notifications = [
    "firebase-admin>=6.0.0",  # For Android FCM push notifications
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "backend"
exclude = ["backend/preloop/models/conftest.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

# Linting options
[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "W"]
ignore = ["B008", "E501", "F841", "E741", "B904", "N805", "F821"]  # Ignore problematic rules for now
extend-ignore = ["I001"]

# Format configuration
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
    "backend/tests",
]
# Exclude proprietary plugin tests - they should be run from preloop-ee context
# Exclude scripts directory - contains manual test scripts, not unit tests
norecursedirs = [
    "backend/preloop/plugins/proprietary",
    "plugins",
    "scripts",
]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests that require external services",
    "mcp: tests that use Claude MCP tools",
    "github: GitHub-specific tests",
    "gitlab: GitLab-specific tests",
    "jira: Jira-specific tests",
]
filterwarnings = [
    # Ignore pytest asyncio marker on non-async functions (class-level pytestmark)
    "ignore::pytest.PytestWarning",
    # Ignore Pydantic V2 deprecation warnings (will fix in future migration)
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    # Ignore passlib crypt deprecation
    "ignore:'crypt' is deprecated:DeprecationWarning",
    # Ignore pythonjsonlogger move warning
    "ignore:pythonjsonlogger.jsonlogger has been moved:DeprecationWarning",
    # Ignore datetime.utcnow() deprecation (will fix in future cleanup)
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
    # Ignore FastAPI duplicate operation ID warnings (caused by permission decorators)
    "ignore:Duplicate Operation ID:UserWarning",
    # Ignore coroutine never awaited in tests (mock issue)
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = [
    "preloop",
]
relative_files = true

[tool.coverage.paths]
source = [
    "backend/preloop",
]

[tool.coverage.report]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]
