[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preloop-browser-use"
version = "0.1.0"
description = "Report Browser Use agent steps and screenshots to a Preloop runtime session timeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Preloop" }]
dependencies = ["httpx>=0.27,<1"]
keywords = ["preloop", "browser-use", "browser-agents", "observability", "timeline"]

[project.optional-dependencies]
# Supported Browser Use range. The adapter reads AgentHistory by attribute
# name only; tests replay recorded history dumps from this range.
browser-use = ["browser-use>=0.5,<0.8"]

[project.urls]
Homepage = "https://preloop.ai"
Repository = "https://github.com/preloop/preloop"
Documentation = "https://docs.preloop.ai/guide/browser-agents/"

[tool.setuptools.packages.find]
where = ["src"]
