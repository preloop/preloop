[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preloop-hermes-plugin"
version = "0.3.1"
description = "Approve or deny your Hermes agent's dangerous tool calls from your phone, watch, Slack or the web, and talk to a running session from anywhere."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Preloop" }]
dependencies = [
  "aiohttp>=3.9",
  "PyYAML>=6.0",
  "preloop>=0.9.3",
]
keywords = [
  "preloop",
  "hermes",
  "approvals",
  "tool-approval",
  "human-in-the-loop",
  "governance",
  "policy",
  "audit",
  "budget",
  "cost-control",
  "control-plane",
  "remote-control",
  "agent-control",
  "observability",
  "autonomous-agents",
]

[project.urls]
Homepage = "https://preloop.ai"
Repository = "https://github.com/preloop/preloop"
Documentation = "https://docs.preloop.ai"

[project.entry-points."hermes_agent.plugins"]
preloop = "preloop_hermes_plugin.plugin"

[project.scripts]
preloop-hermes-plugin = "preloop_hermes_plugin.plugin:main"

[tool.setuptools.packages.find]
where = ["src"]
