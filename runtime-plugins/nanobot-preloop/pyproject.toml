[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preloop-nanobot-plugin"
version = "0.1.0"
description = "Governed, bounded Nanobot runtime for Preloop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["preloop>=0.15.0", "aiohttp>=3.9", "nanobot-ai==0.1.4.post3"]

[project.scripts]
preloop-nanobot-plugin = "preloop_nanobot_plugin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
